<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product Details | PikoBuy Finland</title>
  <link rel="icon" href="https://www.pikobuy.com/images/common/pikobuy-icon-192.png">
  <link rel="stylesheet" href="/internal-pages.css">
  <style>
    .product-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,330px);gap:36px;padding:24px 0 56px;align-items:start}.product-info{position:sticky;top:20px;padding-top:28px}.product-info h1{font-size:clamp(2rem,3.6vw,3.6rem);line-height:.98;letter-spacing:-.065em;margin:9px 0 14px}.product-id{color:var(--muted);font-size:.9rem;margin:0}.price{font-size:1.65rem;font-weight:900;color:var(--blue);margin:17px 0}.button{display:inline-block;background:var(--blue);color:#fff;border-radius:11px;padding:12px 16px;font-weight:850}.source{display:inline-block;margin-top:13px;color:var(--muted);font-size:.86rem;font-weight:750}.media-flow{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#fff}.back-row{padding:10px 12px;border-bottom:1px solid var(--line);background:#fbfefd}.back-button{border:0;background:transparent;color:var(--ink);font:800 .82rem inherit;cursor:pointer;padding:4px 0}.back-button:hover{color:var(--blue)}.media-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 14px;color:var(--muted);font-size:.78rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:#f6fbfa}.media-heading b{color:var(--ink)}.main-image{display:block;width:100%;max-height:540px;object-fit:contain;background:#fff}.thumbs{display:flex;gap:9px;overflow:auto;padding:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fbfefd}.thumbs button{width:78px;height:78px;flex:0 0 auto;padding:2px;border:2px solid transparent;border-radius:10px;background:#fff;cursor:pointer}.thumbs button.active{border-color:var(--blue)}.thumbs img{width:100%;height:100%;object-fit:cover;border-radius:7px}.media-note{padding:18px 14px;color:var(--muted);font-size:.88rem;background:#fbfefd;border-top:1px solid var(--line)}.weidian-image{display:block;width:100%;height:auto}.image-fallback{padding:28px;color:var(--muted)}@media(max-width:800px){.product-layout{grid-template-columns:1fr;gap:18px;padding:14px 0 36px}.product-info{position:static;padding-top:0}.product-info h1{font-size:clamp(1.8rem,9vw,2.65rem)}.price{margin:11px 0}.thumbs{padding:8px;gap:7px}.thumbs button{width:62px;height:62px}.media-flow{border-radius:14px}}
  </style>
</head>
<body>
  <header class="shell header"><a class="brand" href="index.html"><img src="https://www.pikobuy.com/images/header/pikobuy-logo-figma.png" alt="PikoBuy"></a><nav class="nav"><a href="index.html">Home</a><a href="categories.html">Categories</a><a class="active" data-i18n="products" href="category.html?category=all">Product Details</a><a href="checklist.html">Checklist</a><a data-i18n="seo" href="seo-articles.html">SEO Articles</a><a data-i18n="faq" href="faq.html">FAQ</a></nav><select class="language-select" aria-label="Language"><option value="en">Language · EN</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option><option value="it">Italiano</option><option value="pt">Português</option><option value="nl">Nederlands</option><option value="pl">Polski</option><option value="sv">Svenska</option></select><a data-i18n="register" class="register" target="_blank" rel="nofollow" href="https://www.pikobuy.com/register?invitedCode=KPNJVF&inviteUserId=1109716">Register ↗</a></header>
  <main class="shell" id="detail"><p class="image-fallback">Loading product details.</p></main>
  <footer><div class="shell">Independent PikoBuy spreadsheet discovery and product-guide project.</div></footer>
  <script>
    const id=new URLSearchParams(location.search).get('id');
    const esc=v=>String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    const uniqueImages=list=>[...new Set((Array.isArray(list)?list:[]).filter(Boolean))];
    const sixImages=list=>uniqueImages(list).slice(0,6);
    Promise.all([fetch('/products.json').then(r=>r.json()),fetch('/product-media.json').then(r=>r.ok?r.json():{})]).then(([data,media])=>{
      const record=data.products.find(x=>x.id===id)||data.products[0];
      const p={...record,...(media[record.id]||{})};
      const qcImages=sixImages(p.qcImages);
      // Never repeat a photo to fill a slot.  A product may show fewer than
      // six source images until FindSpreadsheet exports more distinct media.
      const weidianImages=sixImages([...(p.weidianImages||p.sourceImages||[]),p.image]);
      const topImages=qcImages.length===6?qcImages:weidianImages;
      const topUsesQc=qcImages.length===6;
      const topCount=`${topImages.length} unique ${topUsesQc?'QC':'Weidian source'} image${topImages.length===1?'':'s'}`;
      const qcSection=topImages.length
        ? `<div class="media-heading"><b>${topUsesQc?'QC photo set':'Weidian image set'}</b><span>${topUsesQc?'6 verified QC images':topCount}</span></div><img id="mainImage" class="main-image" src="${topImages[0]}" alt="${esc(p.title)} ${topUsesQc?'QC':'Weidian'} image"><div class="thumbs" aria-label="Selectable ${topUsesQc?'QC':'Weidian'} image thumbnails">${topImages.map((src,i)=>`<button class="${i===0?'active':''}" data-src="${src}" aria-label="Show ${topUsesQc?'QC':'Weidian'} image ${i+1} of ${topImages.length}"><img src="${src}" alt="${topUsesQc?'QC':'Weidian'} image ${i+1} of ${topImages.length}"></button>`).join('')}</div>${topImages.length<6?'<p class="media-note">Only distinct source images are shown. Repeated images are not used.</p>':''}`
        : `<div class="media-heading"><b>QC photo set</b><span>QC unavailable</span></div><p class="media-note">Six verified QC photos or six different Weidian images have not been exported for this item yet.</p>`;
      const weidianSection=`<div class="media-heading"><b>Weidian original image sequence</b><span>${weidianImages.length} distinct source image${weidianImages.length===1?'':'s'}</span></div>${weidianImages.map((src,i)=>`<img class="weidian-image" src="${src}" alt="${esc(p.title)} original Weidian image ${i+1} of ${weidianImages.length}">`).join('')}`;
      document.title=p.title+' | PikoBuy Finland';
      document.querySelector('#detail').innerHTML=`<div class="product-layout"><section class="media-flow" aria-label="Product media"><div class="back-row"><button class="back-button" id="backButton" type="button">← Back to products</button></div>${qcSection}${weidianSection}</section><aside class="product-info"><span class="eyebrow">${esc(p.categoryLabel)}</span><h1>${esc(p.title)}</h1><p class="product-id">Product ID · ${esc(p.id)}${p.weidianId?' · Weidian ID '+esc(p.weidianId):''}</p><p class="price">$${(Number(p.price||0)*.14).toFixed(2)}</p><a class="button" target="_blank" rel="nofollow" href="https://www.pikobuy.com/product/detail?productUrl=${encodeURIComponent('https://weidian.com/item.html?itemID='+p.weidianId)}">Buy with PikoBuy ↗</a><br><a class="source" href="category.html?category=${encodeURIComponent(p.category)}">← Back to category</a></aside></div>`;
      document.querySelectorAll('.thumbs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.thumbs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#mainImage').src=b.dataset.src});
      document.querySelector('#backButton').onclick=()=>{if(document.referrer.includes(location.host))history.back();else location.href='category.html?category='+encodeURIComponent(p.category)};
    }).catch(()=>document.querySelector('#detail').innerHTML='<p class="image-fallback">This product could not be loaded. Return to the category to choose another product.</p>');
  </script>
  <script src="/site.js" defer></script>
</body>
</html>
