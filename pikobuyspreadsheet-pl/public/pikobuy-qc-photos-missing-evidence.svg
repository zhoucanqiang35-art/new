<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">PikoBuy QC photos missing evidence checklist</title>
  <desc id="desc">Five steps: confirm warehouse status, classify the photo gap, protect the return clock, request one action, and review the recovered evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ec"/>
      <stop offset="1" stop-color="#e8efe9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17362e" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <circle cx="1080" cy="92" r="125" fill="#d6e6dc" opacity=".7"/>
  <circle cx="96" cy="615" r="165" fill="#efe1bd" opacity=".62"/>
  <text x="70" y="82" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="2.2" fill="#b85c36">WAREHOUSE EVIDENCE</text>
  <text x="70" y="132" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#17362e">QC photos not showing?</text>
  <text x="70" y="168" font-family="Arial, sans-serif" font-size="20" fill="#415d55">Treat the missing image as a record gap—not as a passed inspection.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="220" width="196" height="252" rx="22" fill="#fffdf8"/>
    <rect x="286" y="220" width="196" height="252" rx="22" fill="#fffdf8"/>
    <rect x="502" y="220" width="196" height="252" rx="22" fill="#fffdf8"/>
    <rect x="718" y="220" width="196" height="252" rx="22" fill="#fffdf8"/>
    <rect x="934" y="220" width="196" height="252" rx="22" fill="#fffdf8"/>
  </g>

  <g font-family="Arial, sans-serif">
    <g transform="translate(92 246)">
      <circle cx="28" cy="28" r="28" fill="#17362e"/><text x="28" y="36" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">1</text>
      <text x="0" y="92" font-size="22" font-weight="700" fill="#17362e">Confirm status</text>
      <text x="0" y="127" font-size="16" fill="#52665f">Save the first</text><text x="0" y="150" font-size="16" fill="#52665f">In Warehouse time</text>
      <rect x="0" y="177" width="150" height="32" rx="16" fill="#e8efe9"/><text x="75" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#17362e">Order + timestamp</text>
    </g>
    <g transform="translate(308 246)">
      <circle cx="28" cy="28" r="28" fill="#b85c36"/><text x="28" y="36" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">2</text>
      <text x="0" y="92" font-size="22" font-weight="700" fill="#17362e">Name the gap</text>
      <text x="0" y="127" font-size="16" fill="#52665f">None, wrong,</text><text x="0" y="150" font-size="16" fill="#52665f">incomplete or unclear</text>
      <rect x="0" y="177" width="150" height="32" rx="16" fill="#f4e6de"/><text x="75" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3a24">Exact failure</text>
    </g>
    <g transform="translate(524 246)">
      <circle cx="28" cy="28" r="28" fill="#d49f31"/><text x="28" y="36" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">3</text>
      <text x="0" y="92" font-size="22" font-weight="700" fill="#17362e">Protect time</text>
      <text x="0" y="127" font-size="16" fill="#52665f">Record the published</text><text x="0" y="150" font-size="16" fill="#52665f">return-clock trigger</text>
      <rect x="0" y="177" width="150" height="32" rx="16" fill="#f7edcf"/><text x="75" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#73520f">Deadline record</text>
    </g>
    <g transform="translate(740 246)">
      <circle cx="28" cy="28" r="28" fill="#557e70"/><text x="28" y="36" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">4</text>
      <text x="0" y="92" font-size="22" font-weight="700" fill="#17362e">Request action</text>
      <text x="0" y="127" font-size="16" fill="#52665f">Restore, relink or</text><text x="0" y="150" font-size="16" fill="#52665f">quote a detail photo</text>
      <rect x="0" y="177" width="150" height="32" rx="16" fill="#e2ece8"/><text x="75" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#36594d">One ticket</text>
    </g>
    <g transform="translate(956 246)">
      <circle cx="28" cy="28" r="28" fill="#17362e"/><text x="28" y="36" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">5</text>
      <text x="0" y="92" font-size="22" font-weight="700" fill="#17362e">Review again</text>
      <text x="0" y="127" font-size="16" fill="#52665f">Match item, variant,</text><text x="0" y="150" font-size="16" fill="#52665f">quantity and condition</text>
      <rect x="0" y="177" width="150" height="32" rx="16" fill="#e8efe9"/><text x="75" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#17362e">Before shipping</text>
    </g>
  </g>

  <path d="M266 346h20M482 346h20M698 346h20M914 346h20" stroke="#9cafaa" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 9"/>
  <rect x="70" y="524" width="1060" height="92" rx="22" fill="#17362e"/>
  <text x="600" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.8" fill="#d6e6dc">DECISION RULE</text>
  <text x="600" y="596" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#fffdf8">No usable photo means “not verified”—not “approved.”</text>
</svg>
