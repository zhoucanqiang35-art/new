<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">PikoBuy damaged parcel evidence flow</title>
  <desc id="desc">Five steps from inspecting the sealed parcel through documenting, comparing, classifying and reporting delivery damage.</desc>
  <rect width="1200" height="675" rx="36" fill="#f6f1e8"/>
  <rect x="52" y="48" width="1096" height="579" rx="28" fill="#fffdf8" stroke="#1d2b2a" stroke-width="3"/>
  <text x="92" y="111" fill="#1d2b2a" font-family="Arial, sans-serif" font-size="34" font-weight="700">Damaged parcel: preserve the evidence chain</text>
  <text x="92" y="148" fill="#52615f" font-family="Arial, sans-serif" font-size="20">Record observable facts before packaging or contents change.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(85 210)">
      <rect width="184" height="240" rx="22" fill="#e7f0e7" stroke="#1d2b2a" stroke-width="2"/>
      <circle cx="92" cy="53" r="27" fill="#26734d"/><text x="92" y="62" text-anchor="middle" fill="white" font-size="24" font-weight="700">1</text>
      <text x="92" y="111" text-anchor="middle" fill="#1d2b2a" font-size="22" font-weight="700">SEALED</text>
      <text x="92" y="146" text-anchor="middle" fill="#42514f" font-size="16"><tspan x="92">All six sides, label,</tspan><tspan x="92" dy="24">seals and damage</tspan></text>
    </g>
    <path d="M280 330h35" stroke="#c0643b" stroke-width="6" stroke-linecap="round"/><path d="m306 318 14 12-14 12" fill="none" stroke="#c0643b" stroke-width="6"/>
    <g transform="translate(322 210)">
      <rect width="184" height="240" rx="22" fill="#f7e6d7" stroke="#1d2b2a" stroke-width="2"/>
      <circle cx="92" cy="53" r="27" fill="#c0643b"/><text x="92" y="62" text-anchor="middle" fill="white" font-size="24" font-weight="700">2</text>
      <text x="92" y="111" text-anchor="middle" fill="#1d2b2a" font-size="22" font-weight="700">OPEN</text>
      <text x="92" y="146" text-anchor="middle" fill="#42514f" font-size="16"><tspan x="92">Continuous video and</tspan><tspan x="92" dy="24">packing layers</tspan></text>
    </g>
    <path d="M517 330h35" stroke="#c0643b" stroke-width="6" stroke-linecap="round"/><path d="m543 318 14 12-14 12" fill="none" stroke="#c0643b" stroke-width="6"/>
    <g transform="translate(559 210)">
      <rect width="184" height="240" rx="22" fill="#e6edf5" stroke="#1d2b2a" stroke-width="2"/>
      <circle cx="92" cy="53" r="27" fill="#315f86"/><text x="92" y="62" text-anchor="middle" fill="white" font-size="24" font-weight="700">3</text>
      <text x="92" y="111" text-anchor="middle" fill="#1d2b2a" font-size="22" font-weight="700">COMPARE</text>
      <text x="92" y="146" text-anchor="middle" fill="#42514f" font-size="16"><tspan x="92">Warehouse, packed</tspan><tspan x="92" dy="24">and delivered records</tspan></text>
    </g>
    <path d="M754 330h35" stroke="#c0643b" stroke-width="6" stroke-linecap="round"/><path d="m780 318 14 12-14 12" fill="none" stroke="#c0643b" stroke-width="6"/>
    <g transform="translate(796 210)">
      <rect width="184" height="240" rx="22" fill="#f1e7f5" stroke="#1d2b2a" stroke-width="2"/>
      <circle cx="92" cy="53" r="27" fill="#74518a"/><text x="92" y="62" text-anchor="middle" fill="white" font-size="24" font-weight="700">4</text>
      <text x="92" y="111" text-anchor="middle" fill="#1d2b2a" font-size="22" font-weight="700">CLASSIFY</text>
      <text x="92" y="146" text-anchor="middle" fill="#42514f" font-size="16"><tspan x="92">Outer, internal, wet,</tspan><tspan x="92" dy="24">opened or missing</tspan></text>
    </g>
    <path d="M991 330h35" stroke="#c0643b" stroke-width="6" stroke-linecap="round"/><path d="m1017 318 14 12-14 12" fill="none" stroke="#c0643b" stroke-width="6"/>
    <g transform="translate(1033 210)">
      <rect width="82" height="240" rx="22" fill="#1d2b2a"/>
      <circle cx="41" cy="53" r="27" fill="#c7d976"/><text x="41" y="62" text-anchor="middle" fill="#1d2b2a" font-size="24" font-weight="700">5</text>
      <text transform="translate(47 112) rotate(90)" fill="white" font-size="19" font-weight="700">REPORT</text>
    </g>
  </g>
  <rect x="85" y="492" width="1030" height="80" rx="18" fill="#1d2b2a"/>
  <text x="600" y="528" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="21" font-weight="700">Keep originals · describe observations · ask for the exact deadline and required documents</text>
  <text x="600" y="555" text-anchor="middle" fill="#c7d976" font-family="Arial, sans-serif" font-size="16">Evidence supports review; it does not guarantee liability or compensation.</text>
</svg>
