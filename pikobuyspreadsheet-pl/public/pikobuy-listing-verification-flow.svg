<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">PikoBuy seller and listing verification flow</title>
  <desc id="desc">A five-step pre-payment flow: open the source, match the item, lock the exact variant, assess seller evidence, and decide to proceed, clarify, or reject.</desc>
  <rect width="1200" height="675" rx="34" fill="#f5f2e9"/>
  <path d="M0 510C220 450 380 610 620 535s370-55 580 35v105H0z" fill="#e7eadc"/>
  <circle cx="1050" cy="105" r="118" fill="#c8ef43" opacity=".42"/>
  <text x="72" y="82" fill="#172437" font-family="Georgia,serif" font-size="44" font-weight="700">Verify before the first payment</text>
  <text x="72" y="122" fill="#596471" font-family="Arial,sans-serif" font-size="18">One source link. Five evidence checks. Three honest outcomes.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(65 190)"><rect width="190" height="220" rx="22" fill="#fff" stroke="#d6d3c9"/><circle cx="32" cy="34" r="17" fill="#172437"/><text x="32" y="40" fill="#c8ef43" font-size="16" font-weight="700" text-anchor="middle">1</text><text x="22" y="88" fill="#172437" font-size="21" font-weight="700">Open source</text><text x="22" y="122" fill="#65707b" font-size="14">Keep the complete URL,</text><text x="22" y="145" fill="#65707b" font-size="14">platform, seller and date.</text><path d="M22 178h112" stroke="#f27b64" stroke-width="4" stroke-linecap="round"/></g>
    <path d="M270 300h35" stroke="#172437" stroke-width="3" stroke-linecap="round"/><path d="m296 291 11 9-11 9" fill="none" stroke="#172437" stroke-width="3"/>
    <g transform="translate(320 190)"><rect width="190" height="220" rx="22" fill="#fff" stroke="#d6d3c9"/><circle cx="32" cy="34" r="17" fill="#172437"/><text x="32" y="40" fill="#c8ef43" font-size="16" font-weight="700" text-anchor="middle">2</text><text x="22" y="88" fill="#172437" font-size="21" font-weight="700">Match item</text><text x="22" y="122" fill="#65707b" font-size="14">Compare ID, title, images</text><text x="22" y="145" fill="#65707b" font-size="14">and distinctive details.</text><path d="M22 178h112" stroke="#f27b64" stroke-width="4" stroke-linecap="round"/></g>
    <path d="M525 300h35" stroke="#172437" stroke-width="3" stroke-linecap="round"/><path d="m551 291 11 9-11 9" fill="none" stroke="#172437" stroke-width="3"/>
    <g transform="translate(575 190)"><rect width="190" height="220" rx="22" fill="#fff" stroke="#d6d3c9"/><circle cx="32" cy="34" r="17" fill="#172437"/><text x="32" y="40" fill="#c8ef43" font-size="16" font-weight="700" text-anchor="middle">3</text><text x="22" y="88" fill="#172437" font-size="21" font-weight="700">Lock variant</text><text x="22" y="122" fill="#65707b" font-size="14">Write colour, size, model,</text><text x="22" y="145" fill="#65707b" font-size="14">bundle and quantity.</text><path d="M22 178h112" stroke="#f27b64" stroke-width="4" stroke-linecap="round"/></g>
    <path d="M780 300h35" stroke="#172437" stroke-width="3" stroke-linecap="round"/><path d="m806 291 11 9-11 9" fill="none" stroke="#172437" stroke-width="3"/>
    <g transform="translate(830 190)"><rect width="190" height="220" rx="22" fill="#fff" stroke="#d6d3c9"/><circle cx="32" cy="34" r="17" fill="#172437"/><text x="32" y="40" fill="#c8ef43" font-size="16" font-weight="700" text-anchor="middle">4</text><text x="22" y="88" fill="#172437" font-size="21" font-weight="700">Check seller</text><text x="22" y="122" fill="#65707b" font-size="14">Record visible credibility,</text><text x="22" y="145" fill="#65707b" font-size="14">deposit and return terms.</text><path d="M22 178h112" stroke="#f27b64" stroke-width="4" stroke-linecap="round"/></g>
  </g>
  <g transform="translate(195 505)" font-family="Arial,sans-serif"><rect width="810" height="112" rx="26" fill="#172437"/><text x="40" y="45" fill="#fff" font-size="18" font-weight="700">5 · Decide from the evidence</text><g transform="translate(40 64)"><rect width="205" height="30" rx="15" fill="#c8ef43"/><text x="102" y="21" fill="#172437" font-size="13" font-weight="700" text-anchor="middle">PROCEED · checks agree</text><rect x="255" width="215" height="30" rx="15" fill="#f2c895"/><text x="362" y="21" fill="#172437" font-size="13" font-weight="700" text-anchor="middle">CLARIFY · one gap remains</text><rect x="480" width="205" height="30" rx="15" fill="#f27b64"/><text x="582" y="21" fill="#172437" font-size="13" font-weight="700" text-anchor="middle">REJECT · mismatch or risk</text></g></g>
</svg>
