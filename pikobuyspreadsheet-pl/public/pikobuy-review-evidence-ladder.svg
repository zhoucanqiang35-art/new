<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">PikoBuy review evidence ladder</title>
  <desc id="desc">Five levels rank review evidence from dated order records at the top to unsupported promotional claims at the bottom.</desc>
  <rect width="1200" height="675" rx="28" fill="#f4f1e8"/>
  <text x="70" y="76" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#bb4b2f">REVIEW EVIDENCE LADDER</text>
  <text x="70" y="124" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#182a2a">Evidence before confidence</text>
  <text x="70" y="158" font-family="Arial, sans-serif" font-size="18" fill="#50615f">Match every claim to the seller, warehouse, parcel, carrier or after-sales stage.</text>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="202" width="760" height="72" rx="12" fill="#173c39"/>
    <circle cx="110" cy="238" r="20" fill="#d9aa43"/><text x="104" y="245" font-size="20" font-weight="700" fill="#173c39">1</text>
    <text x="150" y="232" font-size="20" font-weight="700" fill="#fff">Dated order records</text>
    <text x="150" y="255" font-size="15" fill="#d9e5e1">Listing, payments, QC, route, tracking and final outcome</text>

    <rect x="110" y="286" width="720" height="72" rx="12" fill="#245752"/>
    <circle cx="150" cy="322" r="20" fill="#d9aa43"/><text x="144" y="329" font-size="20" font-weight="700" fill="#173c39">2</text>
    <text x="190" y="316" font-size="20" font-weight="700" fill="#fff">Complete, redacted timeline</text>
    <text x="190" y="339" font-size="15" fill="#d9e5e1">Country, product, route and dates make one account testable</text>

    <rect x="150" y="370" width="680" height="72" rx="12" fill="#3f746d"/>
    <circle cx="190" cy="406" r="20" fill="#f1d99f"/><text x="184" y="413" font-size="20" font-weight="700" fill="#173c39">3</text>
    <text x="230" y="400" font-size="20" font-weight="700" fill="#fff">Large, varied platform sample</text>
    <text x="230" y="423" font-size="15" fill="#edf5f1">Useful only when the sample and collection method are clear</text>

    <rect x="190" y="454" width="640" height="72" rx="12" fill="#d7b15e"/>
    <circle cx="230" cy="490" r="20" fill="#fff3cf"/><text x="224" y="497" font-size="20" font-weight="700" fill="#604817">4</text>
    <text x="270" y="484" font-size="20" font-weight="700" fill="#3b321f">Single anecdote</text>
    <text x="270" y="507" font-size="15" fill="#554827">May be sincere; cannot establish a general success rate</text>

    <rect x="230" y="538" width="600" height="72" rx="12" fill="#d86a4b"/>
    <circle cx="270" cy="574" r="20" fill="#ffe6dd"/><text x="264" y="581" font-size="20" font-weight="700" fill="#7a2b1a">5</text>
    <text x="310" y="568" font-size="20" font-weight="700" fill="#fff">Promo or unsupported claim</text>
    <text x="310" y="591" font-size="15" fill="#fff1ed">Coupon, referral or verdict without order-stage evidence</text>
  </g>

  <rect x="875" y="202" width="255" height="408" rx="18" fill="#fff" stroke="#d8d3c7" stroke-width="2"/>
  <text x="910" y="247" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#bb4b2f">ASK FIVE THINGS</text>
  <g font-family="Arial, sans-serif" fill="#182a2a">
    <text x="910" y="296" font-size="20" font-weight="700">Who?</text><text x="910" y="319" font-size="15" fill="#5c6967">Seller, PikoBuy or carrier</text>
    <text x="910" y="363" font-size="20" font-weight="700">What?</text><text x="910" y="386" font-size="15" fill="#5c6967">Exact product and problem</text>
    <text x="910" y="430" font-size="20" font-weight="700">When?</text><text x="910" y="453" font-size="15" fill="#5c6967">Dated order stage</text>
    <text x="910" y="497" font-size="20" font-weight="700">Proof?</text><text x="910" y="520" font-size="15" fill="#5c6967">Record, photo or tracking event</text>
    <text x="910" y="564" font-size="20" font-weight="700">Outcome?</text><text x="910" y="587" font-size="15" fill="#5c6967">Resolved, failed or pending</text>
  </g>
  <text x="70" y="646" font-family="Arial, sans-serif" font-size="14" fill="#6d7775">Independent editorial diagram · pikobuyspreadsheet.pl · 5 September 2026</text>
</svg>
