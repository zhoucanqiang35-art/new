<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">PikoBuy warehouse damage decision checklist</title>
  <desc id="desc">Five steps for preserving photos, classifying visible damage, protecting the warehouse deadline, requesting a recorded decision and holding the item from international shipping.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f3e8"/>
      <stop offset="1" stop-color="#e7efe9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#17352b" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#background)"/>
  <path d="M0 88h1200" stroke="#17352b" stroke-opacity=".1"/>
  <text x="70" y="58" fill="#17352b" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">WAREHOUSE DAMAGE · BEFORE INTERNATIONAL SHIPPING</text>
  <text x="70" y="140" fill="#17352b" font-family="Arial, sans-serif" font-size="42" font-weight="700">Preserve the evidence while the decision is reversible.</text>
  <text x="70" y="178" fill="#52685f" font-family="Arial, sans-serif" font-size="20">A visible mark is a reason to investigate—not an automatic ruling about cause, cost or refund.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="235" width="200" height="235" rx="20" fill="#ffffff"/>
    <rect x="285" y="235" width="200" height="235" rx="20" fill="#ffffff"/>
    <rect x="500" y="235" width="200" height="235" rx="20" fill="#ffffff"/>
    <rect x="715" y="235" width="200" height="235" rx="20" fill="#ffffff"/>
    <rect x="930" y="235" width="200" height="235" rx="20" fill="#17352b"/>
  </g>

  <g font-family="Arial, sans-serif">
    <g fill="#c74e35" font-size="18" font-weight="700">
      <text x="95" y="275">01</text><text x="310" y="275">02</text><text x="525" y="275">03</text><text x="740" y="275">04</text>
    </g>
    <text x="955" y="275" fill="#f6c66e" font-size="18" font-weight="700">05</text>

    <g fill="#17352b" font-size="25" font-weight="700">
      <text x="95" y="321">Preserve</text><text x="95" y="352">the originals</text>
      <text x="310" y="321">Classify</text><text x="310" y="352">what is visible</text>
      <text x="525" y="321">Protect</text><text x="525" y="352">the deadline</text>
      <text x="740" y="321">Request</text><text x="740" y="352">one outcome</text>
    </g>
    <text x="955" y="321" fill="#ffffff" font-size="25" font-weight="700">Hold from</text>
    <text x="955" y="352" fill="#ffffff" font-size="25" font-weight="700">the parcel</text>

    <g fill="#5d6e67" font-size="17">
      <text x="95" y="395">Order, variant, first</text><text x="95" y="420">In Warehouse time,</text><text x="95" y="445">photos and notes.</text>
      <text x="310" y="395">Quality issue, wrong</text><text x="310" y="420">item, missing part or</text><text x="310" y="445">domestic transit.</text>
      <text x="525" y="395">Calculate from the first</text><text x="525" y="420">In Warehouse status;</text><text x="525" y="445">do not assume a pause.</text>
      <text x="740" y="395">Ask for return, focused</text><text x="740" y="420">photo or recorded seller</text><text x="740" y="445">decision—not everything.</text>
    </g>
    <g fill="#d8e7e1" font-size="17">
      <text x="955" y="395">Resolve the warehouse</text><text x="955" y="420">record before adding</text><text x="955" y="445">international risk.</text>
    </g>
  </g>

  <g fill="#c74e35">
    <path d="M271 350l12-8v16z"/><path d="M486 350l12-8v16z"/><path d="M701 350l12-8v16z"/><path d="M916 350l12-8v16z"/>
  </g>
  <rect x="70" y="520" width="1060" height="92" rx="18" fill="#f0d9cd"/>
  <circle cx="116" cy="566" r="20" fill="#c74e35"/>
  <path d="M116 551v19M116 582h.1" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <text x="154" y="556" fill="#71301f" font-family="Arial, sans-serif" font-size="20" font-weight="700">Keep the stages separate.</text>
  <text x="154" y="586" fill="#71301f" font-family="Arial, sans-serif" font-size="18">Warehouse evidence answers a pre-dispatch question. Destination damage needs carrier and unboxing evidence.</text>
</svg>
