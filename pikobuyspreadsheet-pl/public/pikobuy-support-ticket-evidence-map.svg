<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">PikoBuy support ticket evidence map</title>
  <desc id="desc">Five connected stages show case identity, order timeline, decisive evidence, requested action and saved follow-up.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172437"/>
      <stop offset="1" stop-color="#263d53"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#07111d" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="38" fill="url(#bg)"/>
  <circle cx="1085" cy="95" r="170" fill="#c8ef43" opacity=".1"/>
  <circle cx="80" cy="650" r="210" fill="#f27b64" opacity=".09"/>
  <text x="70" y="82" fill="#c8ef43" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="3">SUPPORT TICKET EVIDENCE MAP</text>
  <text x="70" y="128" fill="#ffffff" font-family="Georgia,serif" font-size="34" font-weight="700">One case. One timeline. One answerable request.</text>
  <path d="M148 348H1050" stroke="#ffffff" stroke-opacity=".28" stroke-width="4" stroke-dasharray="10 12"/>
  <g filter="url(#shadow)">
    <rect x="60" y="225" width="190" height="245" rx="24" fill="#ffffff"/>
    <circle cx="102" cy="268" r="22" fill="#c8ef43"/><text x="102" y="276" text-anchor="middle" fill="#172437" font-family="Arial" font-size="17" font-weight="800">1</text>
    <text x="84" y="320" fill="#172437" font-family="Georgia,serif" font-size="25" font-weight="700">Identify</text>
    <text x="84" y="355" fill="#52606d" font-family="Arial" font-size="15">Order or parcel ID</text>
    <text x="84" y="382" fill="#52606d" font-family="Arial" font-size="15">Status and country</text>
    <text x="84" y="409" fill="#52606d" font-family="Arial" font-size="15">One clear problem</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="282" y="198" width="190" height="272" rx="24" fill="#edf3f6"/>
    <circle cx="324" cy="241" r="22" fill="#f27b64"/><text x="324" y="249" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="17" font-weight="800">2</text>
    <text x="306" y="293" fill="#172437" font-family="Georgia,serif" font-size="25" font-weight="700">Timeline</text>
    <text x="306" y="328" fill="#52606d" font-family="Arial" font-size="15">Paid and selected</text>
    <text x="306" y="355" fill="#52606d" font-family="Arial" font-size="15">Warehouse event</text>
    <text x="306" y="382" fill="#52606d" font-family="Arial" font-size="15">Shipping hand-off</text>
    <text x="306" y="409" fill="#52606d" font-family="Arial" font-size="15">Latest timestamp</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="504" y="171" width="190" height="299" rx="24" fill="#c8ef43"/>
    <circle cx="546" cy="214" r="22" fill="#172437"/><text x="546" y="222" text-anchor="middle" fill="#c8ef43" font-family="Arial" font-size="17" font-weight="800">3</text>
    <text x="528" y="266" fill="#172437" font-family="Georgia,serif" font-size="25" font-weight="700">Evidence</text>
    <text x="528" y="301" fill="#32410f" font-family="Arial" font-size="15">Label each file</text>
    <text x="528" y="328" fill="#32410f" font-family="Arial" font-size="15">Keep originals</text>
    <text x="528" y="355" fill="#32410f" font-family="Arial" font-size="15">Explain what it proves</text>
    <text x="528" y="382" fill="#32410f" font-family="Arial" font-size="15">Protect private data</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="726" y="198" width="190" height="272" rx="24" fill="#edf3f6"/>
    <circle cx="768" cy="241" r="22" fill="#f27b64"/><text x="768" y="249" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="17" font-weight="800">4</text>
    <text x="750" y="293" fill="#172437" font-family="Georgia,serif" font-size="25" font-weight="700">Request</text>
    <text x="750" y="328" fill="#52606d" font-family="Arial" font-size="15">Ask one question</text>
    <text x="750" y="355" fill="#52606d" font-family="Arial" font-size="15">Name the next action</text>
    <text x="750" y="382" fill="#52606d" font-family="Arial" font-size="15">Confirm the deadline</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="948" y="225" width="190" height="245" rx="24" fill="#ffffff"/>
    <circle cx="990" cy="268" r="22" fill="#c8ef43"/><text x="990" y="276" text-anchor="middle" fill="#172437" font-family="Arial" font-size="17" font-weight="800">5</text>
    <text x="972" y="320" fill="#172437" font-family="Georgia,serif" font-size="25" font-weight="700">Follow up</text>
    <text x="972" y="355" fill="#52606d" font-family="Arial" font-size="15">Save ticket number</text>
    <text x="972" y="382" fill="#52606d" font-family="Arial" font-size="15">Reply in one thread</text>
    <text x="972" y="409" fill="#52606d" font-family="Arial" font-size="15">Record each decision</text>
  </g>
  <text x="600" y="565" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">Identify → sequence → prove → request → preserve</text>
  <text x="600" y="605" text-anchor="middle" fill="#b8c6d3" font-family="Arial,Helvetica,sans-serif" font-size="15">Evidence makes a case easier to review; it does not guarantee the outcome.</text>
</svg>
