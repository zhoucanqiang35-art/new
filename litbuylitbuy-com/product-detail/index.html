<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Details | Litbuy Finds</title><style>:root{--ink:#25131d;--paper:#fff4ed;--line:#ead6ca}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 Arial,sans-serif}a{text-decoration:none;color:inherit}.wrap{width:min(1280px,92%);margin:auto}.top{border-bottom:1px solid var(--line)}.topin{min-height:74px;display:flex;align-items:center;gap:20px}.brand{width:180px;height:44px;display:grid;overflow:hidden}.brand img{width:100%;height:100%;object-fit:contain}.nav{margin-left:auto;display:flex;align-items:center;gap:20px}.nav a{font:bold .79rem Arial}.database{background:var(--ink);color:#fff;padding:11px 14px}.hero{padding:58px 0 28px;border-bottom:2px solid var(--ink)}.eyebrow{font-size:.72rem;letter-spacing:.13em;font-weight:900;color:#a14d38}.hero h1{font-size:clamp(3.1rem,7vw,7.5rem);letter-spacing:-.1em;line-height:.78;margin:10px 0}.hero p{max-width:530px;margin:22px 0 0;color:#6a4c52}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;padding:35px 0 70px}.card{display:block;background:#fff;border:1px solid var(--line);overflow:hidden}.card img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#ead6ca}.copy{padding:13px}.copy small{display:block;font-size:.66rem;font-weight:900;letter-spacing:.1em;color:#a14d38}.copy h2{font-size:1rem;line-height:1.15;margin:7px 0;min-height:2.3em}.price{font-weight:900}.link{float:right;font-size:.73rem;color:#a14d38;font-weight:bold}@media(max-width:800px){.nav{display:none}.topin{justify-content:space-between}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.hero{padding-top:42px}}</style></head><body><header class="top"><div class="wrap topin"><a class="brand" href="/"><img src="../litbuy-horizontal-logo.png" alt="LITBUY"></a><nav class="nav"><a href="/">Home</a><a href="/categories/">Product categories</a><a href="/product-detail/">Product details</a><a href="/blog/">SEO articles</a><a href="/faq/">FAQ</a><a class="database" href="https://findspreadsheet.com/">Database</a></nav></div></header><main class="wrap"><section class="hero"><span class="eyebrow">PRODUCT DETAILS / MAIN SITE</span><h1>Current<br>finds.</h1><p>Open any card to reach the matching FindSpreadsheet product page. Prices are displayed in USD and reflect the product list at the time this selection was made.</p></section><section class="grid" id="productGrid"></section></main><script src="/products.js"></script><script>document.querySelector('#productGrid').innerHTML=litbuyProducts.map(([type,name,price,url,image])=>`<a class="card" href="${url}"><img src="${image}" alt="${name}" loading="lazy"><div class="copy"><small>${type}</small><h2>${name}</h2><span class="price">${price}</span><span class="link">View details</span></div></a>`).join('');</script><script src="/locale.js"></script></body></html>
