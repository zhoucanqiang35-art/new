<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Categories | Litbuy Finds</title><style>:root{--ink:#090810;--panel:#11101d;--line:#29263c;--amber:#f0a229;--muted:#8c8799}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:#fff;font:16px/1.5 Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1200px,92%);margin:auto}.top{min-height:74px;display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--line)}.brand{width:180px;height:44px;display:grid;overflow:hidden}.brand img{width:100%;height:100%;object-fit:contain}.nav{display:flex;gap:18px;align-items:center;margin-left:auto}.nav a{font:bold .79rem Arial}.database{background:#fff;color:var(--ink)!important;padding:11px 14px}.hero{padding:58px 0 26px;display:flex;justify-content:space-between;gap:40px;align-items:end}.eyebrow{color:var(--amber);font-size:.72rem;font-weight:900;letter-spacing:.14em}.hero h1{font-size:clamp(3rem,7vw,7rem);line-height:.82;letter-spacing:-.09em;margin:10px 0 0}.hero p{max-width:370px;color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;padding:16px 0 72px}.card{min-height:218px;padding:20px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;transition:transform .22s,border-color .22s,background .22s}.card:hover{transform:translateY(-5px);border-color:var(--amber);background:#181722}.icon{width:64px;height:64px;display:grid;place-items:center;border-radius:18px;background:#2a2118;color:var(--amber);font-size:1.45rem;font-weight:900;line-height:1;margin-bottom:17px}.card b{font-size:1rem}.card span:last-child{max-width:154px;color:var(--muted);font-size:.78rem;line-height:1.5;margin-top:7px}@media(max-width:800px){.nav{display:none}.top{justify-content:space-between}.hero{display:block;padding:34px 0 16px}.hero p{margin-top:12px}.hero h1{font-size:clamp(2.8rem,15vw,4.6rem)}.grid{display:flex;overflow-x:auto;gap:10px;scroll-snap-type:x mandatory;padding:12px 4% 20px 0;margin-right:-4%;scrollbar-width:thin}.card{flex:0 0 148px;min-height:154px;padding:14px 10px;scroll-snap-align:start}.icon{width:48px;height:48px;border-radius:14px;font-size:1.1rem;margin-bottom:10px}.card span:last-child{font-size:.68rem;line-height:1.35}}</style></head><body><div class="wrap"><header class="top"><a class="brand" href="/"><img src="../litbuy-horizontal-logo.png" alt="Litbuy"></a><nav class="nav"><a href="/">Home</a><a href="/categories/">Product categories</a><a href="/product-detail/">Product details</a><a href="/blog/">SEO articles</a><a href="/faq/">FAQ</a><a class="database" href="https://findspreadsheet.com/">Database</a></nav></header><section class="hero"><div><span class="eyebrow">TEN PRODUCT ROUTES</span><h1>Choose a<br>category.</h1></div><p>Each card opens the matching FindSpreadsheet category directly.</p></section><main class="grid" id="grid"></main></div><script>const base='https://findspreadsheet.com/search.html?keywords=';const categories=[['Shoes','shoes','⌁','Premium footwear collections and latest releases.'],['Hoodies/Sweaters','hoodies sweaters','⌂','Cozy hoodies and stylish sweaters for every season.'],['T-Shirts','t-shirts','T','Trendy graphic tees and essential basics.'],['Jackets','jackets','▣','Outerwear from bombers to parkas for all weather.'],['Pants/Shorts','pants shorts','▱','Bottoms from cargo pants to athletic shorts.'],['Headwear','hats','◌','Caps, beanies and hats to complete your look.'],['Sets','sets','◇','Coordinated outfit sets for effortless style.'],['Underwear/Underpants','underwear','▤','Comfort essentials and premium undergarments.'],['Jersey','jersey','◍','Sports jerseys and athletic performance wear.'],['Accessories','accessories','□','Bags, jewelry and finishing touches for any outfit.']];document.querySelector('#grid').innerHTML=categories.map(([name,key,icon,description])=>`<a class="card" href="${base+encodeURIComponent(key)}"><span class="icon" aria-hidden="true">${icon}</span><b>${name}</b><span>${description}</span></a>`).join('')</script><script src="/locale.js"></script></body></html>
