<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">LoloBuy Chinese domestic cost flow</title>
  <desc id="desc">A five-stage diagram separating seller price, Chinese domestic shipping, possible order adjustment, warehouse reconciliation and later international freight.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">Separate each cost before you pay</text>
  <text x="70" y="108" fill="#475569" font-family="Arial, sans-serif" font-size="18">Seller-to-warehouse delivery and international freight are different stages.</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="70" y="165" width="300" height="140" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <circle cx="110" cy="205" r="22" fill="#4f46e5"/>
    <text x="103" y="213" fill="#ffffff" font-size="22" font-weight="700">1</text>
    <text x="145" y="201" fill="#0f172a" font-size="22" font-weight="700">Seller listing</text>
    <text x="98" y="244" fill="#475569" font-size="17">Exact option + quantity</text>
    <text x="98" y="273" fill="#475569" font-size="17">Live item price + offer evidence</text>

    <rect x="450" y="165" width="300" height="140" rx="18" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    <circle cx="490" cy="205" r="22" fill="#0284c7"/>
    <text x="483" y="213" fill="#ffffff" font-size="22" font-weight="700">2</text>
    <text x="525" y="201" fill="#0f172a" font-size="22" font-weight="700">China delivery</text>
    <text x="478" y="244" fill="#475569" font-size="17">Seller → LoloBuy warehouse</text>
    <text x="478" y="273" fill="#475569" font-size="17">Check same-seller checkout</text>

    <rect x="830" y="165" width="300" height="140" rx="18" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <circle cx="870" cy="205" r="22" fill="#ea580c"/>
    <text x="863" y="213" fill="#ffffff" font-size="22" font-weight="700">3</text>
    <text x="905" y="201" fill="#0f172a" font-size="22" font-weight="700">Adjustment?</text>
    <text x="858" y="244" fill="#475569" font-size="17">Price or domestic-fee change</text>
    <text x="858" y="273" fill="#475569" font-size="17">Verify in the order record</text>
  </g>

  <path d="M370 235H435" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M750 235H815" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M980 305V365H750" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="450" y="365" width="300" height="140" rx="18" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <circle cx="490" cy="405" r="22" fill="#16a34a"/>
    <text x="483" y="413" fill="#ffffff" font-size="22" font-weight="700">4</text>
    <text x="525" y="401" fill="#0f172a" font-size="22" font-weight="700">Warehouse check</text>
    <text x="478" y="444" fill="#475569" font-size="17">Reconcile cost + QC evidence</text>
    <text x="478" y="473" fill="#475569" font-size="17">Resolve open differences</text>

    <rect x="70" y="365" width="300" height="140" rx="18" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
    <circle cx="110" cy="405" r="22" fill="#f8fafc"/>
    <text x="103" y="413" fill="#0f172a" font-size="22" font-weight="700">5</text>
    <text x="145" y="401" fill="#ffffff" font-size="22" font-weight="700">International parcel</text>
    <text x="98" y="444" fill="#cbd5e1" font-size="17">A separate later payment</text>
    <text x="98" y="473" fill="#cbd5e1" font-size="17">Route + packed weight + destination</text>
  </g>

  <path d="M450 435H385" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="70" y="555" width="1060" height="46" rx="12" fill="#e0e7ff"/>
  <text x="600" y="585" text-anchor="middle" fill="#3730a3" font-family="Arial, sans-serif" font-size="18" font-weight="700">Save the original amount; record every change as a separate dated event.</text>
</svg>
