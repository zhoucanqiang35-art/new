<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">LoloBuy Fine Photo request workflow</title>
  <desc id="desc">A four-stage decision workflow: review standard photos, classify the missing fact, write one observable Fine Photo request, then save evidence and decide.</desc>
  <rect width="1200" height="650" rx="36" fill="#f8fafc"/>
  <text x="70" y="74" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">From standard QC photos to one useful Fine Photo</text>
  <text x="70" y="112" fill="#475569" font-family="Arial, sans-serif" font-size="19">Use a paid request only when a missing visible fact could change the next action.</text>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="160" width="240" height="300" rx="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <circle cx="112" cy="205" r="23" fill="#0284c7"/>
    <text x="112" y="213" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">1</text>
    <text x="146" y="213" fill="#0c4a6e" font-size="24" font-weight="700">Review</text>
    <text x="96" y="262" fill="#0f172a" font-size="18">Open every photo.</text>
    <text x="96" y="296" fill="#0f172a" font-size="18">Compare identity + option.</text>
    <text x="96" y="325" fill="#0f172a" font-size="18">Check visible condition.</text>
    <rect x="96" y="365" width="188" height="60" rx="12" fill="#fff"/>
    <text x="190" y="390" text-anchor="middle" fill="#0369a1" font-size="16" font-weight="700">Already visible?</text>
    <text x="190" y="414" text-anchor="middle" fill="#475569" font-size="15">Save it and decide.</text>

    <rect x="340" y="160" width="240" height="300" rx="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="382" cy="205" r="23" fill="#7c3aed"/>
    <text x="382" y="213" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">2</text>
    <text x="416" y="213" fill="#4c1d95" font-size="24" font-weight="700">Classify</text>
    <text x="366" y="262" fill="#0f172a" font-size="18">Answered</text>
    <text x="366" y="298" fill="#0f172a" font-size="18">Visible but missing</text>
    <text x="366" y="334" fill="#0f172a" font-size="18">Not visually verifiable</text>
    <rect x="366" y="365" width="188" height="60" rx="12" fill="#fff"/>
    <text x="460" y="390" text-anchor="middle" fill="#6d28d9" font-size="16" font-weight="700">Request only the</text>
    <text x="460" y="414" text-anchor="middle" fill="#475569" font-size="15">middle category.</text>

    <rect x="610" y="160" width="240" height="300" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <circle cx="652" cy="205" r="23" fill="#16a34a"/>
    <text x="652" y="213" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">3</text>
    <text x="686" y="213" fill="#14532d" font-size="24" font-weight="700">Specify</text>
    <text x="636" y="262" fill="#0f172a" font-size="18">One target</text>
    <text x="636" y="298" fill="#0f172a" font-size="18">One camera view</text>
    <text x="636" y="334" fill="#0f172a" font-size="18">One success condition</text>
    <rect x="636" y="365" width="188" height="60" rx="12" fill="#fff"/>
    <text x="730" y="390" text-anchor="middle" fill="#15803d" font-size="16" font-weight="700">Check live price,</text>
    <text x="730" y="414" text-anchor="middle" fill="#475569" font-size="15">limit and item status.</text>

    <rect x="880" y="160" width="250" height="300" rx="24" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
    <circle cx="922" cy="205" r="23" fill="#ea580c"/>
    <text x="922" y="213" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">4</text>
    <text x="956" y="213" fill="#7c2d12" font-size="24" font-weight="700">Decide</text>
    <text x="906" y="262" fill="#0f172a" font-size="18">Save request + result.</text>
    <text x="906" y="298" fill="#0f172a" font-size="18">Accept or seek a remedy.</text>
    <text x="906" y="327" fill="#0f172a" font-size="18">Record unresolved risk.</text>
    <rect x="906" y="365" width="198" height="60" rx="12" fill="#fff"/>
    <text x="1005" y="390" text-anchor="middle" fill="#c2410c" font-size="15" font-weight="700">Keep unresolved goods</text>
    <text x="1005" y="414" text-anchor="middle" fill="#475569" font-size="15">out of parcel submission.</text>

    <path d="M310 310h24" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path d="m329 302 10 8-10 8" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M580 310h24" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path d="m599 302 10 8-10 8" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M850 310h24" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path d="m869 302 10 8-10 8" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="70" y="505" width="1060" height="92" rx="20" fill="#0f172a"/>
    <text x="600" y="543" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Stop rule</text>
    <text x="600" y="574" text-anchor="middle" fill="#cbd5e1" font-size="18">Another photo is useful only when an observable missing fact could change what you do next.</text>
  </g>
</svg>
