<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">LoloBuy UK and EU VAT and customs planning checklist</title>
  <desc id="desc">A comparison showing shared parcel checks and the different current tax planning questions for Great Britain and European Union destinations.</desc>
  <rect width="1200" height="650" rx="36" fill="#f7f5ef"/>
  <text x="70" y="78" fill="#17233d" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">One parcel workflow, two destination rule sets</text>
  <text x="70" y="118" fill="#5d687b" font-family="Arial, Helvetica, sans-serif" font-size="20">Check the live route and current government guidance before every LoloBuy submission.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="165" width="330" height="360" rx="26" fill="#17233d"/>
    <text x="105" y="215" fill="#78d7b7" font-size="18" font-weight="700">SHARED CHECKS</text>
    <text x="105" y="260" fill="#ffffff" font-size="22" font-weight="700">Before either parcel</text>
    <text x="105" y="307" fill="#dce4f2" font-size="18">
      <tspan x="105" dy="0">□ Exact destination + postcode</tspan>
      <tspan x="105" dy="38">□ Product and route eligibility</tspan>
      <tspan x="105" dy="38">□ Packed weight + dimensions</tspan>
      <tspan x="105" dy="38">□ Truthful names, values, quantity</tspan>
      <tspan x="105" dy="38">□ Saved tax wording + evidence</tspan>
    </text>
    <path d="M425 345h70" stroke="#9ba9be" stroke-width="4" stroke-linecap="round"/>
    <path d="m483 333 14 12-14 12" fill="none" stroke="#9ba9be" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="515" y="165" width="285" height="360" rx="26" fill="#ffffff" stroke="#cfd7e3" stroke-width="2"/>
    <circle cx="560" cy="210" r="22" fill="#315efb"/>
    <text x="560" y="218" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="700">UK</text>
    <text x="600" y="218" fill="#17233d" font-size="24" font-weight="700">Great Britain</text>
    <text x="550" y="270" fill="#42516b" font-size="18">
      <tspan x="550" dy="0">□ Total consignment value</tspan>
      <tspan x="550" dy="38">□ £135 workflow checked</tspan>
      <tspan x="550" dy="38">□ VAT collection documented</tspan>
      <tspan x="550" dy="38">□ Duty + courier fee reserved</tspan>
    </text>
    <rect x="550" y="438" width="215" height="48" rx="13" fill="#edf2ff"/>
    <text x="658" y="468" text-anchor="middle" fill="#315efb" font-size="16" font-weight="700">NI RULES MAY DIFFER</text>
    <rect x="835" y="165" width="295" height="360" rx="26" fill="#ffffff" stroke="#cfd7e3" stroke-width="2"/>
    <circle cx="880" cy="210" r="22" fill="#f0b429"/>
    <text x="880" y="218" text-anchor="middle" fill="#17233d" font-size="21" font-weight="700">EU</text>
    <text x="920" y="218" fill="#17233d" font-size="24" font-weight="700">Member state</text>
    <text x="870" y="270" fill="#42516b" font-size="18">
      <tspan x="870" dy="0">□ Import VAT planned</tspan>
      <tspan x="870" dy="38">□ IOSS evidence checked</tspan>
      <tspan x="870" dy="38">□ Temporary €3 rule checked</tspan>
      <tspan x="870" dy="38">□ Local handling fee reserved</tspan>
    </text>
    <rect x="870" y="438" width="225" height="48" rx="13" fill="#fff4d6"/>
    <text x="982" y="468" text-anchor="middle" fill="#7a5715" font-size="16" font-weight="700">RULE CHANGED 1 JUL 2026</text>
  </g>
  <rect x="70" y="558" width="1060" height="50" rx="15" fill="#e8f7f2"/>
  <text x="600" y="590" text-anchor="middle" fill="#235d4d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Do not reuse another country’s route quote, VAT result or customs threshold.</text>
</svg>
