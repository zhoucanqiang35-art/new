<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">LoloBuy shipping to USA decision checklist</title>
  <desc id="desc">A four-stage checklist covering product admissibility, live route comparison, accurate declaration and delivery evidence for United States parcels.</desc>
  <rect width="1200" height="650" rx="36" fill="#f5f8ff"/>
  <text x="70" y="82" fill="#14213d" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">LoloBuy shipping to USA: four checks before dispatch</text>
  <text x="70" y="122" fill="#52617a" font-family="Arial, Helvetica, sans-serif" font-size="20">Use current item facts, route rules and US guidance—never an old price or duty shortcut.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(70 175)">
      <rect width="245" height="330" rx="24" fill="#ffffff" stroke="#cad6eb" stroke-width="2"/>
      <circle cx="38" cy="42" r="20" fill="#315efb"/>
      <text x="38" y="50" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text>
      <text x="70" y="50" fill="#14213d" font-size="24" font-weight="700">Product</text>
      <text x="28" y="98" fill="#394964" font-size="18">
        <tspan x="28" dy="0">□ Identify contents</tspan>
        <tspan x="28" dy="34">□ Check US admissibility</tspan>
        <tspan x="28" dy="34">□ Review brand/IP risk</tspan>
        <tspan x="28" dy="34">□ Resolve warnings</tspan>
      </text>
      <rect x="28" y="250" width="189" height="48" rx="12" fill="#eef3ff"/>
      <text x="122" y="281" text-anchor="middle" fill="#315efb" font-size="16" font-weight="700">BEFORE PURCHASE</text>
    </g>
    <path d="M329 340h42" stroke="#8fa5c8" stroke-width="4" stroke-linecap="round"/>
    <path d="m363 330 12 10-12 10" fill="none" stroke="#8fa5c8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(385 175)">
      <rect width="245" height="330" rx="24" fill="#ffffff" stroke="#cad6eb" stroke-width="2"/>
      <circle cx="38" cy="42" r="20" fill="#315efb"/>
      <text x="38" y="50" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text>
      <text x="70" y="50" fill="#14213d" font-size="24" font-weight="700">Live route</text>
      <text x="28" y="98" fill="#394964" font-size="18">
        <tspan x="28" dy="0">□ United States selected</tspan>
        <tspan x="28" dy="34">□ Weight + dimensions</tspan>
        <tspan x="28" dy="34">□ Categories eligible</tspan>
        <tspan x="28" dy="34">□ Terms saved today</tspan>
      </text>
      <rect x="28" y="250" width="189" height="48" rx="12" fill="#eef3ff"/>
      <text x="122" y="281" text-anchor="middle" fill="#315efb" font-size="16" font-weight="700">RECHECK ESTIMATOR</text>
    </g>
    <path d="M644 340h42" stroke="#8fa5c8" stroke-width="4" stroke-linecap="round"/>
    <path d="m678 330 12 10-12 10" fill="none" stroke="#8fa5c8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(700 175)">
      <rect width="245" height="330" rx="24" fill="#ffffff" stroke="#cad6eb" stroke-width="2"/>
      <circle cx="38" cy="42" r="20" fill="#315efb"/>
      <text x="38" y="50" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text>
      <text x="70" y="50" fill="#14213d" font-size="24" font-weight="700">Declaration</text>
      <text x="28" y="98" fill="#394964" font-size="18">
        <tspan x="28" dy="0">□ Plain item names</tspan>
        <tspan x="28" dy="34">□ True quantities</tspan>
        <tspan x="28" dy="34">□ Supported values</tspan>
        <tspan x="28" dy="34">□ Customs reserve</tspan>
      </text>
      <rect x="28" y="250" width="189" height="48" rx="12" fill="#eef3ff"/>
      <text x="122" y="281" text-anchor="middle" fill="#315efb" font-size="16" font-weight="700">NO FALSE VALUE</text>
    </g>
    <path d="M959 340h42" stroke="#8fa5c8" stroke-width="4" stroke-linecap="round"/>
    <path d="m993 330 12 10-12 10" fill="none" stroke="#8fa5c8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(1015 175)">
      <rect width="115" height="330" rx="24" fill="#14213d"/>
      <circle cx="57" cy="44" r="20" fill="#57d3a4"/>
      <text x="57" y="52" text-anchor="middle" fill="#14213d" font-size="22" font-weight="700">4</text>
      <text x="57" y="102" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">Track</text>
      <text x="57" y="132" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">Inspect</text>
      <text x="57" y="162" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">Record</text>
      <path d="m39 218 13 13 27-31" fill="none" stroke="#57d3a4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="57" y="282" text-anchor="middle" fill="#b7c3d8" font-size="15">DELIVERY</text>
    </g>
  </g>
  <rect x="70" y="548" width="1060" height="54" rx="16" fill="#fff4d6"/>
  <text x="600" y="582" text-anchor="middle" fill="#705216" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Current US rule check: do not assume a commercial parcel below $800 is duty free.</text>
</svg>
