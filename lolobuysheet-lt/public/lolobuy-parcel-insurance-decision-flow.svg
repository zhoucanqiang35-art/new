<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">LoloBuy parcel insurance and claims decision flow</title>
  <desc id="desc">A six-step flow for checking live Secure-Ship rules, comparing uninsured compensation, reconciling insured value, saving evidence, documenting delivery and filing a claim.</desc>
  <rect width="1200" height="650" fill="#f7f8fc"/>
  <rect x="48" y="38" width="1104" height="574" rx="30" fill="#ffffff" stroke="#dce2ef" stroke-width="2"/>
  <text x="96" y="98" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#18233a">LoloBuy parcel protection: decide before you pay</text>
  <text x="96" y="132" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#59657a">Use the exact parcel, destination and live route card. Save what you see.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="84" y="180" width="300" height="124" rx="18" fill="#eef3ff" stroke="#8ba7ff" stroke-width="2"/>
    <circle cx="122" cy="218" r="21" fill="#2854d7"/>
    <text x="122" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text>
    <text x="158" y="216" font-size="20" font-weight="700" fill="#1b2b50">Open the live route card</text>
    <text x="108" y="252" font-size="16" fill="#46536b">Premium · insured values · events</text>
    <text x="108" y="278" font-size="16" fill="#46536b">limits · claim period · full rules</text>

    <path d="M394 242h58" fill="none" stroke="#8290aa" stroke-width="3"/>
    <path d="m444 234 12 8-12 8" fill="none" stroke="#8290aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="466" y="180" width="300" height="124" rx="18" fill="#f3efff" stroke="#aa91ec" stroke-width="2"/>
    <circle cx="504" cy="218" r="21" fill="#7046c8"/>
    <text x="504" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">2</text>
    <text x="540" y="216" font-size="20" font-weight="700" fill="#31224f">Compare the fallback</text>
    <text x="490" y="252" font-size="16" fill="#514866">Read the route's uninsured standard</text>
    <text x="490" y="278" font-size="16" fill="#514866">and exclusions; leave unknowns open</text>

    <path d="M776 242h58" fill="none" stroke="#8290aa" stroke-width="3"/>
    <path d="m826 234 12 8-12 8" fill="none" stroke="#8290aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="848" y="180" width="268" height="124" rx="18" fill="#ecf8f4" stroke="#75bba4" stroke-width="2"/>
    <circle cx="886" cy="218" r="21" fill="#178264"/>
    <text x="886" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">3</text>
    <text x="922" y="216" font-size="20" font-weight="700" fill="#153f35">Reconcile value</text>
    <text x="872" y="252" font-size="16" fill="#3d6259">Match goods, freight, declaration</text>
    <text x="872" y="278" font-size="16" fill="#3d6259">and transaction proof</text>

    <path d="M982 316v44" fill="none" stroke="#8290aa" stroke-width="3"/>
    <path d="m974 352 8 12 8-12" fill="none" stroke="#8290aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="848" y="376" width="268" height="134" rx="18" fill="#fff5e8" stroke="#e8aa56" stroke-width="2"/>
    <circle cx="886" cy="414" r="21" fill="#bd6b14"/>
    <text x="886" y="421" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">4</text>
    <text x="922" y="412" font-size="20" font-weight="700" fill="#57350f">Save evidence</text>
    <text x="872" y="450" font-size="16" fill="#6b4b26">Rules · policy · parcel ID · QC</text>
    <text x="872" y="476" font-size="16" fill="#6b4b26">payments · address · packaging</text>

    <path d="M838 443h-62" fill="none" stroke="#8290aa" stroke-width="3"/>
    <path d="m784 435-12 8 12 8" fill="none" stroke="#8290aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="466" y="376" width="300" height="134" rx="18" fill="#fff0f2" stroke="#e38c9c" stroke-width="2"/>
    <circle cx="504" cy="414" r="21" fill="#bd3e59"/>
    <text x="504" y="421" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">5</text>
    <text x="540" y="412" font-size="20" font-weight="700" fill="#56222c">Document delivery</text>
    <text x="490" y="450" font-size="16" fill="#6b4048">Inspect before signing; film one</text>
    <text x="490" y="476" font-size="16" fill="#6b4048">continuous opening; keep packaging</text>

    <path d="M456 443h-62" fill="none" stroke="#8290aa" stroke-width="3"/>
    <path d="m402 435-12 8 12 8" fill="none" stroke="#8290aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="84" y="376" width="300" height="134" rx="18" fill="#eef6ff" stroke="#7aade0" stroke-width="2"/>
    <circle cx="122" cy="414" r="21" fill="#2773b8"/>
    <text x="122" y="421" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">6</text>
    <text x="158" y="412" font-size="20" font-weight="700" fill="#173a5b">Classify and file now</text>
    <text x="108" y="450" font-size="16" fill="#3e5b74">Loss ≠ damage ≠ customs ≠ delay</text>
    <text x="108" y="476" font-size="16" fill="#3e5b74">Use the current account claim entry</text>
  </g>

  <rect x="84" y="548" width="1032" height="38" rx="19" fill="#18233a"/>
  <text x="600" y="573" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Live rules control. A saved screenshot and timely evidence make the decision auditable.</text>
</svg>
