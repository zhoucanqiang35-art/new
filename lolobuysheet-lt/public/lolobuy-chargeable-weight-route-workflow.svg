<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">LoloBuy chargeable weight and route comparison workflow</title>
  <desc id="desc">A four-step workflow using parcel weight, dimensions, route billing rules and final eligibility checks.</desc>
  <rect width="1200" height="650" rx="34" fill="#f6f0e5"/>
  <text x="64" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1e293b">Compare routes with the same parcel facts</text>
  <text x="64" y="107" font-family="Arial, sans-serif" font-size="19" fill="#5b6673">Weight and dimensions first · live billing rule second · eligibility before price</text>
  <g font-family="Arial, sans-serif">
    <rect x="64" y="150" width="242" height="330" rx="24" fill="#fff" stroke="#d7c5a3" stroke-width="3"/>
    <circle cx="108" cy="196" r="24" fill="#b88938"/><text x="101" y="204" font-size="21" font-weight="700" fill="#fff">1</text>
    <text x="146" y="202" font-size="23" font-weight="700" fill="#1e293b">Parcel facts</text>
    <text x="90" y="252" font-size="18" fill="#52606d">• Destination</text>
    <text x="90" y="288" font-size="18" fill="#52606d">• Item categories</text>
    <text x="90" y="324" font-size="18" fill="#52606d">• Scale weight</text>
    <text x="90" y="360" font-size="18" fill="#52606d">• L × W × H</text>
    <path d="M320 315h38" stroke="#b88938" stroke-width="6"/><path d="M358 315l-14-10v20z" fill="#b88938"/>
    <rect x="370" y="150" width="242" height="330" rx="24" fill="#fff" stroke="#d7c5a3" stroke-width="3"/>
    <circle cx="414" cy="196" r="24" fill="#b88938"/><text x="407" y="204" font-size="21" font-weight="700" fill="#fff">2</text>
    <text x="452" y="202" font-size="23" font-weight="700" fill="#1e293b">Billing rule</text>
    <text x="396" y="252" font-size="18" fill="#52606d">• Actual weight</text>
    <text x="396" y="288" font-size="18" fill="#52606d">• Volumetric weight</text>
    <text x="396" y="324" font-size="18" fill="#52606d">• Greater of the two</text>
    <text x="396" y="360" font-size="18" fill="#52606d">• Live route divisor</text>
    <path d="M626 315h38" stroke="#b88938" stroke-width="6"/><path d="M664 315l-14-10v20z" fill="#b88938"/>
    <rect x="676" y="150" width="242" height="330" rx="24" fill="#fff" stroke="#d7c5a3" stroke-width="3"/>
    <circle cx="720" cy="196" r="24" fill="#b88938"/><text x="713" y="204" font-size="21" font-weight="700" fill="#fff">3</text>
    <text x="758" y="202" font-size="23" font-weight="700" fill="#1e293b">Route screen</text>
    <text x="702" y="252" font-size="18" fill="#52606d">• Estimated price</text>
    <text x="702" y="288" font-size="18" fill="#52606d">• Weight / size limits</text>
    <text x="702" y="324" font-size="18" fill="#52606d">• Item eligibility</text>
    <text x="702" y="360" font-size="18" fill="#52606d">• Fee and feature fields</text>
    <path d="M932 315h38" stroke="#b88938" stroke-width="6"/><path d="M970 315l-14-10v20z" fill="#b88938"/>
    <rect x="982" y="150" width="154" height="330" rx="24" fill="#243044"/>
    <circle cx="1024" cy="196" r="24" fill="#b88938"/><text x="1017" y="204" font-size="21" font-weight="700" fill="#fff">4</text>
    <text x="1006" y="252" font-size="21" font-weight="700" fill="#fff">Choose</text>
    <text x="1006" y="288" font-size="17" fill="#eef2f7">eligible</text>
    <text x="1006" y="319" font-size="17" fill="#eef2f7">route, then</text>
    <text x="1006" y="350" font-size="17" fill="#eef2f7">save the</text>
    <text x="1006" y="381" font-size="17" fill="#eef2f7">dated result</text>
    <rect x="64" y="530" width="1072" height="58" rx="29" fill="#243044"/>
    <text x="600" y="566" text-anchor="middle" font-size="19" fill="#fff">Recheck after final packing: estimated and final chargeable weight may differ</text>
  </g>
</svg>
