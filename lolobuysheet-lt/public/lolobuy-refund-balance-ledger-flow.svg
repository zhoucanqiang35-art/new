<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">LoloBuy refund, balance and withdrawal ledger flow</title>
  <desc id="desc">Four different balance sources feed a transaction ledger, followed by spendable and withdrawable checks and a final settlement record.</desc>
  <rect width="1200" height="650" fill="#f6f8fc"/>
  <rect x="44" y="34" width="1112" height="582" rx="30" fill="#fff" stroke="#dce3ef" stroke-width="2"/>
  <text x="88" y="88" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#18233a">LoloBuy refund-to-balance ledger</text>
  <text x="88" y="120" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5a667a">Identify the source before deciding whether a credit can be spent or withdrawn.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="76" y="162" width="232" height="112" rx="17" fill="#eef3ff" stroke="#8ea9f2" stroke-width="2"/>
    <text x="96" y="197" font-size="19" font-weight="700" fill="#223d83">Order refund</text>
    <text x="96" y="228" font-size="15" fill="#4b5a75">Cancellation · seller return</text>
    <text x="96" y="252" font-size="15" fill="#4b5a75">item and quantity record</text>

    <rect x="348" y="162" width="232" height="112" rx="17" fill="#f3efff" stroke="#aa91e3" stroke-width="2"/>
    <text x="368" y="197" font-size="19" font-weight="700" fill="#4b327d">Parcel adjustment</text>
    <text x="368" y="228" font-size="15" fill="#5d5270">Estimated vs final freight</text>
    <text x="368" y="252" font-size="15" fill="#5d5270">parcel ID and notice</text>

    <rect x="620" y="162" width="232" height="112" rx="17" fill="#edf8f3" stroke="#79baa2" stroke-width="2"/>
    <text x="640" y="197" font-size="19" font-weight="700" fill="#1a6952">Claim credit</text>
    <text x="640" y="228" font-size="15" fill="#48655c">Decision · parcel code</text>
    <text x="640" y="252" font-size="15" fill="#48655c">goods and freight basis</text>

    <rect x="892" y="162" width="232" height="112" rx="17" fill="#fff4e8" stroke="#e0a05b" stroke-width="2"/>
    <text x="912" y="197" font-size="19" font-weight="700" fill="#7b491c">Other balance</text>
    <text x="912" y="228" font-size="15" fill="#6d5742">Recharge · reward · affiliate</text>
    <text x="912" y="252" font-size="15" fill="#6d5742">do not merge categories</text>

    <path d="M192 284v38h368" fill="none" stroke="#8491a6" stroke-width="3"/>
    <path d="M464 284v38" fill="none" stroke="#8491a6" stroke-width="3"/>
    <path d="M736 284v38H560" fill="none" stroke="#8491a6" stroke-width="3"/>
    <path d="M1008 284v38H560" fill="none" stroke="#8491a6" stroke-width="3"/>
    <path d="m552 314 8 12 8-12" fill="none" stroke="#8491a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="350" y="336" width="420" height="108" rx="20" fill="#18233a"/>
    <text x="560" y="373" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Account balance transaction ledger</text>
    <text x="560" y="405" text-anchor="middle" font-size="16" fill="#dbe4f5">type · order/parcel ID · amount · currency</text>
    <text x="560" y="429" text-anchor="middle" font-size="16" fill="#dbe4f5">trade number · date · running balance</text>

    <path d="M470 456v38H274" fill="none" stroke="#8491a6" stroke-width="3"/>
    <path d="m266 486 8 12 8-12" fill="none" stroke="#8491a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M650 456v38h196" fill="none" stroke="#8491a6" stroke-width="3"/>
    <path d="m838 486 8 12 8-12" fill="none" stroke="#8491a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="118" y="508" width="312" height="76" rx="18" fill="#eef3ff" stroke="#8ea9f2" stroke-width="2"/>
    <text x="274" y="539" text-anchor="middle" font-size="20" font-weight="700" fill="#223d83">Spend on platform</text>
    <text x="274" y="566" text-anchor="middle" font-size="15" fill="#4b5a75">Keep the source record attached</text>

    <rect x="690" y="508" width="312" height="76" rx="18" fill="#edf8f3" stroke="#79baa2" stroke-width="2"/>
    <text x="846" y="539" text-anchor="middle" font-size="20" font-weight="700" fill="#1a6952">Check withdrawable list</text>
    <text x="846" y="566" text-anchor="middle" font-size="15" fill="#48655c">Live rule · fee · method · record</text>
  </g>
</svg>
