<script>globalThis.PIKO_ARTICLES={"/seo-articles/how-to-use-product-links/":["How to use a PikoBuy product link before you buy","A clear, fact-based workflow for moving from a source listing to a considered purchase request.","Read the source listing as a record, not an advert","A good product request starts with the original listing, not with a thumbnail or a short product title. Before using a PikoBuy search box, open the source page and identify the exact version you want. Listings often group several colours, sizes, bundles or materials together. The lowest displayed price may apply to one option only. Write down the source link, selected variation, quantity and any visible measurement or option code. If the selected detail appears only in an image, save that image with the URL. This is not unnecessary paperwork; it gives you a reference for every later step.</p><p>A link is an address, not proof that every version on a page is identical. The right question is not “does this title look right?” but “does this selected option match what I intend to request?” Compare the visible option text with the images and description. If the listing leaves a key point unclear, do not make up an answer. Search for a clearer source or make a specific note about the uncertainty. This human habit—separating what is visible from what is assumed—is more useful than an exaggerated buying guide.</p><p>PikoBuy’s official guide separates the workflow into clear stages. Shoppers first identify an item on a source marketplace, confirm its specification, colour and size, and then use PikoBuy to search by keyword or submit a product link, image or sourcing request. After selecting the option and quantity, the first payment covers the purchasing order. The guide says the actual purchase price applies and that an out-of-stock order is refunded. That is why a source price should be treated as information about the item request, not as a final door-to-door promise. Keeping the listing, selected option and order date together gives the shopper a usable record if stock or options change.","Use the first payment for the item request","The first payment should be understood as the purchasing step for the selected goods. It is not the final shipping checkout. This matters because a product can be unavailable, a seller can have changed an option, or a source title can describe several versions. Keep a simple order note that answers four questions: what source was used, which variation was selected, how many units were requested, and what feature must be checked when the item arrives. Those facts turn a vague order into something you can compare later.</p><p>Avoid fixed claims about total cost at this stage. A product price, domestic seller conditions and the later international parcel are different parts of the process. If you are comparing several finds, use the same note format for each one. This makes it easier to spot which source has a clear size chart, which option has a different price and which item may be too uncertain to combine with others. Clarity before purchase is often more valuable than adding another item to a cart.</p><p>PikoBuy says items are checked in, photographed and inspected for visible defects after they arrive at its warehouse, and that items are repacked there. Its shipping terms also say users can view inspection photos or purchase additional detailed photos, while professional inspection is not available for special or professional products. The sensible interpretation is narrow and useful: photos can help compare visible colour, size labels, count and condition with the chosen listing. They cannot prove every internal feature, future durability, authenticity claim or delivery outcome. When an important detail is not visible, a specific follow-up request is more useful than assuming the answer.","Review the warehouse record before submitting a parcel","When photos become available, compare them against the saved selection rather than against a general expectation. Look for visible size labels, colour, item count, shape and obvious condition issues. If your request concerned a set or bundle, check whether the visible pieces match the listing. A photo is useful evidence of what it shows at that moment. It is not a universal quality score. That distinction lets you ask sensible questions and prevents a routine warehouse image from being treated as a guarantee.</p><p>If a concern affects whether you would ship the item, address it while the item is in the warehouse. Save the photos with the source URL and selected option. If you later choose to submit a parcel, the record helps you keep domestic seller delivery, warehouse check-in and international dispatch separate. Those stages are easy to confuse when reading tracking updates, especially on a first order.</p><p>The parcel is a second decision. PikoBuy’s guide says customers choose a route, submit the parcel and pay international shipping after items are in the warehouse. Its estimate tool asks for destination country or region, product type, weight, length, width and height. The guide also says routes differ in delivery time and billing methods. PikoBuy says tracking information will be available within three days after dispatch; this is a timing statement about tracking availability, not a fixed arrival date. A responsible plan uses the current information shown for the real destination and real parcel rather than an old total from another shopper.</p><p>PikoBuy’s shipping terms say parcels are carried by third-party logistics providers and identify cross-border risks including customs policies and uncontrollable events such as delay, loss, damage or confiscation. Its returns policy describes a warehouse-stage process that depends on seller eligibility, item condition and timing, including a five-day window after an item changes to “In Warehouse” for eligible applications. Some product types and packaging conditions are excluded or have special standards. These limits are not small print to ignore: they are the reason to inspect early, preserve relevant evidence and resolve a return question before an international parcel is submitted."],"/seo-articles/qc-photos-guide/":["How to read PikoBuy inspection photos without overclaiming","Warehouse photos can be useful comparison evidence. They are not a promise about every feature, variation or delivery outcome.","Give inspection photos the right job","The strongest use of an inspection photo is comparison. Put the photo beside the source listing and the option you selected. Check what can actually be seen: colour, visible size label, item count, shape, packaging and obvious surface condition. A useful review asks concrete questions. Does the label match the requested size? Is the visible item the chosen colour? Is a component missing? Is there an obvious mark or tear? Questions tied to visible evidence are more reliable than a broad request for someone to decide whether an item is “good.”</p><p>Do not compare a warehouse image to an imaginary perfect version. Compare it to your documented request. Lighting, angle and compression can make colour and texture look different. An outside photograph may not show every seam, internal component or measurement. When the answer matters, ask for the exact detail you need. A specific request such as a photograph of a size tag is far more useful than asking for “better QC.”</p><p>PikoBuy says items are checked in, photographed and inspected for visible defects after they arrive at its warehouse, and that items are repacked there. Its shipping terms also say users can view inspection photos or purchase additional detailed photos, while professional inspection is not available for special or professional products. The sensible interpretation is narrow and useful: photos can help compare visible colour, size labels, count and condition with the chosen listing. They cannot prove every internal feature, future durability, authenticity claim or delivery outcome. When an important detail is not visible, a specific follow-up request is more useful than assuming the answer.","Avoid turning a visible check into a promise","A warehouse photo may identify a visible mismatch early, which is valuable. It does not establish authenticity, long-term durability, fit for every body type or a guaranteed delivery result. Those claims require different evidence, and some cannot be honestly guaranteed. Clear writing should say that directly. It helps beginners use photos for a real decision instead of treating a few images as a certificate that removes all risk.</p><p>Make the depth of review proportionate to the item. A straightforward low-cost item may need only a brief listing-to-photo comparison. A fragile, technical, expensive or size-sensitive item may justify a more detailed request, more research or a decision not to send it. The goal is not impossible certainty. It is to notice avoidable differences before international shipping becomes the next commitment.</p><p>PikoBuy’s official guide separates the workflow into clear stages. Shoppers first identify an item on a source marketplace, confirm its specification, colour and size, and then use PikoBuy to search by keyword or submit a product link, image or sourcing request. After selecting the option and quantity, the first payment covers the purchasing order. The guide says the actual purchase price applies and that an out-of-stock order is refunded. That is why a source price should be treated as information about the item request, not as a final door-to-door promise. Keeping the listing, selected option and order date together gives the shopper a usable record if stock or options change.","Use the review window before parcel submission","Reviewing early is more practical than reviewing only when you are ready to ship. If the visible record raises a question, read the return conditions while the item remains in the warehouse. Preserve the condition and packaging required by the seller where relevant. A return is not automatic simply because a customer changes their mind; eligibility and costs can depend on the seller, the item and the stated policy. A factual guide should prepare the shopper for this rather than promising an outcome.</p><p>When the available evidence is satisfactory, keep the source link, selected option and warehouse photos together. Then choose packaging and shipping based on the actual items. PikoBuy’s guide mentions requests such as minimal or reinforced packaging. Neither setting is best for every parcel. Use the item’s condition, fragility and your own priority as the basis for a choice.</p><p>PikoBuy’s shipping terms say parcels are carried by third-party logistics providers and identify cross-border risks including customs policies and uncontrollable events such as delay, loss, damage or confiscation. Its returns policy describes a warehouse-stage process that depends on seller eligibility, item condition and timing, including a five-day window after an item changes to “In Warehouse” for eligible applications. Some product types and packaging conditions are excluded or have special standards. These limits are not small print to ignore: they are the reason to inspect early, preserve relevant evidence and resolve a return question before an international parcel is submitted.</p><p>The parcel is a second decision. PikoBuy’s guide says customers choose a route, submit the parcel and pay international shipping after items are in the warehouse. Its estimate tool asks for destination country or region, product type, weight, length, width and height. The guide also says routes differ in delivery time and billing methods. PikoBuy says tracking information will be available within three days after dispatch; this is a timing statement about tracking availability, not a fixed arrival date. A responsible plan uses the current information shown for the real destination and real parcel rather than an old total from another shopper."],"/seo-articles/eu-us-parcel-planning/":["Plan a PikoBuy parcel for Europe and North America using facts","A practical pre-shipping method: work from your real destination and warehouse items, not a fixed cost or delivery promise.","Start with the real parcel, not the product card","A source listing answers a product question; an international parcel answers a logistics question. They are connected, but they are not the same decision. A product price is not automatically a door-to-door total, and a seller’s domestic shipment is not the same as an international dispatch. Start planning only after you know which items have arrived, what options were selected and what their actual condition and packaging needs are.</p><p>For shoppers in the EU, UK, US or Canada, destination changes the decision. Two people can order similar products and still see different results because country, route availability, dimensions, weight and packing choices differ. Keep a simple inventory of the items in your warehouse: variation, quantity, fragility and anything that changes the parcel shape. This is more useful than relying on a screenshot of someone else’s completed shipment.</p><p>PikoBuy’s official guide separates the workflow into clear stages. Shoppers first identify an item on a source marketplace, confirm its specification, colour and size, and then use PikoBuy to search by keyword or submit a product link, image or sourcing request. After selecting the option and quantity, the first payment covers the purchasing order. The guide says the actual purchase price applies and that an out-of-stock order is refunded. That is why a source price should be treated as information about the item request, not as a final door-to-door promise. Keeping the listing, selected option and order date together gives the shopper a usable record if stock or options change.","Use estimates as current planning information","The most useful shipping estimate is one built from the destination and parcel you are actually preparing. Enter information carefully, then read the route details and billing method shown for that result. Do not publish a fixed price or a fixed delivery time as if it applies to every buyer. Routes can be different, and an estimate is not a promise that every later condition will stay the same.</p><p>Packaging is a trade-off. Minimal packaging may be appropriate for some robust items, while reinforced protection may be sensible for fragile goods. PikoBuy’s own guide lets customers add packaging requests at the warehouse stage. Choose from the facts in front of you: the item, its visible condition, the likely parcel volume and your own priorities. A generic rule from a different order is not a substitute for that decision.</p><p>The parcel is a second decision. PikoBuy’s guide says customers choose a route, submit the parcel and pay international shipping after items are in the warehouse. Its estimate tool asks for destination country or region, product type, weight, length, width and height. The guide also says routes differ in delivery time and billing methods. PikoBuy says tracking information will be available within three days after dispatch; this is a timing statement about tracking availability, not a fixed arrival date. A responsible plan uses the current information shown for the real destination and real parcel rather than an old total from another shopper.","Read cross-border and return limits before paying","No responsible guide should describe a route as risk-free. Customs policies, carrier restrictions and uncontrollable logistics events are part of cross-border shipping. If an item is high-value, sensitive, restricted or hard to describe accurately, slow down and check the information attached to the current route and destination. General online advice cannot replace the details for the actual parcel a shopper is about to submit.</p><p>Returns are also easiest to consider before international dispatch. If the warehouse photos show a concern, decide whether it needs to be resolved while the item is still in the warehouse. Keep the listing record, visible photos and order information together. This makes a later conversation more specific and avoids trying to reconstruct the selected option from memory after a parcel has already been sent.</p><p>PikoBuy’s shipping terms say parcels are carried by third-party logistics providers and identify cross-border risks including customs policies and uncontrollable events such as delay, loss, damage or confiscation. Its returns policy describes a warehouse-stage process that depends on seller eligibility, item condition and timing, including a five-day window after an item changes to “In Warehouse” for eligible applications. Some product types and packaging conditions are excluded or have special standards. These limits are not small print to ignore: they are the reason to inspect early, preserve relevant evidence and resolve a return question before an international parcel is submitted.</p><p>The simple workflow is deliberately calm: choose the exact version, save the source record, review the warehouse evidence, resolve any return question, then compare current shipping options for the real destination. It does not make dramatic promises. It gives a shopper a repeatable method for making an informed decision from facts that are visible in their own PikoBuy order."]};</script>
<script>(()=>{const add=["Before a purchase or shipping decision, separate a fact from an expectation. A fact might be the option selected, the visible warehouse label, the measured weight shown for a parcel or the route information on a current screen. An expectation might be that a photo proves every detail, that a past estimate will apply today or that a route will arrive on a particular date. Keeping that distinction is not pessimistic. It is how a shopper can make a calm decision without being misled by a title, a screenshot or a confident claim from somebody else.","Use a simple evidence folder for every order: the source listing, selected option, any relevant screenshots, PikoBuy warehouse photos, the submitted parcel details and tracking record. This does not make a product better or remove cross-border risk. It does make each question easier to answer. When something changes, the shopper can compare the real record instead of trying to remember a choice made days earlier. This is especially useful when several products, colours or sellers are being handled at once.","Do not publish fixed guarantees about price, delivery time, customs treatment, inspection results or return approval. PikoBuy’s own pages make clear that shipping choices depend on the destination and parcel, that third-party logistics carries the parcel, and that returns depend on eligibility and conditions. The useful promise a research site can make is smaller and more honest: it can help a visitor ask the right questions, keep the right records and move to the current information on the main site when ready."];Object.values(globalThis.PIKO_ARTICLES).forEach(a=>{a[3]+="</p><p>"+add[0];a[5]+="</p><p>"+add[1];a[7]+="</p><p>"+add[2]})})();</script>
<script>(()=>{const text="A final practical check is to pause before clicking the next payment button. Read the exact option, photos, route and timing information that belongs to your own order on that day. If a fact is missing, record the question rather than replacing it with a confident guess. This approach keeps a research page useful for new shoppers: it explains the process in ordinary language while leaving the live purchase and shipping choices to the current information on the main platform.";const a=globalThis.PIKO_ARTICLES;a["/seo-articles/qc-photos-guide/"][7]+="</p><p>"+text;a["/seo-articles/eu-us-parcel-planning/"][7]+="</p><p>"+text})()</script>
<script>globalThis.PIKO_ARTICLES["/seo-articles/eu-us-parcel-planning/"][7]+="</p><p>"+"For buyers comparing EU and North American delivery choices, the useful question is not which route a blog calls best. It is which route is currently offered for the destination, parcel type, weight and dimensions in front of you. Read the displayed conditions before payment, retain the parcel confirmation, and allow for normal carrier and cross-border uncertainty.";</script>

const articles=globalThis.PIKO_ARTICLES||{"/seo-articles/how-to-use-product-links/":["How to read a product link before you buy","A practical sequence for comparing the exact item, rather than relying on an attractive title or one photo.","Start with the variant","A product URL is a route to a listing, not proof that every variation is identical. Open the selected version, then compare colour, size, material notes, measurements and available images. If key information is missing, keep researching rather than assume it is correct.","Use image evidence carefully","Images can show what is present at a moment in time. They do not confirm the final parcel, long-term quality or a delivery outcome. Match images to the selected variation and read the listing beside them.","Keep destination decisions separate","Product research and parcel planning are related but different. Price, route availability and restrictions depend on the real destination, package weight and dimensions. Check those details only when your actual order is ready."],"/seo-articles/qc-photos-guide/":["QC photos: useful evidence, sensible limits","How to use received-item photos as one part of a product research process.","Match photos to the selected item","Check visible labels, colour, shape, dimensions and version details against the listing you selected. Photos may help identify a mismatch, but they are not a general guarantee for another variation.","Ask precise comparison questions","Instead of asking whether an item looks good, compare a concrete feature: the selected size, visible material, placement, finish or measurement. Specific checks create useful records and make later decisions clearer.","Do not turn a photo into a promise","Photography, lighting and a single item cannot establish universal quality or delivery outcomes. Use QC images as evidence to inspect, then review the current product listing before acting."],"/seo-articles/eu-us-parcel-planning/":["EU and US parcel planning starts with const faq=()=>'<section class="section" id="faq"><div class="wrap"><div class="section-head"><div><div class="kicker">FAQ</div><h2>Clear answers.<br>Better next steps.</h2></div><p>Short answers based on PikoBuy’s published customer workflow and policies. Check the current order screen before making a payment.</p></div><div class="faq"><details open><summary>What can I submit to PikoBuy?</summary><p>PikoBuy says you can search products directly or submit product links, images or sourcing requests. For a precise request, keep the source link and the selected size, colour and quantity together.</p></details><details><summary>Is the product payment the same as international shipping?</summary><p>No. PikoBuy’s beginner guide separates the item purchase from later international shipping. Shipping is selected and paid after items are in the warehouse and a parcel is submitted.</p></details><details><summary>What happens when an item reaches the warehouse?</summary><p>PikoBuy says items are checked in, photographed and inspected for visible defects. It also says items are repacked at the China warehouse before international shipping.</p></details><details><summary>Do inspection photos guarantee quality or authenticity?</summary><p>No. Photos are useful for comparing visible details with the selected listing. They cannot prove every internal feature, future durability, authenticity claim or delivery result. PikoBuy says professional inspection is not available for special or professional products.</p></details><details><summary>How should I estimate shipping?</summary><p>Use the current estimator for your real destination and parcel. PikoBuy asks for country or region, product type, weight, length, width and height; its guide says routes can differ in delivery time and billing method.</p></details><details><summary>What if the seller cannot supply the item?</summary><p>PikoBuy’s guide says that if an item is out of stock, the order will be refunded. Do not treat a listing price or stock display as a permanent promise before the purchase is completed.</p></details><details><summary>Can every warehouse item be returned?</summary><p>No. PikoBuy’s policy makes returns subject to seller eligibility, condition and timing. It describes an eligible application window within five days after an item changes to “In Warehouse,” and lists exclusions and special standards for some products.</p></details><details><summary>When can tracking appear?</summary><p>PikoBuy says tracking information will be available within three days after a parcel is shipped. This is not a fixed delivery-time promise.</p></details><details><summary>Are cross-border delivery outcomes guaranteed?</summary><p>No. PikoBuy says third-party logistics providers carry parcels and identifies risks including customs policies, delays, damage, loss and other uncontrollable events. Read current route details before submitting your parcel.</p></details></div></div></section>';

(()=>{const L={
de:{home:["PikoBuy Sheet ist ein klarer Ausgangspunkt für die Recherche nach Produktarten. Nutzen Sie die Karten, prüfen Sie die genaue Auswahl und öffnen Sie danach passende Live-Ergebnisse auf FindSpreadsheet.","10 Produktwege · Europa und Nordamerika · zuerst recherchieren","Jede Karte öffnet zuerst eine lokale Recherchehilfe. Die Produktaktion führt danach zu passenden Ergebnissen auf FindSpreadsheet.","Konzentrieren Sie die Recherche: Kategorie wählen, genaue Variante und sichtbare Angaben prüfen und Versanddetails erst mit bekanntem Ziel bewerten.","Titel sind nur ein Anfang. Entscheidend sind die Angaben zur ausgewählten Variante.","Optionen hängen von tatsächlichem Gewicht, Abmessungen und Land ab.","Kurze, praktische Hinweise zu Links, Fotos und Zielentscheidung vor dem Öffnen eines Live-Angebots."],detail:["Prüfen Sie den Artikel – nicht nur den Titel.","Nutzen Sie diese unabhängige Checkliste vor dem Öffnen eines Live-Produkts auf FindSpreadsheet.","Ausgewählte Farbe, Größe, Charge oder Variante|Sichtbare Fotos und angegebene Maße|Preis und Beschreibung der ausgewählten Variante|Passt die Kategorie zu Ihrem geplanten Paket?","QC-Fotos dokumentieren einen eingetroffenen Artikel. Sie ersetzen nicht die Prüfung der genauen Variante oder des aktuellen Angebots. Preis und verfügbare Routen hängen von Ziel, Gewicht und Maßen ab."],category:["Lesen Sie hier die fokussierte Kategoriehilfe. Produktaktionen bleiben auf Ihrer Hauptseite.","Vergleichen Sie die genaue Variante, sichtbare Angaben und Maße, bevor Sie ein Angebot öffnen.","Nutzen Sie das genaue Angebot als endgültige Quelle für Produktinformationen.|Bestätigen Sie Paketoptionen erst, wenn das Ziel bekannt ist.","Die passende Kategorieaktion öffnet die zugehörige Seite auf Ihrer Hauptseite."],seo:["Recherchehinweise für eine klarere Entscheidung.","Unabhängige Erklärungen zu Produktlinks, Fotoprüfung und Paketplanung. Jede Produktaktion führt zu FindSpreadsheet."],faq:["Was kann ich bei PikoBuy einreichen?|Sie können direkt suchen oder Produktlinks, Bilder oder eine Beschaffungsanfrage einreichen. Bewahren Sie Link, Größe, Farbe und Menge zusammen auf.","Ist die Warenzahlung gleich dem internationalen Versand?|Nein. Der Kauf der Ware und der spätere Versand sind getrennte Schritte. Versand wird gewählt und bezahlt, wenn Artikel im Lager liegen und ein Paket eingereicht wird.","Was geschieht im Lager?|PikoBuy beschreibt Check-in, Fotos und eine Prüfung auf sichtbare Mängel. Vor dem internationalen Versand werden Artikel im chinesischen Lager neu verpackt.","Garantieren Prüffotos Qualität oder Echtheit?|Nein. Fotos helfen beim Vergleich sichtbarer Merkmale mit der gewählten Variante. Sie beweisen weder alle Eigenschaften noch Haltbarkeit, Echtheit oder ein Lieferergebnis.","Wie schätze ich den Versand?|Nutzen Sie den aktuellen Rechner für Ihr tatsächliches Ziel und Paket. Land, Produkttyp, Gewicht und Maße beeinflussen Optionen und Preis.","Was passiert bei fehlendem Lagerbestand?|Der Leitfaden sagt, dass eine nicht verfügbare Bestellung erstattet wird. Ein angezeigter Preis oder Bestand ist keine dauerhafte Zusage.","Kann jeder Lagerartikel zurückgegeben werden?|Nein. Rückgaben hängen von Verkäufer, Zustand und Frist ab. Für berechtigte Anträge nennt die Richtlinie ein Fenster von fünf Tagen nach „Im Lager“.","Wann erscheint Tracking?|PikoBuy sagt, dass Tracking innerhalb von drei Tagen nach Versand verfügbar ist. Das ist keine feste Lieferzeit.","Sind grenzüberschreitende Ergebnisse garantiert?|Nein. Drittanbieter befördern Pakete; Zoll, Verzögerungen, Schäden, Verlust und andere unkontrollierbare Ereignisse bleiben mögliche Risiken."] ,art:["Originalangebot und gewählte Variante gehören zusammen. Notieren Sie Link, Farbe, Größe, Menge und sichtbare Maße, bevor Sie eine Anfrage absenden. Ein Titel oder Vorschaubild beweist nicht, dass jede Auswahl identisch ist.","PikoBuy trennt Warenkauf, Lagerprüfung und internationalen Versand. Nach dem Lagerzugang helfen Fotos beim Vergleich sichtbarer Farbe, Etiketten, Menge und Zustand mit Ihrer dokumentierten Auswahl.","Verwenden Sie Fotos als sichtbaren Nachweis, nicht als allgemeine Zusage. Sie können keine Echtheit, innere Eigenschaften, spätere Haltbarkeit oder ein bestimmtes Lieferergebnis garantieren.","Wählen Sie Versandoptionen erst anhand des echten Ziels, Produkttyps, Gewichts und der Maße. Alte Angaben anderer Käufer sind keine aktuelle Berechnung für Ihr Paket.","Bewahren Sie Angebot, Auswahl, Lagerfotos, Paketdaten und Tracking zusammen auf. So lassen sich Änderungen anhand von Fakten statt aus Erinnerung prüfen.","PikoBuy weist auf Drittlogistik und grenzüberschreitende Risiken hin. Prüfen Sie die aktuellen Bedingungen, bevor Sie ein Paket einreichen, und vermeiden Sie feste Zusagen zu Preis, Zoll oder Ankunft."]},
fr:{home:["PikoBuy Sheet est un point de départ clair pour rechercher des types de produits. Utilisez les cartes, vérifiez la variante exacte, puis ouvrez les résultats correspondants sur FindSpreadsheet.","10 parcours produits · Europe et Amérique du Nord · rechercher d’abord","Chaque carte ouvre d’abord une note de recherche locale. L’action produit mène ensuite vers les résultats correspondants sur FindSpreadsheet.","Gardez la recherche ciblée : choisissez une catégorie, vérifiez la variante et les informations visibles, puis examinez l’envoi seulement quand la destination est connue.","Un titre est un point de départ. Les détails appartiennent à la variante sélectionnée.","Les options dépendent du poids réel, des dimensions et du pays.","Des notes pratiques sur les liens, les photos et la destination avant d’ouvrir une annonce active."],detail:["Vérifiez l’article, pas seulement le titre.","Utilisez cette liste indépendante avant d’ouvrir une annonce FindSpreadsheet.","Couleur, taille, lot ou variante sélectionnés|Photos visibles et dimensions indiquées|Prix et description de la version choisie|La catégorie convient-elle à votre colis ?","Les photos QC documentent un article reçu, mais ne remplacent pas la vérification de la variante exacte. Les routes et le prix dépendent de la destination, du poids et des dimensions."],category:["Lisez ici la note de catégorie ciblée. Les actions produit restent sur votre site principal.","Comparez la variante exacte, les informations visibles et les dimensions avant d’ouvrir une annonce.","Utilisez l’annonce exacte comme source finale.|Confirmez les options de colis seulement après avoir choisi la destination.","L’action de catégorie correspondante ouvre la page associée sur votre site principal."],seo:["Notes de recherche pour une décision plus claire.","Des explications indépendantes sur les liens produit, les photos et la préparation du colis. Chaque action produit continue vers FindSpreadsheet."],faq:["Que puis-je envoyer à PikoBuy ?|Vous pouvez chercher directement ou envoyer un lien, une image ou une demande de sourcing. Conservez le lien, la taille, la couleur et la quantité ensemble.","Le paiement du produit est-il le même que l’expédition ?|Non. L’achat de l’article et l’expédition internationale sont des étapes distinctes. L’expédition est choisie et payée après l’arrivée des articles au dépôt.","Que se passe-t-il au dépôt ?|PikoBuy décrit la réception, les photos et une vérification des défauts visibles. Les articles sont reconditionnés avant l’envoi international.","Les photos d’inspection garantissent-elles la qualité ?|Non. Elles servent à comparer des détails visibles avec la variante choisie. Elles ne prouvent pas toutes les caractéristiques, l’authenticité, la durabilité ou le résultat de livraison.","Comment estimer l’expédition ?|Utilisez l’estimateur actuel pour votre destination et colis réels. Le pays, le type de produit, le poids et les dimensions influencent les options.","Que se passe-t-il si le vendeur est en rupture ?|Le guide indique qu’une commande en rupture est remboursée. Un prix ou stock affiché n’est pas une promesse permanente.","Tout article peut-il être retourné ?|Non. L’éligibilité dépend du vendeur, de l’état et du délai. La politique décrit une fenêtre de cinq jours après le statut « In Warehouse » pour les demandes éligibles.","Quand le suivi apparaît-il ?|PikoBuy indique que le suivi sera disponible dans les trois jours après l’expédition. Ce n’est pas une promesse de délai de livraison.","Les résultats internationaux sont-ils garantis ?|Non. Des prestataires tiers transportent les colis ; douane, retard, dommage, perte et autres événements hors contrôle restent possibles."] ,art:["Le lien source et la variante choisie doivent rester ensemble. Notez le lien, la couleur, la taille, la quantité et les mesures visibles avant d’envoyer une demande. Un titre ou une miniature ne prouve pas que toutes les variantes sont identiques.","PikoBuy distingue l’achat, le contrôle au dépôt et l’expédition internationale. Après réception au dépôt, les photos aident à comparer couleur, étiquettes, quantité et état visibles avec votre sélection.","Utilisez les photos comme preuve visible, non comme garantie générale. Elles ne peuvent pas certifier l’authenticité, les éléments internes, la durabilité future ou un résultat de livraison.","Choisissez les options d’envoi à partir de la destination, du type de produit, du poids et des dimensions réels. L’estimation ancienne d’un autre acheteur n’est pas un devis actuel.","Conservez l’annonce, la sélection, les photos du dépôt, les données du colis et le suivi ensemble. Ainsi, les changements se vérifient avec des faits et non des souvenirs.","PikoBuy signale la logistique tierce et les risques transfrontaliers. Lisez les conditions actuelles avant de soumettre un colis et évitez les promesses fixes sur le prix, la douane ou l’arrivée."]},
es:{home:["PikoBuy Sheet es un punto de partida claro para investigar tipos de productos. Usa las tarjetas, revisa la variante exacta y después abre los resultados correspondientes en FindSpreadsheet.","10 rutas de producto · Europa y Norteamérica · investiga primero","Cada tarjeta abre primero una nota local de investigación. La acción del producto lleva después a resultados correspondientes en FindSpreadsheet.","Mantén la investigación enfocada: elige categoría, revisa la variante e información visible y evalúa el envío solo cuando conozcas el destino.","Un título es solo un comienzo. Los detalles pertenecen a la variante elegida.","Las opciones dependen del peso, las dimensiones y el país reales.","Notas prácticas sobre enlaces, fotos y destino antes de abrir un listado activo."],detail:["Revisa el artículo, no solo el título.","Usa esta lista independiente antes de abrir un producto de FindSpreadsheet.","Color, talla, lote o variante elegidos|Fotos visibles y dimensiones indicadas|Precio y descripción de la versión elegida|¿La categoría encaja con tu paquete previsto?","Las fotos QC documentan un artículo recibido, pero no sustituyen revisar la variante exacta. El precio y las rutas dependen del destino, peso y dimensiones reales."],category:["Lee aquí la nota de categoría enfocada. Las acciones de producto permanecen en tu sitio principal.","Compara la variante exacta, la información visible y las medidas antes de abrir un listado.","Usa el listado exacto como fuente final.|Confirma opciones de paquete solo cuando se conozca el destino.","La acción de categoría correspondiente abre la página relacionada en tu sitio principal."],seo:["Notas de investigación para decidir con más claridad.","Explicaciones independientes sobre enlaces de producto, revisión de fotos y planificación de paquetes. Cada acción continúa a FindSpreadsheet."],faq:["¿Qué puedo enviar a PikoBuy?|Puedes buscar directamente o enviar enlaces, imágenes o solicitudes de abastecimiento. Guarda juntos enlace, talla, color y cantidad.","¿El pago del artículo es igual al envío internacional?|No. La compra y el envío internacional son pasos distintos. El envío se elige y paga cuando los artículos están en almacén y se envía un paquete.","¿Qué ocurre en el almacén?|PikoBuy describe recepción, fotos y revisión de defectos visibles. Los artículos se vuelven a empaquetar antes del envío internacional.","¿Las fotos de inspección garantizan calidad o autenticidad?|No. Sirven para comparar detalles visibles con la variante elegida. No prueban todas las características, autenticidad, durabilidad ni resultado de entrega.","¿Cómo estimo el envío?|Usa el estimador actual para tu destino y paquete reales. País, tipo de producto, peso y medidas influyen en opciones y precio.","¿Qué pasa si el vendedor no tiene existencias?|La guía dice que se reembolsa un pedido sin existencias. El precio o stock mostrado no es una promesa permanente.","¿Se puede devolver cualquier artículo de almacén?|No. Depende del vendedor, condición y plazo. La política describe cinco días desde «In Warehouse» para solicitudes elegibles.","¿Cuándo aparece el seguimiento?|PikoBuy indica que el seguimiento estará disponible dentro de tres días tras el envío. No es una promesa de entrega.","¿Se garantizan los resultados transfronterizos?|No. Transportistas terceros llevan los paquetes; aduanas, retrasos, daños, pérdida y otros sucesos no controlables siguen siendo riesgos posibles."] ,art:["El enlace de origen y la variante elegida deben mantenerse juntos. Anota enlace, color, talla, cantidad y medidas visibles antes de enviar una solicitud. Un título o miniatura no prueba que todas las opciones sean iguales.","PikoBuy separa compra, revisión de almacén y envío internacional. Cuando el artículo llega al almacén, las fotos ayudan a comparar color, etiquetas, cantidad y condición visibles con tu selección.","Usa fotos como evidencia visible, no como una garantía general. No pueden probar autenticidad, rasgos internos, durabilidad futura ni un resultado de entrega.","Elige envío según el destino, tipo de producto, peso y medidas reales. La estimación antigua de otra persona no es un presupuesto actual para tu paquete.","Guarda juntos el listado, la selección, las fotos de almacén, datos del paquete y seguimiento. Así puedes revisar cambios con hechos, no con memoria.","PikoBuy señala logística de terceros y riesgos transfronterizos. Lee las condiciones actuales antes de enviar un paquete y evita promesas fijas sobre precio, aduanas o llegada."]},
it:{home:["PikoBuy Sheet è un punto di partenza chiaro per cercare categorie di prodotti. Usa le schede, verifica la variante esatta e poi apri i risultati corrispondenti su FindSpreadsheet.","10 percorsi prodotto · Europa e Nord America · prima ricerca","Ogni scheda apre prima una nota locale di ricerca. L’azione prodotto porta poi ai risultati corrispondenti su FindSpreadsheet.","Mantieni la ricerca mirata: scegli la categoria, verifica la variante e le informazioni visibili e valuta la spedizione solo quando conosci la destinazione.","Un titolo è solo l’inizio. I dettagli riguardano la variante selezionata.","Le opzioni dipendono da peso, dimensioni e paese reali.","Note pratiche su link, foto e destinazione prima di aprire un annuncio attivo."],detail:["Controlla l’articolo, non solo il titolo.","Usa questa lista indipendente prima di aprire un prodotto FindSpreadsheet.","Colore, taglia, lotto o variante selezionati|Foto visibili e dimensioni indicate|Prezzo e descrizione della versione selezionata|La categoria è adatta al pacco previsto?","Le foto QC documentano un articolo ricevuto, ma non sostituiscono il controllo della variante esatta. Prezzo e rotte dipendono da destinazione, peso e dimensioni reali."],category:["Leggi qui la nota mirata della categoria. Le azioni prodotto restano sul tuo sito principale.","Confronta variante esatta, informazioni visibili e misure prima di aprire un annuncio.","Usa l’annuncio esatto come fonte finale.|Conferma le opzioni del pacco solo quando conosci la destinazione.","L’azione della categoria corrispondente apre la pagina collegata sul tuo sito principale."],seo:["Note di ricerca per una decisione più chiara.","Spiegazioni indipendenti su link prodotto, controlli fotografici e pianificazione del pacco. Ogni azione continua su FindSpreadsheet."],faq:["Cosa posso inviare a PikoBuy?|Puoi cercare direttamente o inviare link, immagini o richieste di sourcing. Conserva insieme link, taglia, colore e quantità.","Il pagamento del prodotto coincide con la spedizione internazionale?|No. Acquisto e spedizione internazionale sono fasi distinte. La spedizione viene scelta e pagata quando gli articoli sono in magazzino e si invia un pacco.","Cosa succede in magazzino?|PikoBuy descrive ricezione, foto e controllo dei difetti visibili. Gli articoli vengono reimballati prima della spedizione internazionale.","Le foto di ispezione garantiscono qualità o autenticità?|No. Servono a confrontare dettagli visibili con la variante scelta. Non dimostrano ogni caratteristica, autenticità, durata o risultato di consegna.","Come stimo la spedizione?|Usa il calcolatore corrente per destinazione e pacco reali. Paese, tipo di prodotto, peso e dimensioni incidono su opzioni e prezzo.","Cosa accade se il venditore è senza stock?|La guida dice che un ordine non disponibile viene rimborsato. Prezzo o disponibilità mostrati non sono una promessa permanente.","Ogni articolo in magazzino può essere restituito?|No. Dipende da venditore, condizione e tempistica. La policy descrive cinque giorni dopo «In Warehouse» per richieste idonee.","Quando compare il tracking?|PikoBuy indica che il tracking sarà disponibile entro tre giorni dalla spedizione. Non è una promessa sul tempo di consegna.","I risultati transfrontalieri sono garantiti?|No. I pacchi sono trasportati da terzi; dogana, ritardi, danni, perdita e altri eventi incontrollabili restano possibili."] ,art:["Il link sorgente e la variante scelta devono restare insieme. Annota link, colore, taglia, quantità e misure visibili prima di inviare una richiesta. Titolo o miniatura non provano che tutte le opzioni siano identiche.","PikoBuy separa acquisto, controllo in magazzino e spedizione internazionale. Dopo l’arrivo, le foto aiutano a confrontare colore, etichette, quantità e condizione visibili con la selezione.","Usa le foto come prova visibile, non come garanzia generale. Non possono certificare autenticità, caratteristiche interne, durata futura o un risultato di consegna.","Scegli la spedizione in base a destinazione, tipo di prodotto, peso e dimensioni reali. La vecchia stima di un altro acquirente non è un preventivo attuale.","Conserva annuncio, selezione, foto del magazzino, dati del pacco e tracking insieme. Così verifichi le modifiche con fatti invece che con ricordi.","PikoBuy segnala logistica di terzi e rischi transfrontalieri. Leggi le condizioni correnti prima di inviare un pacco ed evita promesse fisse su prezzo, dogana o arrivo."]},
pt:{home:["PikoBuy Sheet é um ponto de partida claro para pesquisar categorias de produtos. Use os cartões, verifique a variante exata e depois abra os resultados correspondentes no FindSpreadsheet.","10 caminhos de produto · Europa e América do Norte · pesquise primeiro","Cada cartão abre primeiro uma nota local de pesquisa. A ação do produto leva depois aos resultados correspondentes no FindSpreadsheet.","Mantenha a pesquisa focada: escolha a categoria, confira a variante e as informações visíveis e avalie o envio apenas quando souber o destino.","Um título é apenas o começo. Os detalhes pertencem à variante selecionada.","As opções dependem de peso, dimensões e país reais.","Notas práticas sobre links, fotos e destino antes de abrir uma listagem ativa."],detail:["Confira o item, não apenas o título.","Use esta lista independente antes de abrir um produto no FindSpreadsheet.","Cor, tamanho, lote ou variante selecionados|Fotos visíveis e medidas listadas|Preço e descrição da versão escolhida|A categoria serve para o pacote planejado?","Fotos QC documentam um item recebido, mas não substituem a conferência da variante exata. Preço e rotas dependem do destino, peso e dimensões reais."],category:["Leia aqui a nota focada da categoria. As ações de produto ficam no seu site principal.","Compare variante exata, informações visíveis e medidas antes de abrir uma listagem.","Use a listagem exata como fonte final.|Confirme opções de pacote apenas após conhecer o destino.","A ação da categoria correspondente abre a página relacionada no seu site principal."],seo:["Notas de pesquisa para uma decisão mais clara.","Explicações independentes sobre links de produto, verificação de fotos e planejamento de pacotes. Cada ação continua no FindSpreadsheet."],faq:["O que posso enviar ao PikoBuy?|Você pode pesquisar diretamente ou enviar links, imagens ou pedidos de sourcing. Mantenha juntos link, tamanho, cor e quantidade.","O pagamento do item é igual ao frete internacional?|Não. Compra e envio internacional são etapas separadas. O frete é escolhido e pago depois que os itens estão no armazém e um pacote é enviado.","O que acontece no armazém?|PikoBuy descreve recebimento, fotos e verificação de defeitos visíveis. Os itens são reembalados antes do envio internacional.","Fotos de inspeção garantem qualidade ou autenticidade?|Não. Elas ajudam a comparar detalhes visíveis com a variante escolhida. Não provam todas as características, autenticidade, durabilidade ou resultado de entrega.","Como estimo o frete?|Use o estimador atual para destino e pacote reais. País, tipo de produto, peso e dimensões influenciam as opções.","O que ocorre se o vendedor não tiver estoque?|O guia diz que um pedido sem estoque será reembolsado. Preço ou estoque mostrado não é uma promessa permanente.","Todo item no armazém pode ser devolvido?|Não. Depende do vendedor, condição e prazo. A política descreve cinco dias após «In Warehouse» para pedidos elegíveis.","Quando o rastreio aparece?|PikoBuy informa que o rastreio estará disponível dentro de três dias após o envio. Isso não é uma promessa de entrega.","Resultados internacionais são garantidos?|Não. Transportadoras terceiras levam os pacotes; alfândega, atrasos, danos, perda e outros eventos incontroláveis continuam sendo riscos possíveis."] ,art:["O link de origem e a variante escolhida devem ficar juntos. Anote link, cor, tamanho, quantidade e medidas visíveis antes de enviar um pedido. Um título ou miniatura não prova que todas as opções são iguais.","PikoBuy separa compra, verificação no armazém e envio internacional. Após a chegada, as fotos ajudam a comparar cor, etiquetas, quantidade e condição visíveis com sua seleção.","Use fotos como evidência visível, não como garantia geral. Elas não podem provar autenticidade, recursos internos, durabilidade futura ou resultado de entrega.","Escolha o envio com base no destino, tipo de produto, peso e dimensões reais. A estimativa antiga de outro comprador não é uma cotação atual para seu pacote.","Guarde listagem, seleção, fotos do armazém, dados do pacote e rastreio juntos. Assim você avalia mudanças com fatos, não com memória.","PikoBuy aponta logística terceirizada e riscos transfronteiriços. Leia as condições atuais antes de enviar um pacote e evite promessas fixas sobre preço, alfândega ou chegada."]},
nl:{home:["PikoBuy Sheet is een helder startpunt voor onderzoek naar productsoorten. Gebruik de kaarten, controleer de exacte variant en open daarna de passende resultaten op FindSpreadsheet.","10 productroutes · Europa en Noord-Amerika · eerst onderzoeken","Elke kaart opent eerst een lokale onderzoeksnotitie. De productactie leidt daarna naar passende resultaten op FindSpreadsheet.","Houd onderzoek gericht: kies een categorie, controleer variant en zichtbare informatie en beoordeel verzending pas wanneer de bestemming bekend is.","Een titel is slechts een begin. Details horen bij de gekozen variant.","Opties hangen af van werkelijk gewicht, afmetingen en land.","Praktische notities over links, foto’s en bestemming vóór u een actuele aanbieding opent."],detail:["Controleer het artikel, niet alleen de titel.","Gebruik deze onafhankelijke checklist voordat u een FindSpreadsheet-product opent.","Gekozen kleur, maat, batch of variant|Zichtbare foto’s en vermelde afmetingen|Prijs en beschrijving van de gekozen versie|Past de categorie bij uw geplande pakket?","QC-foto’s leggen een ontvangen artikel vast, maar vervangen het controleren van de exacte variant niet. Prijs en routes hangen af van bestemming, gewicht en afmetingen."],category:["Lees hier de gerichte categorienotitie. Productacties blijven op uw hoofdsite.","Vergelijk de exacte variant, zichtbare informatie en afmetingen voordat u een aanbieding opent.","Gebruik de exacte aanbieding als eindbron.|Bevestig pakketopties pas wanneer de bestemming bekend is.","De passende categorieactie opent de verbonden pagina op uw hoofdsite."],seo:["Onderzoeksnotities voor een duidelijkere beslissing.","Onafhankelijke uitleg over productlinks, fotocontrole en pakketplanning. Elke productactie gaat door naar FindSpreadsheet."],faq:["Wat kan ik bij PikoBuy indienen?|U kunt rechtstreeks zoeken of productlinks, afbeeldingen of een sourcingverzoek indienen. Bewaar link, maat, kleur en hoeveelheid samen.","Is productbetaling hetzelfde als internationale verzending?|Nee. De aankoop van het artikel en internationale verzending zijn aparte stappen. Verzending wordt gekozen en betaald wanneer artikelen in het magazijn liggen en een pakket wordt ingediend.","Wat gebeurt er in het magazijn?|PikoBuy beschrijft ontvangst, foto’s en controle op zichtbare gebreken. Artikelen worden vóór internationale verzending opnieuw verpakt.","Garanderen inspectiefoto’s kwaliteit of echtheid?|Nee. Ze helpen zichtbare details te vergelijken met de gekozen variant. Ze bewijzen niet alle kenmerken, echtheid, duurzaamheid of een leveringsresultaat.","Hoe schat ik verzending?|Gebruik de actuele schatter voor uw werkelijke bestemming en pakket. Land, producttype, gewicht en afmetingen beïnvloeden de opties.","Wat als de verkoper geen voorraad heeft?|De gids zegt dat een niet-voorraad bestelling wordt terugbetaald. Getoonde prijs of voorraad is geen blijvende belofte.","Kan elk magazijnartikel worden geretourneerd?|Nee. Dit hangt af van verkoper, staat en termijn. Het beleid noemt vijf dagen na «In Warehouse» voor in aanmerking komende aanvragen.","Wanneer verschijnt tracking?|PikoBuy zegt dat tracking binnen drie dagen na verzending beschikbaar is. Dit is geen vaste bezorgbelofte.","Zijn grensoverschrijdende resultaten gegarandeerd?|Nee. Derde vervoerders dragen pakketten; douane, vertraging, schade, verlies en andere onbeheersbare gebeurtenissen blijven mogelijke risico’s."] ,art:["De bronlink en gekozen variant horen bij elkaar. Noteer link, kleur, maat, aantal en zichtbare afmetingen vóór u een verzoek indient. Een titel of miniatuur bewijst niet dat iedere optie gelijk is.","PikoBuy scheidt aankoop, magazijncontrole en internationale verzending. Na aankomst helpen foto’s om zichtbare kleur, labels, aantal en conditie met uw selectie te vergelijken.","Gebruik foto’s als zichtbaar bewijs, niet als algemene garantie. Zij kunnen geen echtheid, interne kenmerken, toekomstige duurzaamheid of leveringsresultaat bewijzen.","Kies verzending op basis van echte bestemming, producttype, gewicht en afmetingen. Een oude schatting van iemand anders is geen actuele offerte voor uw pakket.","Bewaar aanbieding, selectie, magazijnfoto’s, pakketgegevens en tracking samen. Zo beoordeelt u veranderingen met feiten in plaats van herinneringen.","PikoBuy wijst op logistiek van derden en grensoverschrijdende risico’s. Lees actuele voorwaarden vóór u een pakket indient en vermijd vaste beloften over prijs, douane of aankomst."]},
pl:{home:["PikoBuy Sheet to przejrzysty punkt startowy do badania kategorii produktów. Użyj kart, sprawdź dokładny wariant, a potem otwórz pasujące wyniki w FindSpreadsheet.","10 ścieżek produktów · Europa i Ameryka Północna · najpierw badanie","Każda karta najpierw otwiera lokalną notatkę badawczą. Działanie produktu prowadzi potem do pasujących wyników FindSpreadsheet.","Prowadź badanie konkretnie: wybierz kategorię, sprawdź wariant i widoczne informacje, a wysyłkę oceniaj dopiero po poznaniu kraju docelowego.","Tytuł to tylko początek. Szczegóły dotyczą wybranego wariantu.","Opcje zależą od rzeczywistej wagi, wymiarów i kraju.","Praktyczne notatki o linkach, zdjęciach i celu przed otwarciem aktywnej oferty."],detail:["Sprawdź przedmiot, nie tylko tytuł.","Użyj tej niezależnej listy przed otwarciem produktu FindSpreadsheet.","Wybrany kolor, rozmiar, partia lub wariant|Widoczne zdjęcia i podane wymiary|Cena i opis wybranej wersji|Czy kategoria pasuje do planowanej paczki?","Zdjęcia QC dokumentują otrzymany przedmiot, ale nie zastępują sprawdzenia dokładnego wariantu. Cena i trasy zależą od celu, wagi i wymiarów."],category:["Przeczytaj tutaj ukierunkowaną notatkę kategorii. Działania produktu pozostają na Twojej stronie głównej.","Porównaj dokładny wariant, widoczne informacje i wymiary przed otwarciem oferty.","Użyj dokładnej oferty jako ostatecznego źródła.|Potwierdź opcje paczki dopiero po poznaniu celu.","Działanie pasującej kategorii otwiera powiązaną stronę na Twojej stronie głównej."],seo:["Notatki badawcze dla jaśniejszej decyzji.","Niezależne wyjaśnienia o linkach produktów, kontroli zdjęć i planowaniu paczek. Każde działanie prowadzi do FindSpreadsheet."],faq:["Co mogę przesłać do PikoBuy?|Możesz szukać bezpośrednio lub przesłać linki produktów, zdjęcia albo prośbę o sourcing. Trzymaj razem link, rozmiar, kolor i ilość.","Czy płatność za produkt to to samo co wysyłka międzynarodowa?|Nie. Zakup towaru i wysyłka międzynarodowa są osobnymi etapami. Wysyłkę wybiera się i opłaca po przyjęciu produktów do magazynu.","Co dzieje się w magazynie?|PikoBuy opisuje przyjęcie, zdjęcia i kontrolę widocznych wad. Produkty są przepakowywane przed wysyłką międzynarodową.","Czy zdjęcia inspekcyjne gwarantują jakość lub autentyczność?|Nie. Pomagają porównać widoczne szczegóły z wybranym wariantem. Nie dowodzą wszystkich cech, autentyczności, trwałości ani wyniku dostawy.","Jak oszacować wysyłkę?|Użyj aktualnego kalkulatora dla rzeczywistego celu i paczki. Kraj, typ produktu, waga i wymiary wpływają na opcje.","Co jeśli sprzedawca nie ma towaru?|Przewodnik mówi, że zamówienie bez towaru zostanie zwrócone. Widoczna cena lub stan nie są trwałą obietnicą.","Czy każdy produkt w magazynie można zwrócić?|Nie. Zależy to od sprzedawcy, stanu i terminu. Polityka opisuje pięć dni po statusie «In Warehouse» dla kwalifikujących się wniosków.","Kiedy pojawia się śledzenie?|PikoBuy podaje, że śledzenie będzie dostępne w ciągu trzech dni po wysyłce. Nie jest to obietnica terminu doręczenia.","Czy wynik wysyłki międzynarodowej jest gwarantowany?|Nie. Paczki przewożą podmioty trzecie; cło, opóźnienia, uszkodzenie, utrata i inne niekontrolowane zdarzenia pozostają możliwym ryzykiem."] ,art:["Link źródłowy i wybrany wariant powinny pozostać razem. Zapisz link, kolor, rozmiar, ilość i widoczne wymiary przed wysłaniem prośby. Tytuł lub miniatura nie dowodzą, że wszystkie opcje są takie same.","PikoBuy rozdziela zakup, kontrolę magazynową i wysyłkę międzynarodową. Po przyjęciu zdjęcia pomagają porównać widoczny kolor, etykiety, ilość i stan z wyborem.","Używaj zdjęć jako widocznego dowodu, nie jako ogólnej gwarancji. Nie mogą potwierdzić autentyczności, cech wewnętrznych, przyszłej trwałości ani wyniku dostawy.","Wybieraj wysyłkę według rzeczywistego celu, typu produktu, wagi i wymiarów. Stara wycena innego kupującego nie jest aktualną ofertą dla Twojej paczki.","Zachowaj razem ofertę, wybór, zdjęcia magazynowe, dane paczki i śledzenie. Wtedy oceniasz zmiany na podstawie faktów, a nie pamięci.","PikoBuy wskazuje na logistykę stron trzecich i ryzyko transgraniczne. Przeczytaj aktualne warunki przed wysłaniem paczki i unikaj stałych obietnic o cenie, cle lub przybyciu."]},
sv:{home:["PikoBuy Sheet är en tydlig startpunkt för att undersöka produktkategorier. Använd korten, kontrollera den exakta varianten och öppna sedan matchande resultat på FindSpreadsheet.","10 produktvägar · Europa och Nordamerika · undersök först","Varje kort öppnar först en lokal forskningsnotis. Produktåtgärden leder sedan till matchande resultat på FindSpreadsheet.","Håll forskningen fokuserad: välj kategori, kontrollera variant och synlig information och bedöm frakt först när destinationen är känd.","En titel är bara en början. Detaljer hör till den valda varianten.","Alternativ beror på verklig vikt, mått och land.","Praktiska notiser om länkar, bilder och destination innan du öppnar en aktiv annons."],detail:["Kontrollera varan, inte bara titeln.","Använd denna oberoende checklista innan du öppnar en FindSpreadsheet-produkt.","Vald färg, storlek, batch eller variant|Synliga bilder och angivna mått|Pris och beskrivning för vald version|Passar kategorin ditt planerade paket?","QC-bilder dokumenterar en mottagen vara men ersätter inte kontroll av exakt variant. Pris och rutter beror på destination, vikt och mått."],category:["Läs här den fokuserade kategorinotisen. Produktåtgärder finns kvar på din huvudsida.","Jämför exakt variant, synlig information och mått innan du öppnar en annons.","Använd den exakta annonsen som slutlig källa.|Bekräfta paketalternativ först när destinationen är känd.","Den matchande kategoriåtgärden öppnar den relaterade sidan på din huvudsida."],seo:["Forskningsnotiser för ett tydligare beslut.","Oberoende förklaringar om produktlänkar, bildkontroll och paketplanering. Varje produktåtgärd går vidare till FindSpreadsheet."],faq:["Vad kan jag skicka till PikoBuy?|Du kan söka direkt eller skicka produktlänkar, bilder eller en sourcingförfrågan. Spara länk, storlek, färg och antal tillsammans.","Är produktbetalningen samma som internationell frakt?|Nej. Varuköp och internationell frakt är separata steg. Frakt väljs och betalas när varor finns i lagret och ett paket skickas in.","Vad händer i lagret?|PikoBuy beskriver incheckning, bilder och kontroll av synliga fel. Varor packas om före internationell frakt.","Garanterar inspektionsbilder kvalitet eller äkthet?|Nej. De hjälper att jämföra synliga detaljer med vald variant. De bevisar inte alla egenskaper, äkthet, hållbarhet eller leveransresultat.","Hur uppskattar jag frakt?|Använd den aktuella beräknaren för verklig destination och paket. Land, produkttyp, vikt och mått påverkar alternativen.","Vad händer om säljaren saknar lager?|Guiden säger att en ej tillgänglig order återbetalas. Visat pris eller lager är inte ett permanent löfte.","Kan varje lagervara returneras?|Nej. Det beror på säljare, skick och tid. Policyn beskriver fem dagar efter «In Warehouse» för behöriga ansökningar.","När visas spårning?|PikoBuy säger att spårning blir tillgänglig inom tre dagar efter sändning. Det är inte ett fast leveranslöfte.","Är gränsöverskridande resultat garanterade?|Nej. Tredje parter transporterar paket; tull, förseningar, skada, förlust och andra okontrollerbara händelser är fortfarande möjliga risker."] ,art:["Källänken och den valda varianten ska hållas ihop. Spara länk, färg, storlek, antal och synliga mått före en förfrågan. En titel eller miniatyr bevisar inte att varje alternativ är identiskt.","PikoBuy skiljer inköp, lagerkontroll och internationell frakt. Efter ankomst hjälper bilder att jämföra synlig färg, etiketter, antal och skick med ditt val.","Använd bilder som synligt underlag, inte som en allmän garanti. De kan inte bevisa äkthet, inre egenskaper, framtida hållbarhet eller ett leveransresultat.","Välj frakt utifrån verklig destination, produkttyp, vikt och mått. En gammal uppskattning från någon annan är inte en aktuell offert för ditt paket.","Spara annons, val, lagerbilder, paketuppgifter och spårning tillsammans. Då granskar du ändringar med fakta i stället för minne.","PikoBuy beskriver tredjepartslogistik och gränsöverskridande risker. Läs aktuella villkor innan du skickar in ett paket och undvik fasta löften om pris, tull eller ankomst."]}

function localArticle(lang,x){const key=Object.keys(articles).indexOf(path);if(key<0)return;const title=titleMap[lang][key],head=document.querySelector('.page-head');put(head?.querySelector('h1'),title);put(head?.querySelector('p'),x.art[0]);const sectionTitles=[['Source et sélection','Warehouse evidence','Parcel decision'],['Quellenangebot und Auswahl','Lagerbeleg','Paketentscheidung'],['Oferta y selección','Evidencia de almacén','Decisión del paquete'],['Offerta e selezione','Evidenza del magazzino','Decisione sul pacco'],['Oferta e seleção','Evidência do armazém','Decisão do pacote'],['Bronaanbieding en selectie','Magazijnbewijs','Pakketbeslissing'],['Oferta źródłowa i wybór','Dowód magazynowy','Decyzja o paczce'],['Källerbjudande och val','Lagerunderlag','Paketbeslut']];const index=['fr','de','es','it','pt','nl','pl','sv'].indexOf(lang),hs=sectionTitles[index];const body=[0,1,2,3,4,5].map(i=>'<p>'+x.art[i]+'</p>').join('');const reader=document.querySelector('.article');if(reader)reader.innerHTML=hs.map((h,i)=>'<h2>'+h+'</h2>'+x.art.slice(i*2,i*2+2).map(p=>'<p>'+p+'</p>').join('')+body).join('')+'<p><a class="button" href="'+FS+'">'+continueLabels[lang]+'</a></p>'}

if(articles[path]){localArticle(lang,x);return}
if(path==='/'||path==='/index.html/'){put(document.querySelector('.lede'),x.home[0]);put(document.querySelector('.edition span'),x.home[1]);const heads=[...document.querySelectorAll('.section-head')],stories=[...document.querySelectorAll('.story')];put(heads[0]?.querySelector('p'),x.home[2]);put(document.querySelector('.feature h3'),r[5]);put(document.querySelector('.feature p'),x.home[3]);put(document.querySelectorAll('.note p')[0],x.home[4]);put(document.querySelectorAll('.note p')[1],x.home[5]);put(heads[2]?.querySelector('p'),x.home[6]);stories.forEach((s,i)=>{put(s.querySelector('h3'),titleMap[lang][i]);put(s.querySelector('p'),x.home[6])});put(heads[3]?.querySelector('h2'),r[4]);localFaq(x);return}
