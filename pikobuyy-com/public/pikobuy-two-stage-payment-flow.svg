<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Pikobuy two-stage payment flow</title>
  <desc id="desc">An original diagram showing product-order payment, warehouse inspection, and international-shipping payment as separate stages.</desc>
  <rect width="1200" height="630" rx="40" fill="#173127"/>
  <text x="72" y="82" fill="#b7e33d" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2">PIKOBUY PAYMENT WORKFLOW</text>
  <text x="72" y="132" fill="#ffffff" font-family="Arial, sans-serif" font-size="38" font-weight="700">Two payments, one warehouse checkpoint.</text>
  <path d="M238 343H493M707 343H962" fill="none" stroke="#b7e33d" stroke-width="8" stroke-linecap="round"/>
  <path d="M474 327l24 16-24 16M943 327l24 16-24 16" fill="none" stroke="#b7e33d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="72" y="208" width="330" height="270" rx="28" fill="#f7f4e9"/>
    <circle cx="126" cy="262" r="24" fill="#b7e33d"/>
    <text x="118" y="271" fill="#173127" font-family="Arial, sans-serif" font-size="25" font-weight="800">1</text>
    <text x="112" y="322" fill="#173127" font-family="Arial, sans-serif" font-size="25" font-weight="700">Product-order payment</text>
    <text x="112" y="365" fill="#536159" font-family="Arial, sans-serif" font-size="18">Confirm seller, variant, quantity</text>
    <text x="112" y="397" fill="#536159" font-family="Arial, sans-serif" font-size="18">and the live order breakdown.</text>
    <text x="112" y="445" fill="#173127" font-family="Arial, sans-serif" font-size="15" font-weight="700">NOT INTERNATIONAL SHIPPING</text>
  </g>
  <g>
    <rect x="435" y="258" width="330" height="270" rx="28" fill="#dfe7df"/>
    <circle cx="489" cy="312" r="24" fill="#ffffff"/>
    <text x="481" y="321" fill="#173127" font-family="Arial, sans-serif" font-size="25" font-weight="800">2</text>
    <text x="475" y="372" fill="#173127" font-family="Arial, sans-serif" font-size="25" font-weight="700">Warehouse checkpoint</text>
    <text x="475" y="415" fill="#536159" font-family="Arial, sans-serif" font-size="18">Arrival, visible inspection, photos</text>
    <text x="475" y="447" fill="#536159" font-family="Arial, sans-serif" font-size="18">and measured parcel planning.</text>
    <text x="475" y="495" fill="#173127" font-family="Arial, sans-serif" font-size="15" font-weight="700">REVIEW BEFORE PARCEL SUBMISSION</text>
  </g>
  <g>
    <rect x="798" y="208" width="330" height="270" rx="28" fill="#f7f4e9"/>
    <circle cx="852" cy="262" r="24" fill="#b7e33d"/>
    <text x="844" y="271" fill="#173127" font-family="Arial, sans-serif" font-size="25" font-weight="800">3</text>
    <text x="838" y="322" fill="#173127" font-family="Arial, sans-serif" font-size="25" font-weight="700">Shipping payment</text>
    <text x="838" y="365" fill="#536159" font-family="Arial, sans-serif" font-size="18">Choose an eligible route and</text>
    <text x="838" y="397" fill="#536159" font-family="Arial, sans-serif" font-size="18">confirm the current freight total.</text>
    <text x="838" y="445" fill="#173127" font-family="Arial, sans-serif" font-size="15" font-weight="700">THEN INTERNATIONAL DISPATCH</text>
  </g>
  <text x="72" y="580" fill="#c8d2cc" font-family="Arial, sans-serif" font-size="16">Original Pikobuyy diagram · Verify every amount in the current Pikobuy order and parcel pages.</text>
</svg>
