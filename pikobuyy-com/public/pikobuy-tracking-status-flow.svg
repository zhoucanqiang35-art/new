<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Pikobuy order and parcel tracking status flow</title>
  <desc id="desc">An original five-stage diagram distinguishing product orders, domestic seller delivery, warehouse check-in, parcel dispatch and international tracking.</desc>
  <rect width="1200" height="630" rx="36" fill="#f3f6eb"/>
  <text x="70" y="84" fill="#182218" font-family="Arial, sans-serif" font-size="40" font-weight="700">Pikobuy tracking: follow the handoffs</text>
  <text x="70" y="122" fill="#536153" font-family="Arial, sans-serif" font-size="19">An order number, domestic shipment and international tracking number are different records.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(55 210)"><rect width="190" height="210" rx="24" fill="#182218"/><text x="24" y="46" fill="#d7ef85" font-size="18" font-weight="700">01 · PRODUCT ORDER</text><text x="24" y="92" fill="#f5f8ee" font-size="23" font-weight="700">First payment</text><text x="24" y="128" fill="#ccd5c4" font-size="16">Track purchasing</text><text x="24" y="153" fill="#ccd5c4" font-size="16">and seller action.</text></g>
    <text x="266" y="320" fill="#87a45c" font-size="30">→</text>
    <g transform="translate(300 210)"><rect width="190" height="210" rx="24" fill="#3f5f36"/><text x="24" y="46" fill="#d7ef85" font-size="18" font-weight="700">02 · DOMESTIC LEG</text><text x="24" y="92" fill="#f5f8ee" font-size="23" font-weight="700">Seller ships</text><text x="24" y="128" fill="#e2e9dc" font-size="16">Follow the item to</text><text x="24" y="153" fill="#e2e9dc" font-size="16">the China warehouse.</text></g>
    <text x="511" y="320" fill="#87a45c" font-size="30">→</text>
    <g transform="translate(545 210)"><rect width="190" height="210" rx="24" fill="#6f884d"/><text x="24" y="46" fill="#182218" font-size="18" font-weight="700">03 · WAREHOUSE</text><text x="24" y="92" fill="#ffffff" font-size="23" font-weight="700">Check-in &amp; QC</text><text x="24" y="128" fill="#f5f8ee" font-size="16">Wait for the item</text><text x="24" y="153" fill="#f5f8ee" font-size="16">record and photos.</text></g>
    <text x="756" y="320" fill="#87a45c" font-size="30">→</text>
    <g transform="translate(790 210)"><rect width="160" height="210" rx="24" fill="#a9c36e"/><text x="20" y="46" fill="#182218" font-size="17" font-weight="700">04 · PARCEL</text><text x="20" y="92" fill="#182218" font-size="22" font-weight="700">Pay &amp; dispatch</text><text x="20" y="128" fill="#273126" font-size="16">The cross-border</text><text x="20" y="153" fill="#273126" font-size="16">stage starts here.</text></g>
    <text x="969" y="320" fill="#87a45c" font-size="30">→</text>
    <g transform="translate(1000 210)"><rect width="150" height="210" rx="24" fill="#d7ef85"/><text x="18" y="46" fill="#182218" font-size="16" font-weight="700">05 · TRACKING</text><text x="18" y="92" fill="#182218" font-size="21" font-weight="700">Within 3 days</text><text x="18" y="128" fill="#273126" font-size="15">Official guide:</text><text x="18" y="151" fill="#273126" font-size="15">after dispatch,</text><text x="18" y="174" fill="#273126" font-size="15">not after ordering.</text></g>
  </g>
  <rect x="70" y="500" width="1060" height="66" rx="16" fill="#182218"/>
  <text x="600" y="528" text-anchor="middle" fill="#f5f8ee" font-family="Arial, sans-serif" font-size="17">Tracking availability is not a delivery promise.</text>
  <text x="600" y="552" text-anchor="middle" fill="#bfcbb7" font-family="Arial, sans-serif" font-size="15">Save the identifier, latest event, timestamp, route and evidence for each stage.</text>
</svg>