  const guides=[
   [`qc`,`USFans QC photos, storage and shipping: a practical research checklist`,`A useful USFans agent guide starts before an order is placed. The official USFans homepage describes a simple public workflow: paste a product link to place an order, let the purchase move to the USFans warehouse, review QC and storage information, then select items from warehouse inventory for international shipment. That description is valuable because it separates the stages that many first-time shoppers wrongly blend together. Finding a product, buying it, receiving it at a warehouse, checking it and shipping it internationally are different decisions. A low product price does not settle the later questions about size, condition, storage, route availability or parcel cost.\n\nStart with the exact listing. Save the seller link, variant, color, size, quantity and the price that is visible at the moment you research. If the platform accepts a pasted product link, use the real link rather than a screenshot or a vague product name. A link gives you a fixed reference point when you later compare the seller description with the warehouse photos. It also helps you identify whether you are looking at the same version of the product after a seller changes an option, replaces images or adjusts a price. For a spreadsheet shopper, this is the first discipline: one item, one source, one set of visible details.\n\nThe next step is to identify what the public USFans page actually promises and what it does not. USFans says it can assist with purchases from Taobao, 1688 and Weidian and describes buying products from China online and offline. It also says that products arrive at its warehouse before the international shipping stage. Those statements describe a service flow, not a guarantee that every seller, variant or destination will behave the same way. A research-minded buyer therefore checks the current listing and the current order screen, rather than assuming that a general homepage statement settles a particular purchase. Keep the seller information, your chosen variant and any stated restrictions together in one note before proceeding.\n\nThis approach is less dramatic than chasing a quick deal, but it is usually more useful. The goal is not to predict every outcome from a single product photo. The goal is to reduce avoidable surprises by creating a record you can compare at every stage: original listing, order choice, warehouse information and final parcel selection.`,`The warehouse stage is where QC photos become useful. The current USFans homepage states that its QC and storage step includes 3–5 free QC photos and 90-day free storage. Treat those figures as a description of the public service at the time of writing, not as a substitute for the live order terms. The most practical use of QC photos is comparison. Put the original listing beside the QC images and review the details that are visible: color, obvious shape, quantity, major construction details, labels that can be read, and whether the selected option appears to match your order. If the item has a size label, compare it with the size option you chose; do not assume that a label alone proves fit.\n\nQC photos are evidence, not a warranty. They may not show every surface, measurement, material characteristic or hidden defect. Lighting, angle and image compression can also change how a color or texture appears. A sensible decision rule is to ask specific questions. Does the photo show the option I selected? Is there a visible difference from the listing that would matter to me? Is the quantity correct? Is there a clearly observable issue that should be addressed before the item is packed with other goods? This is a stronger process than asking whether QC is generally good or bad. A general opinion cannot replace the pictures and information attached to your own item.\n\nStorage has a similar role. USFans publicly advertises 90-day free storage, but storage is not a reason to delay every decision. Use the warehouse period to organize items deliberately. Review QC while the item is still separate, consider whether you want to combine it with other purchases, and read the current help information if you are considering a return, after-sales request or longer storage period. The official site lists help topics for Returns and Refunds, Goods Storage Period and Inspection Rules. Those categories are the appropriate place to check current conditions; an independent guide should not invent a universal return deadline or outcome. Seller policies, item condition and live service rules can all matter.\n\nWhen you are satisfied with the item information, plan the parcel rather than shipping each purchase automatically. The USFans homepage says shoppers can select items from warehouse inventory and consolidate them into one parcel. Consolidation can reduce repeated handling and may change the way a route is priced, but it does not make every combination suitable. Check the items together: fragile goods, restricted categories, unusual dimensions, batteries, liquids, branded goods and destination rules may affect which route is shown. The correct question is not Which line is always cheapest? It is Which routes are currently available for this exact parcel and destination?`,`International shipping is the point at which a product comparison becomes a parcel decision. USFans currently advertises 200+ shipping lines and coverage of 200+ countries and regions. That is useful reach information, but it is not a promise that every line is available to every address or that one route will be best for every item. Destination, parcel dimensions, item type and current logistics restrictions can change the choices that appear. Use the platform estimate and the live route information for your own parcel. Do not turn a guide price, an old community screenshot or another buyer's quote into a final landed-cost claim.\n\nBefore submitting a parcel, make a short final check. Confirm the destination country and address details, the items and quantity selected from the warehouse, the parcel estimate shown at that moment, any shipping restrictions, and any relevant customs or tax information provided for the route. USFans lists Logistics Fees, Shipping Restrictions, Customs and Taxation and Receipt Information in its public help navigation. Those topics are signals to read the current rules, not evidence that a third-party article can give universal legal or tax advice. Customs treatment is destination-specific and can change; a buyer should use the current official information and, where appropriate, advice from the relevant authority.\n\nThe best USFans spreadsheet workflow is therefore a sequence of small, testable decisions. First, research the real product link. Second, record the chosen option. Third, compare QC photos with the source listing after warehouse arrival. Fourth, use the storage period to decide whether the item belongs in a consolidated parcel. Fifth, compare the live shipping options for the actual destination and parcel. Finally, read the current service and route information before payment or parcel submission. This is not a promise that a particular order will be inexpensive, unrestricted or problem-free. It is a practical method for using the information the platform publicly describes without adding claims the platform does not make.\n\nFor search users, the useful keywords are USFans QC photos, USFans warehouse storage, USFans shipping estimate, USFans parcel consolidation and USFans shipping restrictions. Use them to locate the current order information, then verify every decision against the live product and route screens.`,`Research rule: public claims describe a workflow; your live product, warehouse and destination screens determine the decision.`],

   pl:{facts:[['Taobao · 1688 · Weidian','USFans wskazuje te chińskie platformy jako źródła zakupu.'],['3–5 bezpłatnych zdjęć QC','Publiczny opis QC i magazynu wskazuje 3–5 bezpłatnych zdjęć QC.'],['90 dni bezpłatnego magazynu','Publiczny opis wskazuje 90 dni; sprawdź aktualne warunki konta.'],['Ponad 200 linii','USFans reklamuje ponad 200 linii; zależą od produktu i kraju.'],['Ponad 200 krajów i regionów','Podano zasięg, ale nie ma weryfikowalnego rankingu użytkowników według państw.']],steps:[['Znajdź','Użyj kategorii lub wyszukiwarki, aby przygotować krótką listę.'],['Porównaj','Sprawdź szczegóły, rozmiar, zdjęcia i ograniczenia trasy.'],['Magazyn','Zobacz informacje o kontroli produktu.'],['Zdecyduj','Użyj aktualnej wyceny dla własnego kraju.'],['Odkrywaj','Dopiero potem kontynuuj w bazie.']],cats:['Buty','Bluzy / swetry','T-shirty','Kurtki','Spodnie / szorty','Nakrycia głowy','Akcesoria','Koszulki','Elektronika','Inne'],path:'Polska ścieżka researchu',guides:['Zdjęcia QC, magazyn i wysyłka','Waga rzeczywista i objętościowa','Kontrola magazynowa i zwroty','Kraj docelowy i cło'],article:'Zacznij od prawdziwego linku produktu, wariantu, rozmiaru i widocznej ceny. USFans opisuje zakup, przyjęcie do magazynu, informacje QC oraz wysyłkę międzynarodową. To proces usługi, a nie gwarancja dla każdego wariantu lub kraju.\n\nPorównaj zdjęcia QC z pierwotnym ogłoszeniem i przed wysyłką sprawdź na żywo kraj, wagę, dostępną linię i ograniczenia. Magazynowanie, koszty, podatki i limity zależą od produktu i adresu.',callout:'Zasada researchu: decyzję określają bieżące dane o produkcie, magazynie i kraju.',faq:['Czy to oficjalna strona USFans?|Nie. USFANSFINS to niezależny przewodnik researchowy.', 'Ile zdjęć QC jest wskazanych?|Publiczny opis USFans wskazuje 3–5 bezpłatnych zdjęć QC.', 'Jak długo trwa bezpłatne magazynowanie?|Opis wskazuje 90 dni; sprawdź bieżące warunki.', 'Czy można łączyć produkty w paczkę?|USFans opisuje konsolidację z magazynu; zależy ona od produktu i trasy.', 'Czy każda linia działa w każdym kraju?|Nie. Kraj, typ, wymiary i ograniczenia zmieniają opcje.', 'Co sprawdzić przed wysyłką?|Wycenę na żywo oraz aktualne informacje o opłatach, ograniczeniach i cle.', 'Dokąd prowadzą linki?|Wszystkie zewnętrzne linki odkrywania prowadzą tylko do findspreadsheet.com.']}

  Object.assign(localRows.de,{articleParts:[
   `Ein brauchbarer USFans-Leitfaden beginnt vor der Bestellung. Die öffentliche Beschreibung von USFans führt einen klaren Ablauf auf: Einen Produktlink einfügen, den Einkauf zum Lager gehen lassen, QC- und Lagerinformationen ansehen und ausgewählte Lagerartikel anschließend für den internationalen Versand zusammenstellen. Das ist vor allem deshalb hilfreich, weil es Entscheidungen trennt, die Einsteiger oft vermischen. Einen Artikel finden, ihn kaufen, ihn im Lager empfangen, ihn prüfen und ihn international versenden zu lassen sind verschiedene Schritte. Ein niedriger Artikelpreis beantwortet nicht automatisch Fragen zu Größe, Zustand, Lagerung, verfügbarer Route oder den Kosten des späteren Pakets.\n\nBeginnen Sie mit der exakten Anzeige. Notieren Sie Verkäuferlink, Variante, Farbe, Größe, Menge und den zum Zeitpunkt der Recherche sichtbaren Preis. Wenn ein Produktlink eingefügt werden kann, verwenden Sie den echten Link statt eines Screenshots oder eines unscharfen Namens. Der Link bleibt Ihr Bezugspunkt, wenn Sie die Verkäuferbeschreibung später mit Lagerfotos vergleichen. Er hilft auch festzustellen, ob es nach einer Preis-, Bild- oder Variantenänderung noch dieselbe Ausführung ist. Für eine Spreadsheet-Recherche gilt daher: ein Artikel, eine Quelle, ein Satz sichtbarer Angaben.\n\nPrüfen Sie anschließend, was die öffentliche Plattformseite tatsächlich zusagt und was nicht. USFans nennt Taobao, 1688 und Weidian als Einkaufsquellen und beschreibt, dass Artikel vor dem internationalen Versand im Lager eintreffen. Das beschreibt einen Serviceablauf, garantiert aber nicht dasselbe Ergebnis für jeden Verkäufer, jede Variante oder jedes Zielland. Halten Sie Verkäuferdaten, gewählte Variante und genannte Einschränkungen deshalb zusammen fest und prüfen Sie die aktuelle Angebots- und Bestellansicht.` ,
   `Im Lager werden QC-Fotos praktisch. Die USFans-Startseite nennt für den QC- und Lagerabschnitt 3–5 kostenlose QC-Fotos sowie 90 Tage kostenlose Lagerung. Diese Zahlen beschreiben den veröffentlichten Ablauf zum Zeitpunkt der Prüfung; sie ersetzen nicht die Bedingungen der eigenen Bestellung. Der sinnvolle Nutzen der QC-Fotos ist der Vergleich: Legen Sie die ursprüngliche Anzeige neben die Lagerbilder und prüfen Sie sichtbare Farbe, Form, Menge, wichtige Konstruktionsdetails, lesbare Labels und die gewählte Option. Ein Größenlabel allein beweist keine Passform, kann aber mit der bestellten Größe abgeglichen werden.\n\nQC-Bilder sind Belege, keine Gewährleistung. Sie zeigen möglicherweise nicht jede Oberfläche, Messung, Materialeigenschaft oder verdeckten Mangel. Licht, Perspektive und Bildkomprimierung können Farbe und Textur verändern. Stellen Sie daher konkrete Fragen: Zeigt das Foto die bestellte Option? Gibt es einen sichtbaren Unterschied zur Anzeige, der für mich wichtig ist? Ist die Menge richtig? Ist ein erkennbares Problem zu klären, bevor der Artikel mit anderen Waren gepackt wird? Das ist belastbarer als eine allgemeine Aussage darüber, ob QC gut oder schlecht sei.\n\nAuch Lagerzeit ist eine Entscheidungsphase. Nutzen Sie sie, um Artikel getrennt zu prüfen, eine mögliche Zusammenstellung zu planen und aktuelle Hilfeinformationen zu lesen, falls Rückgabe, After-Sales-Anfrage oder längere Lagerung relevant werden. Die öffentliche Hilfe nennt Themen zu Rückgaben, Lagerfrist und Prüfregeln. Ein unabhängiger Leitfaden sollte daraus keine pauschale Rückgabefrist oder ein Ergebnis ableiten: Verkäuferbedingungen, Zustand und die live sichtbaren Servicebedingungen können entscheidend sein.` ,
   `Beim internationalen Versand wird aus dem Produktvergleich eine Paketentscheidung. USFans bewirbt über 200 Versandlinien und Abdeckung von über 200 Ländern und Regionen. Das zeigt Reichweite, ist aber keine Zusage, dass jede Linie an jeder Adresse verfügbar oder für jeden Artikel geeignet ist. Ziel, Paketmaße, Artikeltyp und aktuelle Logistikbeschränkungen können die sichtbaren Optionen verändern. Verwenden Sie deshalb die Schätzung und Routeninformation für Ihr tatsächliches Paket; ein alter Screenshot, Richtpreis oder die Erfahrung eines anderen Käufers ist keine endgültige Aussage zu Ihren Gesamtkosten.\n\nVor dem Absenden hilft eine kurze Liste: Zielland und Adresse bestätigen, ausgewählte Lagerartikel und Menge kontrollieren, die im Moment angezeigte Paketschätzung ansehen, Versandbeschränkungen lesen und die für die Route genannten Zoll- oder Steuerhinweise prüfen. USFans verlinkt öffentliche Hilfethemen zu Logistikgebühren, Versandbeschränkungen, Zoll und Empfangsinformationen. Diese Hinweise sind ein Anlass, aktuelle Regeln zu lesen, keine Grundlage für eine universelle Rechts-, Steuer- oder Zollberatung. Die Behandlung kann je nach Ziel variieren und sich ändern.\n\nDer verlässlichste Ablauf besteht aus kleinen, überprüfbaren Schritten: echten Link recherchieren, Variante notieren, QC mit der Quelle vergleichen, Lagerzeit bewusst nutzen, Live-Versandoptionen für Paket und Ziel vergleichen und vor Zahlung oder Paketeinreichung die aktuellen Regeln lesen. Das verspricht weder eine günstige noch eine problemfreie Bestellung. Es hilft nur, die von der Plattform beschriebenen Informationen zu nutzen, ohne Behauptungen hinzuzufügen, die sie nicht macht.`]});
  Object.assign(localRows.fr,{articleParts:[
   `Un guide USFans utile commence avant toute commande. La présentation publique décrit un parcours simple : coller un lien produit, laisser l’achat arriver à l’entrepôt, consulter les informations QC et de stockage, puis sélectionner les articles pour l’expédition internationale. Cette distinction est importante, car trouver un article, l’acheter, le recevoir en entrepôt, le contrôler et l’expédier sont des décisions différentes. Un prix produit faible ne répond pas à lui seul aux questions de taille, d’état, de stockage, de route disponible ou de coût du colis.\n\nCommencez par l’annonce exacte. Conservez le lien vendeur, la variante, la couleur, la taille, la quantité et le prix visible lors de la recherche. Quand la plateforme accepte un lien, utilisez ce lien réel plutôt qu’une capture ou un nom vague. Il devient le point de comparaison lorsque vous rapprochez la description du vendeur des photos d’entrepôt. Il permet aussi de vérifier si vous regardez encore la même version après un changement de prix, d’images ou d’options. La discipline de base est simple : un article, une source, un ensemble de détails visibles.\n\nIl faut ensuite distinguer les promesses publiques des garanties inexistantes. USFans indique pouvoir assister les achats depuis Taobao, 1688 et Weidian et explique que les produits arrivent à l’entrepôt avant l’expédition internationale. Cela décrit un flux de service, non un résultat identique pour chaque vendeur, variante ou destination. Gardez donc ensemble les informations vendeur, votre option choisie et les restrictions signalées, puis vérifiez l’annonce et l’écran de commande actuels.` ,
   `L’étape entrepôt donne son sens aux photos QC. La page d’accueil USFans indique 3 à 5 photos QC gratuites et 90 jours de stockage gratuit dans son résumé public. Ces chiffres décrivent le service publié au moment de la vérification ; ils ne remplacent pas les conditions de votre commande. Utilisez les photos pour comparer : placez l’annonce d’origine à côté des images QC et contrôlez ce qui est visible, notamment la couleur, la forme générale, la quantité, les détails importants, les étiquettes lisibles et la correspondance avec l’option choisie. Une étiquette de taille ne prouve pas l’ajustement, mais elle peut être rapprochée de la taille commandée.\n\nLes photos QC sont des éléments de preuve, pas une garantie. Elles ne montrent pas nécessairement toutes les surfaces, mesures, caractéristiques de matière ou défauts cachés. L’éclairage, l’angle et la compression peuvent modifier l’aspect d’une couleur ou d’une texture. Posez des questions précises : est-ce bien l’option sélectionnée ? Une différence visible avec l’annonce compte-t-elle pour moi ? La quantité est-elle correcte ? Un problème observable doit-il être traité avant le regroupement ? Cette méthode est plus solide qu’un avis général sur la qualité du QC.\n\nLe stockage est également un temps de décision. Servez-vous-en pour examiner les articles séparément, décider d’une consolidation et lire les informations à jour si un retour, une demande après-vente ou une prolongation est envisagé. L’aide publique répertorie les retours, la période de stockage et les règles d’inspection. Ces rubriques doivent être consultées en direct : conditions du vendeur, état du produit et règles de service peuvent modifier ce qui est possible.` ,
   `L’expédition internationale transforme une comparaison produit en décision de colis. USFans annonce plus de 200 lignes et une couverture de plus de 200 pays et régions. Cette portée n’est pas la promesse que chaque ligne conviendra à chaque adresse ou article. Destination, dimensions, type de bien et restrictions logistiques en cours peuvent changer les options affichées. Utilisez l’estimation de la plateforme et les informations de route pour votre colis réel ; un ancien prix indicatif, une capture communautaire ou le devis d’un autre acheteur ne constitue pas un coût final.\n\nAvant de soumettre un colis, vérifiez le pays et l’adresse, les articles et quantités choisis à l’entrepôt, l’estimation affichée à cet instant, les restrictions et les informations douanières ou fiscales indiquées pour la route. USFans publie des rubriques sur les frais logistiques, restrictions, douane et informations de réception. Elles invitent à lire les règles actuelles, pas à appliquer un conseil légal, fiscal ou douanier universel. Le traitement peut varier et évoluer selon la destination.\n\nLe meilleur parcours est une série de décisions testables : rechercher le vrai lien, noter l’option, comparer QC et source, utiliser le stockage avec intention, comparer les options disponibles pour le colis et le pays, puis lire les règles actuelles avant paiement ou soumission. Cette méthode ne promet ni économie, ni disponibilité, ni résultat sans problème. Elle permet simplement d’utiliser les informations que la plateforme décrit publiquement sans inventer ce qu’elle ne garantit pas.`]});
  Object.assign(localRows.es,{articleParts:[
   `Una guía útil de USFans empieza antes de hacer un pedido. La explicación pública describe un proceso: pegar el enlace del producto, permitir que la compra llegue al almacén, revisar la información de QC y almacenamiento y, después, seleccionar artículos para el envío internacional. Es importante separar estas decisiones. Encontrar un artículo, comprarlo, recibirlo en almacén, revisarlo y enviarlo internacionalmente no son el mismo paso. Un precio de producto bajo no resuelve por sí solo las dudas sobre talla, estado, almacenamiento, ruta disponible o coste del paquete.\n\nTrabaja con el anuncio exacto. Guarda el enlace del vendedor, variante, color, talla, cantidad y precio visible al investigar. Si se acepta un enlace, usa el enlace real y no una captura o un nombre impreciso. Será tu referencia cuando compares la descripción del vendedor con las fotos de almacén y cuando compruebes si una opción, imagen o precio cambió. Para investigar bien: un artículo, una fuente y un conjunto de detalles visibles.\n\nTambién hay que diferenciar lo que la página pública describe de lo que no garantiza. USFans menciona Taobao, 1688 y Weidian y explica que los productos llegan al almacén antes de la fase internacional. Eso es un flujo de servicio, no una promesa para cada vendedor, variante o país. Conserva juntos los datos del vendedor, tu opción y las restricciones indicadas, y revisa siempre la pantalla actual de anuncio y pedido.` ,
   `Las fotos QC son más útiles en la etapa de almacén. La página de inicio de USFans indica de 3 a 5 fotos QC gratuitas y 90 días de almacenamiento gratuito en su resumen público. Son datos del servicio publicado, no sustituyen las condiciones en vivo de tu pedido. Compáralas con el anuncio original: color, forma visible, cantidad, detalles de construcción, etiquetas legibles y coincidencia con la opción elegida. Una etiqueta de talla no garantiza ajuste, pero ayuda a comprobar la opción pedida.\n\nLas imágenes QC son evidencia, no garantía. Puede que no muestren todas las superficies, medidas, propiedades de material o defectos ocultos; iluminación, ángulo y compresión pueden cambiar el aspecto. Haz preguntas concretas: ¿se ve la opción elegida?, ¿hay una diferencia visible que importa?, ¿la cantidad es correcta?, ¿hay un problema que revisar antes de agrupar? Esto es más útil que una opinión general sobre QC.\n\nEl almacenamiento también es tiempo de decisión. Úsalo para revisar artículos por separado, planear una consolidación y leer ayuda actual si consideras devolución, posventa o más tiempo de almacén. La ayuda pública enumera devoluciones, periodo de almacenamiento y reglas de inspección. No conviertas esos títulos en una promesa universal: condiciones del vendedor, estado y reglas actuales pueden cambiar el resultado.` ,
   `El envío internacional convierte la comparación del producto en una decisión de paquete. USFans anuncia más de 200 líneas de envío y cobertura en más de 200 países y regiones. Eso describe alcance, no que toda línea esté disponible para toda dirección ni que sea adecuada para todo artículo. Destino, dimensiones, tipo de producto y restricciones logísticas actuales cambian las opciones. Usa la estimación y la información de ruta para tu paquete real; una captura antigua, un precio orientativo o la cotización de otra persona no es un coste final.\n\nAntes de enviar, confirma país y dirección, artículos y cantidad de almacén, estimación mostrada en ese momento, restricciones y avisos de aduana o impuestos de la ruta. USFans incluye temas públicos sobre tarifas logísticas, restricciones, aduanas e información de recepción. Sirven para revisar reglas actuales, no para dar asesoramiento legal, fiscal o aduanero universal.\n\nEl mejor proceso son decisiones verificables: investigar el enlace real, anotar la opción, comparar QC con la fuente, usar el almacenamiento deliberadamente, contrastar rutas disponibles para el paquete y el destino, y leer reglas actuales antes de pagar o enviar. No promete bajo coste ni resultado sin problemas; ayuda a usar datos publicados sin añadir afirmaciones que la plataforma no hace.`]});
  Object.assign(localRows.it,{articleParts:[
   `Una guida USFans utile comincia prima dell’ordine. La descrizione pubblica presenta un flusso: incollare un link prodotto, far arrivare l’acquisto al magazzino, esaminare informazioni QC e deposito e poi selezionare gli articoli per la spedizione internazionale. Sono decisioni diverse: trovare, comprare, ricevere in magazzino, controllare e spedire un articolo non sono lo stesso passo. Un prezzo basso non risponde da solo a dubbi su taglia, condizione, deposito, linea disponibile o costo del pacco.\n\nParti dall’inserzione esatta. Conserva link del venditore, variante, colore, taglia, quantità e prezzo visibile durante la ricerca. Se il servizio accetta un link, usa quello reale e non uno screenshot o un nome generico. Sarà il riferimento per confrontare la descrizione del venditore con le foto del magazzino e per capire se immagini, prezzo o opzioni sono cambiati. La regola è semplice: un articolo, una fonte, un insieme di dettagli visibili.\n\nOccorre distinguere ciò che la pagina pubblica descrive da ciò che non garantisce. USFans cita Taobao, 1688 e Weidian e descrive l’arrivo in magazzino prima della spedizione internazionale. È un flusso di servizio, non una garanzia per ogni venditore, variante o destinazione. Tieni quindi insieme i dati del venditore, l’opzione scelta e le limitazioni indicate e controlla la schermata aggiornata di prodotto e ordine.` ,
   `Le foto QC diventano pratiche nella fase di magazzino. La homepage USFans indica 3–5 foto QC gratuite e 90 giorni di deposito gratuito nel riepilogo pubblico. Sono dati del servizio pubblicato e non sostituiscono le condizioni in tempo reale del tuo ordine. Confronta l’inserzione originale con le immagini QC: colore, forma visibile, quantità, dettagli importanti, etichette leggibili e corrispondenza con l’opzione scelta. Un’etichetta di taglia non dimostra la vestibilità, ma può confermare l’opzione ordinata.\n\nLe immagini QC sono prove, non una garanzia. Potrebbero non mostrare ogni superficie, misura, caratteristica del materiale o difetto nascosto; luce, angolo e compressione cambiano l’aspetto. Fai domande specifiche: si vede l’opzione ordinata? c’è una differenza visibile che conta? la quantità è corretta? un problema osservabile va risolto prima di consolidare? Questo è più utile di un giudizio generale sul QC.\n\nAnche il deposito è una fase decisionale. Usalo per controllare gli articoli separatamente, valutare una consolidazione e leggere l’aiuto aggiornato in caso di reso, assistenza post-vendita o deposito prolungato. I temi pubblici includono resi, periodo di deposito e regole di ispezione; non vanno trasformati in una promessa universale perché condizioni del venditore, stato e regole correnti possono variare.` ,
   `La spedizione internazionale trasforma il confronto prodotto in una decisione sul pacco. USFans pubblicizza oltre 200 linee e copertura di oltre 200 paesi e regioni. Indica ampiezza del servizio, non che ogni linea sia disponibile per ogni indirizzo o adatta a ogni articolo. Destinazione, dimensioni, tipo di merce e limitazioni logistiche correnti possono cambiare le opzioni. Usa quindi la stima e le informazioni di linea del tuo pacco reale: un vecchio screenshot, un prezzo indicativo o l’esperienza altrui non è un costo finale.\n\nPrima dell’invio, conferma paese e indirizzo, articoli e quantità selezionati in magazzino, stima mostrata in quel momento, restrizioni e informazioni doganali o fiscali indicate dalla linea. USFans elenca argomenti pubblici su costi logistici, limitazioni, dogana e ricezione. Sono un invito a leggere le regole attuali, non una consulenza universale legale, fiscale o doganale.\n\nIl percorso migliore è una sequenza verificabile: cerca il link reale, annota l’opzione, confronta QC e fonte, usa il deposito con intenzione, confronta le opzioni live per pacco e destinazione e leggi le regole prima del pagamento o dell’invio. Non promette risparmio, disponibilità o esito privo di problemi; evita soltanto di aggiungere affermazioni non fatte dalla piattaforma.`]});
  Object.assign(localRows.pt,{articleParts:[
   `Um guia útil da USFans começa antes do pedido. A explicação pública descreve um processo: colar o link do produto, deixar a compra chegar ao armazém, rever informações de QC e armazenamento e depois selecionar artigos para envio internacional. Encontrar, comprar, receber no armazém, verificar e enviar são decisões diferentes. Um preço baixo do artigo não responde sozinho a questões sobre tamanho, estado, armazenamento, rota disponível ou custo final do pacote.\n\nComece pelo anúncio exato. Guarde o link do vendedor, variante, cor, tamanho, quantidade e preço visível durante a pesquisa. Quando a plataforma aceita um link, use o link real, não uma captura ou nome vago. Ele será a referência para comparar a descrição do vendedor com fotos do armazém e para perceber se preço, imagens ou opções foram alterados. A disciplina básica é: um artigo, uma fonte e um conjunto de detalhes visíveis.\n\nÉ importante separar a descrição pública de uma garantia. A USFans menciona Taobao, 1688 e Weidian e explica que os artigos chegam ao armazém antes do envio internacional. Isto descreve um fluxo de serviço, não o mesmo resultado para cada vendedor, variante ou destino. Mantenha os dados do vendedor, a opção escolhida e as restrições juntos e consulte o anúncio e o ecrã de pedido atual.` ,
   `As fotos QC tornam-se úteis no armazém. A página inicial da USFans indica 3–5 fotos QC gratuitas e 90 dias de armazenamento gratuito no resumo público. Estes números descrevem o serviço publicado; não substituem as condições em tempo real do seu pedido. Compare as fotos com o anúncio original: cor, forma visível, quantidade, detalhes de construção, etiquetas legíveis e correspondência com a opção escolhida. Uma etiqueta de tamanho não prova que serve, mas pode confirmar a opção encomendada.\n\nFotos QC são prova, não garantia. Podem não mostrar todas as superfícies, medidas, características do material ou defeitos ocultos. Luz, ângulo e compressão podem alterar cor e textura. Faça perguntas concretas: a foto mostra a opção selecionada? existe diferença visível importante? a quantidade está correta? há um problema observável antes de consolidar? Isso é mais útil do que uma opinião geral sobre QC.\n\nO armazenamento também é tempo para decidir. Utilize-o para rever artigos separadamente, planear consolidação e ler ajuda atual se pensar em devolução, pós-venda ou extensão. A ajuda pública inclui devoluções, período de armazenamento e regras de inspeção. Não transforme esses tópicos numa promessa universal: regras do vendedor, condição e serviço atual podem mudar o que é possível.` ,
   `O envio internacional transforma a comparação do produto numa decisão de pacote. A USFans anuncia mais de 200 linhas de envio e cobertura em mais de 200 países e regiões. Isto indica alcance, não que cada linha esteja disponível para cada endereço ou seja adequada a cada artigo. Destino, dimensões, tipo de item e restrições logísticas atuais podem alterar as opções. Use a estimativa e a rota disponíveis para o seu pacote real; uma captura antiga, preço de referência ou experiência de outra pessoa não é um custo final.\n\nAntes de submeter o pacote, confirme país e endereço, artigos e quantidades do armazém, estimativa mostrada no momento, restrições e avisos de impostos ou alfândega da rota. A USFans lista temas públicos sobre taxas logísticas, restrições, alfândega e receção. Eles servem para consultar regras atuais e não para dar conselho jurídico, fiscal ou aduaneiro universal.\n\nO melhor método é verificável: pesquise o link real, registe a opção, compare QC e fonte, use o armazenamento com intenção, compare opções ao vivo para pacote e destino e leia regras atuais antes de pagar ou enviar. Não promete preço baixo ou resultado sem problemas; apenas usa informações públicas sem inventar garantias.`]});
  Object.assign(localRows.nl,{articleParts:[
   `Een bruikbare USFans-gids begint vóór een bestelling. De openbare uitleg beschrijft een volgorde: een productlink plakken, de aankoop naar het magazijn laten gaan, QC- en opslaginformatie bekijken en daarna artikelen kiezen voor internationale verzending. Vinden, kopen, in het magazijn ontvangen, controleren en verzenden zijn verschillende beslissingen. Een lage artikelprijs beantwoordt niet vanzelf vragen over maat, staat, opslag, beschikbare route of uiteindelijke pakketkosten.\n\nBegin met de exacte aanbieding. Bewaar verkoperslink, variant, kleur, maat, aantal en de zichtbare prijs op het moment van onderzoek. Wanneer een link kan worden geplakt, gebruik dan de echte link en geen screenshot of vage productnaam. Die link blijft het referentiepunt bij de vergelijking tussen verkopersbeschrijving en magazijnfoto’s en wanneer prijs, afbeeldingen of opties veranderen. De basisdiscipline is: één artikel, één bron en één set zichtbare gegevens.\n\nMaak onderscheid tussen een openbare procesbeschrijving en een garantie. USFans noemt Taobao, 1688 en Weidian en beschrijft aankomst in het magazijn vóór de internationale fase. Dat is een dienstproces, geen belofte voor elke verkoper, variant of bestemming. Bewaar verkopersgegevens, gekozen optie en vermelde beperkingen samen en controleer de actuele aanbieding en het bestelscherm.` ,
   `QC-foto’s zijn vooral nuttig in de magazijnfase. De USFans-homepage noemt 3–5 gratis QC-foto’s en 90 dagen gratis opslag in de openbare samenvatting. Die cijfers beschrijven de gepubliceerde service en vervangen niet de live voorwaarden van de eigen bestelling. Vergelijk de oorspronkelijke aanbieding met de QC-beelden: zichtbare kleur, vorm, aantal, belangrijke details, leesbare labels en overeenkomst met de gekozen optie. Een maatlabel bewijst geen pasvorm, maar kan wel met de bestelde optie worden vergeleken.\n\nQC-beelden zijn bewijs, geen garantie. Niet elk oppervlak, elke maat, materiaaleigenschap of verborgen gebrek is zichtbaar; licht, hoek en compressie kunnen kleur en textuur beïnvloeden. Stel concrete vragen: zie ik de gekozen optie? is er een zichtbaar verschil dat ertoe doet? klopt het aantal? moet een zichtbaar probleem vóór consolidatie worden bekeken? Dat werkt beter dan een algemeen oordeel over QC.\n\nOpslag is ook een beslismoment. Gebruik die periode om artikelen apart te beoordelen, consolidatie te plannen en actuele hulp te lezen als retour, aftersales of langere opslag relevant wordt. De openbare hulp noemt retouren, opslagperiode en inspectieregels. Daaruit mag geen universele retourbelofte worden afgeleid: verkopersvoorwaarden, staat van het item en actuele regels kunnen bepalen wat haalbaar is.` ,
   `Internationale verzending maakt van productvergelijking een pakketbeslissing. USFans adverteert meer dan 200 verzendlijnen en dekking in meer dan 200 landen en regio’s. Dat toont bereik, maar niet dat elke lijn voor elk adres of item beschikbaar of geschikt is. Bestemming, pakketafmetingen, type artikel en actuele logistieke beperkingen kunnen de opties veranderen. Gebruik de schatting en route-informatie voor het werkelijke pakket; een oude screenshot, richtprijs of ervaring van een andere koper is geen eindbedrag.\n\nControleer vóór verzending land en adres, geselecteerde magazijnartikelen en aantallen, de op dat moment getoonde schatting, beperkingen en eventuele douane- of belastinginformatie van de route. USFans heeft openbare onderwerpen over logistieke kosten, beperkingen, douane en ontvangstinformatie. Ze zijn een reden om actuele regels te lezen, niet om universeel juridisch, fiscaal of douaneadvies te geven.\n\nDe beste aanpak bestaat uit controleerbare stappen: echte link onderzoeken, optie noteren, QC met de bron vergelijken, opslag bewust gebruiken, live opties voor pakket en bestemming vergelijken en regels lezen vóór betaling of indiening. Dit belooft geen lage kosten of probleemloos resultaat; het voorkomt alleen dat publieke informatie wordt aangevuld met onbewezen garanties.`]});
  Object.assign(localRows.pl,{articleParts:[
   `Dobry przewodnik po USFans zaczyna się przed złożeniem zamówienia. Publiczny opis przedstawia kolejność: wklejenie linku produktu, dotarcie zakupu do magazynu, sprawdzenie informacji QC i przechowywania, a następnie wybór pozycji do wysyłki międzynarodowej. Znalezienie produktu, zakup, przyjęcie do magazynu, kontrola i wysyłka to różne decyzje. Niska cena samego produktu nie odpowiada automatycznie na pytania o rozmiar, stan, magazynowanie, dostępną linię lub koszt późniejszej paczki.\n\nZacznij od dokładnego ogłoszenia. Zapisz link sprzedawcy, wariant, kolor, rozmiar, ilość i cenę widoczną w chwili researchu. Jeśli platforma przyjmuje link, użyj prawdziwego linku zamiast zrzutu ekranu lub ogólnej nazwy. Będzie on punktem odniesienia, gdy porównasz opis sprzedawcy ze zdjęciami z magazynu albo sprawdzisz, czy zmieniły się zdjęcia, opcje lub cena. Podstawowa zasada brzmi: jeden produkt, jedno źródło i jeden zestaw widocznych danych.\n\nTrzeba odróżnić opis publicznego procesu od gwarancji. USFans wymienia Taobao, 1688 i Weidian oraz opisuje przyjęcie produktów do magazynu przed etapem międzynarodowym. To opis usługi, a nie obietnica identycznego wyniku dla każdego sprzedawcy, wariantu lub kraju. Zapisz razem dane sprzedawcy, wybraną opcję i wskazane ograniczenia, a potem sprawdź aktualne ogłoszenie oraz ekran zamówienia.` ,
   `Zdjęcia QC są najbardziej użyteczne na etapie magazynu. Strona główna USFans podaje w publicznym podsumowaniu 3–5 bezpłatnych zdjęć QC oraz 90 dni bezpłatnego magazynowania. Są to informacje o opublikowanej usłudze, a nie zamiennik warunków widocznych przy własnym zamówieniu. Porównaj ogłoszenie źródłowe ze zdjęciami QC: kolor, widoczny kształt, ilość, ważne detale wykonania, czytelne etykiety i zgodność z wybraną opcją. Metka rozmiaru nie udowadnia dopasowania, lecz może potwierdzić zamówiony wariant.\n\nZdjęcia QC są dowodem, nie gwarancją. Mogą nie pokazać każdej powierzchni, miary, właściwości materiału czy ukrytej wady; światło, kąt i kompresja zmieniają wygląd koloru lub tekstury. Zadawaj konkretne pytania: czy widzę wybraną opcję? czy istnieje widoczna różnica, która ma znaczenie? czy ilość jest poprawna? czy widoczny problem wymaga wyjaśnienia przed łączeniem produktów? To lepsze niż ogólna opinia o QC.\n\nMagazynowanie także jest etapem decyzji. Użyj tego czasu, aby osobno ocenić produkty, zaplanować konsolidację i przeczytać aktualną pomoc, gdy rozważasz zwrot, obsługę posprzedażową lub dłuższe przechowywanie. Publiczna pomoc wymienia zwroty, okres magazynowania i zasady kontroli. Nie należy z tego wyprowadzać uniwersalnej obietnicy: warunki sprzedawcy, stan artykułu i aktualne reguły mogą zmienić możliwości.` ,
   `Wysyłka międzynarodowa zmienia porównanie produktu w decyzję o paczce. USFans reklamuje ponad 200 linii wysyłkowych i zasięg ponad 200 krajów oraz regionów. To informacja o zasięgu, nie obietnica, że każda linia będzie dostępna dla każdego adresu lub odpowiednia dla każdego produktu. Kraj docelowy, wymiary paczki, typ produktu i aktualne ograniczenia logistyczne mogą zmienić widoczne opcje. Korzystaj z wyceny i informacji o trasie dla rzeczywistej paczki; stary zrzut, cena orientacyjna lub doświadczenie innego kupującego nie stanowi końcowego kosztu.\n\nPrzed zgłoszeniem paczki potwierdź kraj i adres, produkty oraz ilości wybrane w magazynie, wycenę pokazywaną w danej chwili, ograniczenia i informacje podatkowe lub celne wskazane przy trasie. USFans publikuje tematy dotyczące opłat logistycznych, ograniczeń, ceł i informacji o odbiorze. Są one wskazówką, by czytać bieżące zasady, a nie podstawą uniwersalnej porady prawnej, podatkowej lub celnej.\n\nNajlepszy proces to seria sprawdzalnych kroków: zbadaj prawdziwy link, zapisz wariant, porównaj QC ze źródłem, świadomie użyj czasu magazynowego, porównaj dostępne na żywo opcje dla paczki i kraju, a przed płatnością lub zgłoszeniem przeczytaj aktualne reguły. Nie obiecuje to niskiego kosztu ani bezproblemowego wyniku; pomaga korzystać z publicznych informacji bez dodawania twierdzeń, których platforma nie składa.`]});
  Object.assign(localRows.de,{articleAddendum:`Dokumentieren Sie die Entscheidung auch nach dem Vergleich. Eine kurze Notiz mit Link, gewählter Variante, sichtbarer Größe, QC-Beobachtung und dem Datum der Routenprüfung macht spätere Änderungen nachvollziehbar. Prüfen Sie bei der Paketauswahl die aktuelle Gewicht- oder Volumenangabe, doch behandeln Sie eine Anzeige nicht als unveränderlichen Endwert: Verpackung, Kombination der Artikel und die für die Adresse sichtbare Linie können die Berechnung beeinflussen. Wählen Sie nicht nach einem allgemeinen Ruf als „günstigste“ oder „schnellste“ Linie, sondern nach den live dargestellten Optionen und Einschränkungen für genau dieses Paket.\n\nFür die Recherche sind Begriffe wie USFans QC-Fotos, Lagerung, Paketkonsolidierung, Versandbeschränkungen und Versandkosten-Schätzung nützlich. Sie helfen beim Auffinden aktueller Bildschirme und Hilfeseiten, ersetzen aber keinen Blick auf die Bestellung selbst. Wenn eine Angabe nicht im aktuellen Produkt-, Lager- oder Routenbildschirm steht, behandeln Sie sie als offene Frage statt als versprochene Leistung. So bleibt die Recherche nachvollziehbar, ohne aus einer allgemeinen Plattformbeschreibung eine feste Gebühren-, Zeit- oder Zollaussage zu machen.`});
  Object.assign(localRows.fr,{articleAddendum:`Conservez également une trace de chaque décision. Une note brève avec le lien, la variante choisie, la taille visible, l’observation QC et la date de vérification de la route permet de comprendre un changement ultérieur. Au moment de préparer le colis, consultez le poids ou le volume affiché, mais ne le traitez pas comme une valeur immuable : emballage, regroupement et ligne visible pour l’adresse peuvent modifier le calcul. Ne choisissez pas une ligne parce qu’elle est réputée « la moins chère » ou « la plus rapide » en général ; choisissez parmi les options et restrictions affichées pour ce colis précis.\n\nLes recherches USFans QC photos, stockage entrepôt, consolidation colis, restrictions d’expédition et estimation de frais permettent de retrouver les écrans et rubriques actuels. Elles ne remplacent toutefois pas la lecture de la commande réelle. Si une information n’apparaît pas sur l’écran actuel du produit, de l’entrepôt ou de la route, traitez-la comme une question ouverte et non comme une promesse. Cette méthode garde la recherche vérifiable sans transformer une description générale en tarif, délai ou résultat douanier fixe.`});
  Object.assign(localRows.es,{articleAddendum:`Documenta también cada decisión. Una nota breve con enlace, variante elegida, talla visible, observación de QC y fecha de revisión de ruta permite entender cambios posteriores. Al preparar el paquete, consulta el peso o volumen mostrado, pero no lo trates como una cifra inmutable: embalaje, combinación de artículos y línea disponible para la dirección pueden modificar el cálculo. No elijas una ruta por una reputación general de ser «la más barata» o «la más rápida»; elige entre las opciones y restricciones que aparecen para ese paquete concreto.\n\nBuscar USFans QC photos, almacenamiento de almacén, consolidación, restricciones de envío y estimación de tarifas ayuda a localizar pantallas y ayuda actuales. No sustituye la revisión del pedido real. Si un dato no aparece en la pantalla actual de producto, almacén o ruta, trátalo como una pregunta abierta y no como una promesa. Así la investigación sigue siendo verificable sin convertir una descripción general de plataforma en tarifa fija, plazo o resultado de aduana.`});
  Object.assign(localRows.it,{articleAddendum:`Registra anche ogni decisione. Una nota con link, variante scelta, taglia visibile, osservazione QC e data di controllo della linea rende comprensibili eventuali cambiamenti. Quando prepari il pacco, guarda peso o volume visualizzato, ma non trattarlo come dato immutabile: imballaggio, combinazione degli articoli e linea disponibile per l’indirizzo possono modificare il calcolo. Non scegliere una linea perché è ritenuta in generale «la più economica» o «la più veloce»; scegli fra opzioni e limiti mostrati per quel pacco preciso.\n\nRicerche come USFans QC photos, deposito, consolidamento pacco, restrizioni di spedizione e stima costi aiutano a trovare schermate e pagine aggiornate, ma non sostituiscono il controllo dell’ordine reale. Se un’informazione non appare nella schermata corrente di prodotto, magazzino o rotta, considerala una domanda aperta e non una promessa. In questo modo la ricerca resta verificabile senza trasformare una descrizione generale in tariffa, tempo o esito doganale fisso.`});
  Object.assign(localRows.pt,{articleAddendum:`Registe também cada decisão. Uma nota com link, variante escolhida, tamanho visível, observação QC e data de verificação da rota torna mudanças posteriores compreensíveis. Ao preparar o pacote, consulte o peso ou volume mostrado, mas não o trate como valor imutável: embalagem, combinação de artigos e linha disponível para o endereço podem alterar o cálculo. Não escolha uma linha por fama geral de ser «a mais barata» ou «a mais rápida»; escolha entre as opções e limitações mostradas para esse pacote concreto.\n\nPesquisas como USFans QC photos, armazenamento, consolidação de pacote, restrições de envio e estimativa de custos ajudam a localizar ecrãs e páginas atuais. Não substituem a análise da encomenda real. Se uma informação não aparece no ecrã atual do produto, armazém ou rota, trate-a como questão em aberto e não como promessa. Assim a pesquisa mantém-se verificável sem transformar uma descrição geral em taxa, prazo ou resultado aduaneiro fixo.`});
  Object.assign(localRows.nl,{articleAddendum:`Leg ook elke beslissing vast. Een korte notitie met link, gekozen variant, zichtbare maat, QC-waarneming en datum van routecontrole maakt latere veranderingen begrijpelijk. Bekijk bij het voorbereiden van een pakket het getoonde gewicht of volume, maar behandel dit niet als onveranderlijk: verpakking, combinatie van artikelen en de voor het adres zichtbare lijn kunnen de berekening beïnvloeden. Kies geen lijn vanwege een algemene reputatie als «goedkoopste» of «snelste», maar uit de opties en beperkingen die voor dit concrete pakket worden getoond.\n\nZoekopdrachten zoals USFans QC photos, magazijnopslag, pakketconsolidatie, verzendbeperkingen en kostenraming helpen actuele schermen en hulppagina’s te vinden. Ze vervangen niet de controle van de werkelijke bestelling. Staat een gegeven niet op het actuele product-, magazijn- of routescherm, behandel het dan als open vraag en niet als belofte. Zo blijft het onderzoek controleerbaar zonder dat een algemene beschrijving wordt omgezet in een vast tarief, tijdvak of douaneresultaat.`});
  Object.assign(localRows.pl,{articleAddendum:`Zapisuj także każdą decyzję. Krótka notatka z linkiem, wybranym wariantem, widocznym rozmiarem, obserwacją QC i datą sprawdzenia trasy ułatwia zrozumienie późniejszych zmian. Przy przygotowaniu paczki sprawdź pokazaną wagę lub objętość, ale nie traktuj jej jako niezmiennej: opakowanie, połączenie produktów i linia dostępna dla adresu mogą zmienić wyliczenie. Nie wybieraj linii przez ogólną opinię, że jest «najtańsza» lub «najszybsza»; wybieraj spośród opcji i ograniczeń pokazanych dla tej konkretnej paczki.\n\nWyszukiwania takie jak USFans QC photos, magazynowanie, konsolidacja paczki, ograniczenia wysyłki i szacowanie opłat pomagają znaleźć aktualne ekrany i strony pomocy. Nie zastępują jednak kontroli rzeczywistego zamówienia. Jeśli dana informacja nie występuje na aktualnym ekranie produktu, magazynu lub trasy, traktuj ją jako otwarte pytanie, a nie obietnicę. Dzięki temu research pozostaje sprawdzalny bez zmieniania ogólnego opisu w stałą opłatę, czas dostawy lub wynik celny.`});
  let lang='en',article=0;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
  function tr(k){return T[lang][k]||T.en[k]||k}
  function enforceOutboundPolicy(){
   $$('a[href]').forEach(a=>{const u=new URL(a.getAttribute('href'),location.href);if(u.origin!==location.origin&&u.origin!==site){a.removeAttribute('href');a.setAttribute('aria-disabled','true')}})
  }

   $$('[data-t]').forEach(e=>e.textContent=tr(e.dataset.t));$$('.nav button').forEach((b,i)=>b.textContent=tr('nav')[i]);
   $('#langToggle').textContent='Language · '+lang.toUpperCase();$('#searchInput').placeholder=lang==='en'?'Search the database':'FindsSpreadsheet';
   const factRows=local?local.facts.map((f,i)=>['0'+(i+1),f[0],f[1]]):facts;$('#facts').innerHTML=factRows.map(f=>'<div class="fact"><div class="num">'+f[0]+'</div><b>'+f[1]+'</b><p>'+f[2]+'</p></div>').join('');
   const stepRows=local?local.steps.map((s,i)=>['0'+(i+1),s[0],s[1]]):steps;const stepHTML=stepRows.map(s=>'<div class="step"><div class="number">'+s[0]+'</div><h3>'+s[1]+'</h3><p>'+s[2]+'</p></div>').join('');$('#steps').innerHTML=stepHTML;$('#workflowSteps').innerHTML=stepHTML;
   $('#productDeck').innerHTML=products.map(p=>'<article class="flip-card"><div class="flip-inner"><div class="flip-face flip-front"><img src="'+p[3]+'" alt="'+p[1]+'"><span class="flip-cat">'+p[0]+'</span><button class="flip-toggle" type="button" aria-expanded="false">'+tr('flipToggle')+'</button></div><div class="flip-face flip-back"><span class="flip-cat">'+p[0]+'</span><h4>'+p[1]+'</h4><strong class="flip-price">'+p[2]+'</strong><a href="'+p[4]+'">'+tr('flipOpen')+' ↗</a></div></div></article>').join('');
   $$('#productDeck .flip-toggle').forEach(b=>b.onclick=()=>{const card=b.closest('.flip-card'),flipped=card.classList.toggle('flipped');b.setAttribute('aria-expanded',String(flipped))});
   $('#countries').innerHTML=countries.map(c=>'<div class="country"><div class="code">'+c[0]+'</div><h3>'+c[1]+'</h3><p>'+(local?local.path:c[2])+'</p></div>').join('');
   const categoryNames=cats.map((c,i)=>local?local.cats[i]:c[0]);
   $('#categoriesGrid').innerHTML=cats.map((c,i)=>'<article class="cat"><div class="tag">0'+(i+1)+'</div><h3>'+categoryNames[i]+'</h3><a href="'+site+c[1]+'">'+tr('openCategory')+'</a></article>').join('');
   const setHomeCategory=i=>{const name=categoryNames[i],route=site+cats[i][1];$('#homeCategoryIndex').textContent=String(i+1).padStart(2,'0')+' / '+tr('homeCategoryKicker');$('#homeCategoryTitleText').textContent=name;$('#homeCategoryText').textContent=tr('homeCategoryDetail');$('#homeCategoryLink').href=route;$$('#homeCategoryList button').forEach((b,n)=>{b.classList.toggle('active',n===i);b.setAttribute('aria-selected',String(n===i))})};
   $('#homeCategoryList').innerHTML=categoryNames.map((name,i)=>'<button type="button" role="tab" aria-selected="'+(i===0)+'" data-category="'+i+'"><span>'+String(i+1).padStart(2,'0')+' · '+name+'</span></button>').join('');
   $$('#homeCategoryList button').forEach(b=>b.onclick=()=>setHomeCategory(+b.dataset.category));setHomeCategory(0);
   const guideRows=local?guides.map((g,i)=>i===0?[g[0],local.guides[0],local.articleParts[0],local.articleParts[1],local.articleParts[2]+'\n\n'+local.articleAddendum,local.callout]:[g[0],local.guides[i],local.article,local.article,local.callout]):guides;$('#guideIndex').innerHTML=guideRows.map((g,i)=>'<button class="'+(i===article?'active':'')+'" data-article="'+i+'">'+g[1]+'</button>').join('');
   const g=guideRows[article],hasThirdParagraph=g.length>5;$('#articleTitle').textContent=g[1];$('#articleP1').textContent=g[2];$('#articleP2').textContent=g[3];$('#articleP3').hidden=!hasThirdParagraph;$('#articleP3').textContent=hasThirdParagraph?g[4]:'';$('#articleCallout').textContent=hasThirdParagraph?g[5]:g[4];
   const faqRows=local?local.faq.map(x=>x.split('|')):faqs;$('#faqList').innerHTML=faqRows.map(f=>'<details><summary>'+f[0]+'</summary><p>'+f[1]+'</p></details>').join('');
   $$('#guideIndex button').forEach(b=>b.onclick=()=>{article=+b.dataset.article;render();$('#seoArticle').scrollTop=0});
  }
  function show(page){if(!['home','categories','workflow','guides','faq'].includes(page))page='home';$$('.page').forEach(x=>x.classList.toggle('active',page==='home'||x.id===page));$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));history.replaceState({},'', '?page='+page);window.scrollTo({top:0,behavior:'auto'})}
  $$('.nav button').forEach(b=>b.onclick=()=>{location.href='?page='+b.dataset.page});$('.brand').onclick=e=>{e.preventDefault();location.href='?page=home'};$('#langToggle').onclick=()=>$('.lang').classList.toggle('open');Object.keys(T).forEach(l=>{let b=document.createElement('button');b.textContent=l.toUpperCase();b.onclick=()=>{lang=l;$('.lang').classList.remove('open');render()};$('#langMenu').appendChild(b)});$('#searchForm').onsubmit=e=>{e.preventDefault();const q=$('#searchInput').value.trim();const destination=q?site+'/search.html?keywords='+encodeURIComponent(q)+'&channelid=2':site+'/AllProducts/';location.assign(destination)};enforceOutboundPolicy();render();show(new URLSearchParams(location.search).get('page')||'home');
