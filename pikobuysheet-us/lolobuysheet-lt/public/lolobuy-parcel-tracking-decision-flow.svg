<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">LoloBuy parcel tracking decision flow</title>
  <desc id="desc">A flow from LoloBuy warehouse shipment through carrier handoffs, customs and delivery, with different responses for normal milestones, action requests and exceptions.</desc>
  <rect width="1200" height="650" rx="36" fill="#f8fafc"/>
  <text x="72" y="74" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">Read the stage before deciding what to do</text>
  <text x="72" y="112" fill="#475569" font-family="Arial, sans-serif" font-size="20">Save the original event, timestamp, carrier and location at every handoff.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#0f766e">
      <rect x="60" y="166" width="168" height="104" rx="18"/>
      <rect x="288" y="166" width="168" height="104" rx="18"/>
      <rect x="516" y="166" width="168" height="104" rx="18"/>
      <rect x="744" y="166" width="168" height="104" rx="18"/>
      <rect x="972" y="166" width="168" height="104" rx="18"/>
    </g>
    <g fill="#fff" font-size="20" font-weight="700">
      <text x="144" y="208">LoloBuy</text><text x="144" y="236">Shipped</text>
      <text x="372" y="208">Export &amp;</text><text x="372" y="236">transport</text>
      <text x="600" y="208">Destination</text><text x="600" y="236">customs</text>
      <text x="828" y="208">Local carrier</text><text x="828" y="236">handoff</text>
      <text x="1056" y="208">Delivery &amp;</text><text x="1056" y="236">inspection</text>
    </g>
    <g fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round">
      <path d="M228 218h52"/><path d="M456 218h52"/><path d="M684 218h52"/><path d="M912 218h52"/>
    </g>
    <g fill="#94a3b8">
      <path d="M278 210l14 8-14 8z"/><path d="M506 210l14 8-14 8z"/><path d="M734 210l14 8-14 8z"/><path d="M962 210l14 8-14 8z"/>
    </g>
  </g>
  <text x="72" y="336" fill="#0f172a" font-family="Arial, sans-serif" font-size="25" font-weight="700">Classify the newest event</text>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="372" width="340" height="196" rx="22" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
    <text x="88" y="414" fill="#075985" font-size="22" font-weight="700">Milestone or quiet interval</text>
    <text x="88" y="454" fill="#334155" font-size="18">• Compare with the live route estimate</text>
    <text x="88" y="486" fill="#334155" font-size="18">• Check the identified carrier's site</text>
    <text x="88" y="518" fill="#334155" font-size="18">• Monitor; do not invent a deadline</text>
    <rect x="430" y="372" width="340" height="196" rx="22" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
    <text x="458" y="414" fill="#92400e" font-size="22" font-weight="700">Action requested</text>
    <text x="458" y="454" fill="#334155" font-size="18">• Verify the official channel</text>
    <text x="458" y="486" fill="#334155" font-size="18">• Supply accurate documents or payment</text>
    <text x="458" y="518" fill="#334155" font-size="18">• Save the request and response</text>
    <rect x="800" y="372" width="340" height="196" rx="22" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
    <text x="828" y="414" fill="#991b1b" font-size="22" font-weight="700">Exception or overdue parcel</text>
    <text x="828" y="454" fill="#334155" font-size="18">• Capture both tracking records</text>
    <text x="828" y="486" fill="#334155" font-size="18">• Open a trace with one evidence packet</text>
    <text x="828" y="518" fill="#334155" font-size="18">• Preserve the case number and outcome</text>
  </g>
  <text x="600" y="620" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="17">Editorial workflow • Recheck the selected route, carrier and account instructions</text>
</svg>
