<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">PikoBuy parcel insurance claim evidence flow</title>
  <desc id="desc">Five stages show the records to save before shipping, at the warehouse, during transit, at delivery and when submitting a claim.</desc>
  <rect width="1200" height="675" rx="32" fill="#f6f2e9"/>
  <rect x="46" y="42" width="1108" height="591" rx="26" fill="#fffdf8" stroke="#151515" stroke-width="3"/>
  <text x="86" y="108" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#151515">Build the claim before the problem</text>
  <text x="86" y="145" font-family="Arial, sans-serif" font-size="18" fill="#555">One evidence chain · five checkpoints · route terms control</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(82 202)">
      <rect width="188" height="260" rx="18" fill="#e6f2ff" stroke="#151515" stroke-width="2"/>
      <circle cx="32" cy="34" r="18" fill="#151515"/><text x="32" y="41" font-size="18" text-anchor="middle" fill="#fff">1</text>
      <text x="20" y="82" font-size="21" font-weight="700">Route terms</text>
      <text x="20" y="118" font-size="16" fill="#333"><tspan x="20">Route + provider</tspan><tspan x="20" dy="27">Insured value</tspan><tspan x="20" dy="27">Covered events</tspan><tspan x="20" dy="27">Exclusions</tspan><tspan x="20" dy="27">Claim deadline</tspan></text>
    </g>
    <path d="M278 332h31" stroke="#151515" stroke-width="3"/><path d="m302 324 10 8-10 8" fill="none" stroke="#151515" stroke-width="3"/>
    <g transform="translate(318 202)">
      <rect width="188" height="260" rx="18" fill="#e9f7ec" stroke="#151515" stroke-width="2"/>
      <circle cx="32" cy="34" r="18" fill="#151515"/><text x="32" y="41" font-size="18" text-anchor="middle" fill="#fff">2</text>
      <text x="20" y="82" font-size="21" font-weight="700">Warehouse</text>
      <text x="20" y="118" font-size="16" fill="#333"><tspan x="20">Seller record</tspan><tspan x="20" dy="27">Item count</tspan><tspan x="20" dy="27">QC photos</tspan><tspan x="20" dy="27">Weight + size</tspan><tspan x="20" dy="27">Packing proof</tspan></text>
    </g>
    <path d="M514 332h31" stroke="#151515" stroke-width="3"/><path d="m538 324 10 8-10 8" fill="none" stroke="#151515" stroke-width="3"/>
    <g transform="translate(554 202)">
      <rect width="188" height="260" rx="18" fill="#fff0d8" stroke="#151515" stroke-width="2"/>
      <circle cx="32" cy="34" r="18" fill="#151515"/><text x="32" y="41" font-size="18" text-anchor="middle" fill="#fff">3</text>
      <text x="20" y="82" font-size="21" font-weight="700">Transit</text>
      <text x="20" y="118" font-size="16" fill="#333"><tspan x="20">Handover date</tspan><tspan x="20" dy="27">Tracking ID</tspan><tspan x="20" dy="27">Carrier scans</tspan><tspan x="20" dy="27">Published time</tspan><tspan x="20" dy="27">Support log</tspan></text>
    </g>
    <path d="M750 332h31" stroke="#151515" stroke-width="3"/><path d="m774 324 10 8-10 8" fill="none" stroke="#151515" stroke-width="3"/>
    <g transform="translate(790 202)">
      <rect width="188" height="260" rx="18" fill="#f6e9fa" stroke="#151515" stroke-width="2"/>
      <circle cx="32" cy="34" r="18" fill="#151515"/><text x="32" y="41" font-size="18" text-anchor="middle" fill="#fff">4</text>
      <text x="20" y="82" font-size="21" font-weight="700">Delivery</text>
      <text x="20" y="118" font-size="16" fill="#333"><tspan x="20">All parcel sides</tspan><tspan x="20" dy="27">Label + seals</tspan><tspan x="20" dy="27">Visible damage</tspan><tspan x="20" dy="27">Opening record</tspan><tspan x="20" dy="27">Carrier note</tspan></text>
    </g>
    <path d="M986 332h31" stroke="#151515" stroke-width="3"/><path d="m1010 324 10 8-10 8" fill="none" stroke="#151515" stroke-width="3"/>
    <g transform="translate(1026 202)">
      <rect width="96" height="260" rx="18" fill="#151515"/>
      <circle cx="48" cy="34" r="18" fill="#fff"/><text x="48" y="41" font-size="18" text-anchor="middle" fill="#151515">5</text>
      <text x="48" y="82" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">Claim</text>
      <text x="48" y="122" font-size="14" text-anchor="middle" fill="#fff"><tspan x="48">Timeline</tspan><tspan x="48" dy="27">Files</tspan><tspan x="48" dy="27">Case ID</tspan><tspan x="48" dy="27">Clause</tspan><tspan x="48" dy="27">Decision</tspan></text>
    </g>
  </g>
  <rect x="82" y="500" width="1040" height="82" rx="16" fill="#f05a3c"/>
  <text x="602" y="534" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#fff">Coverage is not a universal guarantee</text>
  <text x="602" y="561" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#fff">Save the live policy, keep the uninsured amount affordable, and submit before the applicable deadline.</text>
  <text x="86" y="612" font-family="Arial, sans-serif" font-size="13" fill="#777">Independent editorial diagram · pikobuyspreadsheet.pl · verified 7 September 2026</text>
</svg>
