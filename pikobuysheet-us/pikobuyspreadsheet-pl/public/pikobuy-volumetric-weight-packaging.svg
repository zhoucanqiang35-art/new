<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Parcel weight and packaging decision diagram</title>
  <desc id="desc">A planning workflow comparing actual parcel weight with route-specific volumetric weight scenarios before checking live PikoBuy billing.</desc>
  <rect width="1200" height="675" fill="#f4f0e7"/>
  <rect x="42" y="42" width="1116" height="591" rx="28" fill="#fffdf7" stroke="#1b1b18" stroke-width="3"/>
  <text x="86" y="104" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#d34a2c" letter-spacing="2">PARCEL PLANNING</text>
  <text x="86" y="148" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1b1b18">Measure twice. Verify the route once.</text>
  <text x="86" y="183" font-family="Arial, sans-serif" font-size="18" fill="#5b5a52">Dimensions reveal sensitivity; the live route determines billing.</text>

  <rect x="86" y="230" width="282" height="250" rx="20" fill="#e8dfcf" stroke="#1b1b18" stroke-width="2"/>
  <text x="112" y="270" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#d34a2c">01 · MEASURE</text>
  <path d="M132 330l82-47 82 47v93l-82 47-82-47z" fill="#fffdf7" stroke="#1b1b18" stroke-width="3"/>
  <path d="M132 330l82 46 82-46M214 376v94M170 306l84 47" fill="none" stroke="#1b1b18" stroke-width="2"/>
  <text x="112" y="510" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1b1b18">Packed outside dimensions</text>
  <text x="112" y="540" font-family="Arial, sans-serif" font-size="16" fill="#5b5a52">L × W × H in centimetres</text>

  <path d="M392 354h64" stroke="#d34a2c" stroke-width="5" stroke-linecap="round"/>
  <path d="M445 342l16 12-16 12" fill="none" stroke="#d34a2c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="474" y="230" width="282" height="250" rx="20" fill="#f3d6c9" stroke="#1b1b18" stroke-width="2"/>
  <text x="500" y="270" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#d34a2c">02 · COMPARE</text>
  <text x="500" y="322" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1b1b18">Actual weight</text>
  <text x="500" y="354" font-family="Arial, sans-serif" font-size="17" fill="#5b5a52">packed scale reading</text>
  <line x1="500" y1="382" x2="730" y2="382" stroke="#1b1b18" stroke-width="2"/>
  <text x="500" y="423" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1b1b18">Dimensional scenario</text>
  <text x="500" y="454" font-family="Arial, sans-serif" font-size="17" fill="#5b5a52">volume ÷ verified divisor</text>
  <text x="500" y="510" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1b1b18">Keep both values visible</text>
  <text x="500" y="540" font-family="Arial, sans-serif" font-size="16" fill="#5b5a52">Do not guess the route rule</text>

  <path d="M780 354h64" stroke="#d34a2c" stroke-width="5" stroke-linecap="round"/>
  <path d="M833 342l16 12-16 12" fill="none" stroke="#d34a2c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="862" y="230" width="252" height="250" rx="20" fill="#dce7dc" stroke="#1b1b18" stroke-width="2"/>
  <text x="888" y="270" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#28714a">03 · VERIFY</text>
  <circle cx="988" cy="366" r="68" fill="#fffdf7" stroke="#1b1b18" stroke-width="3"/>
  <path d="M951 366l25 25 52-58" fill="none" stroke="#28714a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="888" y="510" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1b1b18">Live route and checkout</text>
  <text x="888" y="540" font-family="Arial, sans-serif" font-size="16" fill="#5b5a52">control the final charge</text>

  <rect x="86" y="574" width="1028" height="1" fill="#c7c0b3"/>
  <text x="86" y="607" font-family="Arial, sans-serif" font-size="15" fill="#5b5a52">Original independent diagram · Example formulas are planning tools, not PikoBuy quotations.</text>
</svg>
