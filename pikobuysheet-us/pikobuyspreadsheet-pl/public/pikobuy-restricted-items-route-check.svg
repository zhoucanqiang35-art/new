<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">PikoBuy restricted-item route-check decision flow</title>
  <desc id="desc">A four-outcome flow that separates prohibited, sensitive, ordinary and unknown items before checking the live shipping route and destination.</desc>
  <rect width="1200" height="675" fill="#f5f1e8"/>
  <rect x="54" y="48" width="1092" height="579" rx="28" fill="#fffdf8" stroke="#171714" stroke-width="3"/>
  <text x="96" y="112" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#171714">Classify first. Verify the live route second.</text>
  <text x="96" y="151" font-family="Arial, sans-serif" font-size="18" fill="#4a4942">Warehouse receipt does not equal international-shipping or customs approval.</text>

  <rect x="96" y="196" width="236" height="154" rx="18" fill="#f9d7ce" stroke="#171714" stroke-width="2"/>
  <text x="120" y="235" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#7b241f">01 · PROHIBITED</text>
  <text x="120" y="276" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#171714">Stop</text>
  <text x="120" y="310" font-family="Arial, sans-serif" font-size="16" fill="#393833">Do not order, conceal</text>
  <text x="120" y="334" font-family="Arial, sans-serif" font-size="16" fill="#393833">or misdeclare the item.</text>

  <rect x="354" y="196" width="236" height="154" rx="18" fill="#ffe7af" stroke="#171714" stroke-width="2"/>
  <text x="378" y="235" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#76520a">02 · SENSITIVE</text>
  <text x="378" y="276" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#171714">Confirm</text>
  <text x="378" y="310" font-family="Arial, sans-serif" font-size="16" fill="#393833">Ask about the exact item,</text>
  <text x="378" y="334" font-family="Arial, sans-serif" font-size="16" fill="#393833">route and destination.</text>

  <rect x="612" y="196" width="236" height="154" rx="18" fill="#dcebd6" stroke="#171714" stroke-width="2"/>
  <text x="636" y="235" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2f5b29">03 · ORDINARY</text>
  <text x="636" y="276" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#171714">Recheck</text>
  <text x="636" y="310" font-family="Arial, sans-serif" font-size="16" fill="#393833">Read the live line rules</text>
  <text x="636" y="334" font-family="Arial, sans-serif" font-size="16" fill="#393833">at parcel submission.</text>

  <rect x="870" y="196" width="236" height="154" rx="18" fill="#dce5f4" stroke="#171714" stroke-width="2"/>
  <text x="894" y="235" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#23456f">04 · UNKNOWN</text>
  <text x="894" y="276" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#171714">Identify</text>
  <text x="894" y="310" font-family="Arial, sans-serif" font-size="16" fill="#393833">Collect contents, quantity,</text>
  <text x="894" y="334" font-family="Arial, sans-serif" font-size="16" fill="#393833">labels and power source.</text>

  <path d="M214 350v54h774v-54" fill="none" stroke="#171714" stroke-width="3"/>
  <path d="M472 350v54M730 350v54" fill="none" stroke="#171714" stroke-width="3"/>
  <path d="M601 404v42" fill="none" stroke="#171714" stroke-width="3"/>
  <path d="M592 438l9 12 9-12" fill="none" stroke="#171714" stroke-width="3"/>

  <rect x="204" y="456" width="792" height="110" rx="20" fill="#171714"/>
  <text x="246" y="500" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f3c94e">FINAL CHECKPOINT</text>
  <text x="246" y="539" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Exact product + current line + destination rules + accurate declaration</text>
  <text x="96" y="601" font-family="Arial, sans-serif" font-size="15" fill="#5f5d54">Independent editorial diagram · pikobuyspreadsheet.pl · verified 11 September 2026</text>
</svg>
