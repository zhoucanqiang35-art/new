name: Deploy PikoBuy Spreadsheet UK manually

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pikobuyspreadsheet-uk-pages-direct
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pikobuyspreadsheet-uk
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pikobuyspreadsheet-uk
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pikobuyspreadsheet-uk/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy UK static pages to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PIKOBUY_UK_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PIKOBUY_UK_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing PIKOBUY_UK_CLOUDFLARE_API_TOKEN repository secret" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing PIKOBUY_UK_CLOUDFLARE_ACCOUNT_ID repository secret" >&2; exit 1; }
          npm exec -- wrangler pages deploy dist/client --project-name pikobuyspreadsheet-uk --branch main --commit-hash "$GITHUB_SHA"
