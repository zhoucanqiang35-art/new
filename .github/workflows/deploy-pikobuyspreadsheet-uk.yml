name: Deploy PikoBuy Spreadsheet UK

on:
  push:
    branches: [main]
    paths:
      - "pikobuyspreadsheet-uk/**"
      - ".github/workflows/deploy-pikobuyspreadsheet-uk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pikobuyspreadsheet-uk-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: pikobuyspreadsheet-uk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pikobuyspreadsheet-uk/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Check Cloudflare deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" >&2; exit 1; }
      - run: npx wrangler pages deploy dist/client --project-name pikobuyspreadsheet-uk --branch main
