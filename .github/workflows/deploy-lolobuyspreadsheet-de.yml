name: Deploy LoloBuy Spreadsheet DE

on:
  push:
    branches: [main]
    paths:
      - "lolobuyspreadsheet-de/**"
      - ".github/workflows/deploy-lolobuyspreadsheet-de.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lolobuyspreadsheet-de-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lolobuyspreadsheet-de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lolobuyspreadsheet-de/package-lock.json
      - run: npm ci
      - run: npm run build:pages
      - run: npx wrangler pages deploy dist --project-name lolobuyspreadsheet-de --branch main
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
