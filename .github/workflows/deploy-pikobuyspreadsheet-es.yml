name: Deploy PikoBuy Spreadsheet ES

on:
  push:
    branches: [main]
    paths:
      - "pikobuyspreadsheet-es/**"
      - ".github/workflows/deploy-pikobuyspreadsheet-es.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pikobuyspreadsheet-es-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: pikobuyspreadsheet-es
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pikobuyspreadsheet-es/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx wrangler pages deploy out --project-name pikobuyspreadsheet-es --branch main
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
