name: Deploy PikoBuySheet ME

on:
  push:
    branches: [main]
    paths:
      - "pikobuysheet-me/**"
      - ".github/workflows/deploy-pikobuysheet-me.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pikobuysheet-me-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" >&2; exit 1; }
      - name: Deploy static site
        run: npx wrangler pages deploy pikobuysheet-me --project-name pikobuysheet-me --branch main
