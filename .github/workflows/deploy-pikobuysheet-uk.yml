name: Deploy PikoBuy Sheet UK

on:
  push:
    branches: [main]
    paths:
      - "pikobuysheet-uk/**"
      - ".github/workflows/deploy-pikobuysheet-uk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pikobuysheet-uk-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: pikobuysheet-uk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build indexable static pages
        run: npm run build
      - name: Check Cloudflare deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" >&2; exit 1; }
      - name: Deploy to Cloudflare Pages
        run: npx wrangler@latest pages deploy dist --project-name pikobuysheet-uk --branch main
