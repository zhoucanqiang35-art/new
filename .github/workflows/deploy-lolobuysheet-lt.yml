name: Deploy LoloBuy Sheet LT

on:
  push:
    branches: [main]
    paths:
      - "lolobuysheet-lt/**"
      - ".github/workflows/deploy-lolobuysheet-lt.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lolobuysheet-lt-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: lolobuysheet-lt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lolobuysheet-lt/package-lock.json
      - run: npm ci
      - run: npm run build:pages
      - run: npx wrangler pages deploy dist --project-name lolobuysheet-lt --branch main
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
      - name: Notify Bing through IndexNow
        run: node scripts/indexnow-payload.mjs | curl --fail-with-body --request POST https://api.indexnow.org/indexnow --header 'Content-Type: application/json; charset=utf-8' --data-binary @-
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
