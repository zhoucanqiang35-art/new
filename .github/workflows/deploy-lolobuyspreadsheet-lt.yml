name: Deploy LoloBuy Spreadsheet LT

on:
  push:
    branches: [main]
    paths:
      - "lolobuyspreadsheet-lt/**"
      - ".github/workflows/deploy-lolobuyspreadsheet-lt.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lolobuyspreadsheet-lt-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: lolobuyspreadsheet-lt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx wrangler pages deploy dist --project-name lolobuyspreadsheet-lt --branch main
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
